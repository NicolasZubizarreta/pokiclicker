/* kanto : Rouge Feu / Vert Feuille : thème de base (tokens.css) ; seuls les rôles de région sont ici */

  --region-accent: #8a6a12;
  --region-argent: #595e67;
  --region-socle: #7fb35f;
  --rayon: 0;
}

  :root:not([data-theme="light"]), [data-region="kanto"]:not([data-theme="light"]) {
    --region-accent: #f5c033;
    --region-argent: #f4efe4;
    --region-socle: #9bd37a;
  }
}

  --region-accent: #f5c033;
  --region-argent: #f4efe4;
  --region-socle: #9bd37a;
}

/* Maquettes PC (phase 5, ticket I). Aucune valeur propre : tout vient de design/tokens.css et regions.css
   (--spacing = 4 px, --text-*, --shadow-*, rôles de couleur). Thème sombre, Kanto. Ordinateur : 1024 px et plus. */
:root {
  color-scheme: dark;
  --font-titre: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
  --u: var(--spacing);
  --cible: calc(var(--u) * 11);          /* 44 px : cible souris et clavier */
  --ecart: calc(var(--u) * 2);
  --trait: calc(var(--u) / 2);
  --voile: color-mix(in srgb, var(--fond) 78%, transparent);
  --lateral: 15rem;
  --entete: calc(var(--u) * 16);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--fond); color: var(--texte); font-family: var(--font-texte); font-size: var(--text-base); line-height: var(--text-base--line-height); font-variant-numeric: tabular-nums; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; text-align: inherit; }
img { display: block; image-rendering: pixelated; }

[hidden] { display: none !important; }

.doux { color: var(--texte-doux); }

h1, h2, h3, .titre { font-family: var(--font-titre); font-weight: 700; }

h2 { font-size: var(--text-xl); line-height: var(--text-xl--line-height); }
h3 { font-size: var(--text-lg); line-height: var(--text-lg--line-height); }
.sous-titre { font-family: var(--font-titre); font-weight: 700; font-size: var(--text-lg); line-height: var(--text-lg--line-height); color: var(--region-accent); }
kbd { display: inline-flex; align-items: center; justify-content: center; min-width: calc(var(--u) * 6); height: calc(var(--u) * 6); padding-inline: var(--u); font: 700 var(--text-xs)/1 var(--font-texte); color: var(--texte-doux); background: var(--fond); border: var(--trait) solid var(--bordure); box-shadow: var(--shadow-sm); }
.plaque kbd, .cle-nav kbd { margin-left: auto; }

/* Cadre, plaques, étiquettes */
.cadre { background: var(--surface); border: var(--trait) solid var(--region-argent); box-shadow: inset 0 0 0 var(--trait) var(--fond), inset 0 0 0 var(--u) var(--region-argent); }

.plaque.action { background: var(--action); color: var(--action-texte); border-color: var(--action-survol); font-weight: 700; }

.plaque.large { width: 100%; }
.plaque.petite { min-height: calc(var(--u) * 9); padding-inline: calc(var(--u) * 3); }
.plaque.carre { width: calc(var(--u) * 14); height: calc(var(--u) * 14); padding: 0; }
.plaque.vertical { flex-direction: column; gap: 0; min-height: calc(var(--u) * 16); padding: var(--u) calc(var(--u) * 2); font-size: var(--text-sm); line-height: var(--text-sm--line-height); position: relative; }
.pastille { position: absolute; top: calc(var(--u) * -2); right: calc(var(--u) * -1); min-width: calc(var(--u) * 6); padding-inline: var(--u); background: var(--info-fond); color: var(--info-texte); border: var(--trait) solid var(--info-base); font-size: var(--text-xs); line-height: calc(var(--u) * 5); text-align: center; font-weight: 700; }
.tag { display: inline-flex; align-items: center; gap: var(--u); height: calc(var(--u) * 7); padding: 0 var(--ecart); background: var(--succes-fond); color: var(--succes-texte); border: var(--trait) solid var(--succes-base); font-size: var(--text-sm); font-weight: 700; white-space: nowrap; }
.tag.info { background: var(--info-fond); color: var(--info-texte); border-color: var(--info-base); }
.tag.alerte, .tag.or { background: var(--alerte-fond); color: var(--alerte-texte); border-color: var(--alerte-base); }
.tag.erreur { background: var(--erreur-fond); color: var(--erreur-texte); border-color: var(--erreur-base); }
.tag.neutre { background: var(--surface-2); color: var(--texte); border-color: var(--bordure); }
.tag.type { background: var(--t); color: var(--tt); border-color: var(--t); }
.tag .ic { width: calc(var(--u) * 4); height: calc(var(--u) * 4); }
button.tag { cursor: pointer; }
.tag.fav-on { background: var(--alerte-fond); color: var(--alerte-texte); border-color: var(--alerte-base); }
.sexe { display: inline-flex; align-items: center; height: calc(var(--u) * 7); font-weight: 700; }
.sexe svg { width: calc(var(--u) * 7); height: calc(var(--u) * 7); fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.sexe.m { color: var(--info-texte); } .sexe.f { color: var(--erreur-texte); }
.message { display: flex; gap: var(--ecart); align-items: flex-start; padding: calc(var(--u) * 3); border: var(--trait) solid var(--bordure); background: var(--surface-2); }
.message.erreur { background: var(--erreur-fond); color: var(--erreur-texte); border-color: var(--erreur-base); }
.message.alerte { background: var(--alerte-fond); color: var(--alerte-texte); border-color: var(--alerte-base); }
.message.succes { background: var(--succes-fond); color: var(--succes-texte); border-color: var(--succes-base); }
.message.info { background: var(--info-fond); color: var(--info-texte); border-color: var(--info-base); }
.maquette { border: var(--trait) dashed var(--bordure); min-height: var(--cible); padding: var(--u) calc(var(--u) * 3); color: var(--texte-doux); font-size: var(--text-sm); line-height: var(--text-sm--line-height); }
.maquette:hover { color: var(--texte); border-color: var(--region-accent); }
.lot-maquette { display: flex; gap: var(--ecart); flex-wrap: wrap; margin-top: auto; padding-top: calc(var(--u) * 4); }
.sync { width: calc(var(--u) * 3); height: calc(var(--u) * 3); border-radius: var(--radius-plein); background: var(--succes-base); border: var(--trait) solid var(--fond); flex: none; }
.sync.cours { background: var(--info-base); } .sync.hors { background: var(--alerte-base); }
.barre-pv, .xp { height: calc(var(--u) * 3); background: var(--fond); border: var(--trait) solid var(--bordure); }
.xp { height: var(--u); border: 0; } .xp i { display: block; height: 100%; background: var(--info-base); }
.barre-pv i { display: block; height: 100%; width: var(--pv, 100%); background: var(--succes-base); transition: width 120ms var(--ease-standard); }

/* Coquille */
.app { display: grid; grid-template-columns: var(--lateral) minmax(0, 1fr); height: 100dvh; max-width: 120rem; margin-inline: auto; background: var(--fond); border-inline: var(--trait) solid var(--bordure); }
.app.sans-lateral { grid-template-columns: minmax(0, 1fr); }
.lateral { display: flex; flex-direction: column; gap: var(--ecart); padding: calc(var(--u) * 4) calc(var(--u) * 3); background: var(--surface); border-right: var(--trait) solid var(--region-argent); box-shadow: inset calc(var(--u) * -1) 0 0 var(--fond), inset calc(var(--u) * -1.5) 0 0 var(--region-argent); min-height: 0; }
.lateral.inerte { opacity: .5; pointer-events: none; }
.marque { display: grid; gap: 0; padding: var(--u) var(--u) calc(var(--u) * 4); }

.cle-nav:hover { background: var(--surface-2); color: var(--texte); }

.cle-nav .point { position: absolute; top: calc(var(--u) * 2); left: calc(var(--u) * 8); width: calc(var(--u) * 3); height: calc(var(--u) * 3); background: var(--succes-base); border: var(--trait) solid var(--surface); }
.lateral .bas { margin-top: auto; display: grid; gap: var(--ecart); padding: calc(var(--u) * 3); background: var(--surface-2); border: var(--trait) solid var(--bordure); font-size: var(--text-sm); line-height: var(--text-sm--line-height); }

.zone-jeu { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.cles { flex: none; display: flex; align-items: center; gap: calc(var(--u) * 10); height: var(--entete); padding: 0 calc(var(--u) * 8); background: var(--surface); border-bottom: var(--trait) solid var(--region-argent); box-shadow: inset 0 calc(var(--u) * -1) 0 var(--fond), inset 0 calc(var(--u) * -1.5) 0 var(--region-argent); }

.ecran.plein { padding-block: calc(var(--u) * 4); }

.legende { flex: none; display: flex; flex-wrap: wrap; gap: calc(var(--u) * 4); align-items: center; padding: var(--u) calc(var(--u) * 8); min-height: calc(var(--u) * 10); border-top: var(--trait) solid var(--bordure); background: var(--surface); font-size: var(--text-sm); color: var(--texte-doux); }

@media (max-width: 1199px) {
  :root { --lateral: 6rem; }
  .marque span, .cle-nav .t, .cle-nav kbd, .lateral .bas { display: none; }
  .marque b { font-size: var(--text-base); text-align: center; } .marque { padding-inline: 0; }
  .cle-nav { flex-direction: column; justify-content: center; gap: 0; font-size: var(--text-sm); padding: 0; }
  .cle-nav .t { display: block; }
  .cles { gap: calc(var(--u) * 6); padding-inline: calc(var(--u) * 5); } .ecran { padding-inline: calc(var(--u) * 5); }
  .cle-nav .point { left: auto; right: calc(var(--u) * 3); }
}

/* Combat */
.combat { display: grid; grid-template-columns: minmax(0, 1fr) 21rem; gap: calc(var(--u) * 5); align-items: start; }

.combat > .gauche { display: flex; flex-direction: column; gap: var(--ecart); min-width: 0; }
.ligne-zone { display: flex; align-items: center; gap: calc(var(--u) * 3); min-height: calc(var(--u) * 12); }

.etapes span { margin-left: var(--ecart); font-weight: 700; }
.nom-zone { font: 700 var(--text-lg)/var(--text-lg--line-height) var(--font-titre); }
.scene { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; max-height: calc(100dvh - 22.5rem); min-height: 15rem; overflow: hidden; padding: 0; background: var(--fond) center / cover no-repeat; container-type: size; }
.scene .info { position: absolute; top: var(--ecart); left: var(--ecart); width: min(48%, 22rem); padding: calc(var(--u) * 3) calc(var(--u) * 4); text-align: left; }

.scene .pv-txt { font-size: var(--text-sm); color: var(--texte-doux); }
.socle { position: absolute; right: 7cqw; bottom: 9cqh; width: 38cqw; height: 24cqh; max-width: 26rem; max-height: 7.5rem; background: var(--region-socle); border-radius: var(--radius-plein); opacity: .85; }
.ennemi { position: absolute; right: calc(7cqw + 19cqw); bottom: calc(9cqh + min(12cqh, 3.75rem) - var(--u) * 2); width: 12rem; height: 12rem; transform: translateX(50%); margin-bottom: calc(var(--u) * -3); transition: transform var(--duration-rapide) var(--ease-standard); }
@container (min-width: 760px) { .ennemi { width: 18rem; height: 18rem; margin-bottom: calc(var(--u) * -4); } }
@container (max-height: 380px) { .ennemi { width: 9rem; height: 9rem; } }

.scene .degat { position: absolute; right: 26cqw; bottom: 55cqh; font: 700 var(--text-3xl)/1 var(--font-titre); color: var(--blanc); text-shadow: 0 var(--trait) 0 var(--fond); opacity: 0; }

@keyframes monte { from { transform: translateY(0); opacity: 1; } to { transform: translateY(calc(var(--u) * -8)); opacity: 0; } }
.scene .radar { position: absolute; right: var(--ecart); bottom: var(--ecart); width: calc(var(--u) * 14); height: calc(var(--u) * 14); display: grid; place-items: center; border-radius: var(--radius-plein); background: var(--surface); border: var(--trait) solid var(--region-argent); }
.scene .radar img { width: calc(var(--u) * 8); height: calc(var(--u) * 8); }
.scene .boss-temps { position: absolute; left: var(--ecart); right: var(--ecart); bottom: var(--ecart); height: calc(var(--u) * 4); background: var(--fond); border: var(--trait) solid var(--bordure); }

.scene .capture-anim { position: absolute; right: calc(7cqw + 19cqw); bottom: calc(9cqh + min(12cqh, 3.75rem)); width: calc(var(--u) * 12); height: calc(var(--u) * 12); transform: translateX(50%); animation: secoue 0.8s var(--ease-standard) infinite; }
@keyframes secoue { 0%, 100% { transform: translateX(50%) rotate(0); } 25% { transform: translateX(50%) rotate(-14deg); } 75% { transform: translateX(50%) rotate(14deg); } }
.ligne-capture { display: flex; gap: var(--ecart); align-items: stretch; height: calc(var(--u) * 14); }

.panneau > .tete { display: flex; align-items: baseline; justify-content: space-between; gap: var(--ecart); }
.equipe-col { display: flex; flex-direction: column; gap: var(--ecart); }
.rang-eq { position: relative; display: grid; grid-template-columns: calc(var(--u) * 14) minmax(0, 1fr); align-items: center; gap: calc(var(--u) * 3); padding: var(--u) calc(var(--u) * 3); background: var(--surface-2); border: var(--trait) solid var(--bordure); min-height: calc(var(--u) * 16); text-align: left; width: 100%; }
.rang-eq:hover { border-color: var(--region-accent); background: var(--selection); }
.rang-eq .sp { width: calc(var(--u) * 14); height: calc(var(--u) * 14); object-fit: contain; }
.rang-eq .t { display: flex; justify-content: space-between; gap: var(--ecart); font-weight: 700; }
.rang-eq .s { display: flex; justify-content: space-between; font-size: var(--text-sm); line-height: var(--text-sm--line-height); color: var(--texte-doux); }

.pret-evoluer::after { content: ""; position: absolute; inset: calc(var(--trait) * -1); pointer-events: none; border: var(--trait) solid var(--alerte-base); animation: clignote var(--duree-carte-clignotement) steps(1) infinite; }
@keyframes clignote { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pret-evoluer::after { animation: none; } }
.pills { display: flex; flex-wrap: wrap; gap: var(--ecart); }

/* Équipe, PC, Pokédex */
.grille-eq { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: calc(var(--u) * 4); }
.carte-pk { position: relative; display: grid; gap: var(--ecart); justify-items: center; text-align: center; padding: calc(var(--u) * 4); background: var(--surface); border: var(--trait) solid var(--bordure); width: 100%; }

.ligne-p { display: flex; align-items: center; gap: calc(var(--u) * 4); min-height: calc(var(--u) * 16); padding: var(--u) calc(var(--u) * 4); background: var(--surface); border: var(--trait) solid var(--bordure); width: 100%; position: relative; text-align: left; }

.ligne-p > .corps { flex: 1; min-width: 0; }
.ligne-p .t { font-weight: 700; display: block; } .ligne-p .s { font-size: var(--text-sm); line-height: var(--text-sm--line-height); color: var(--texte-doux); display: block; }
.ligne-p.ferme { color: var(--texte-doux); background: var(--surface-2); border-style: dashed; }
.ligne-p img.obj { width: calc(var(--u) * 12); height: calc(var(--u) * 12); padding: var(--u); background: var(--surface-2); flex: none; object-fit: contain; }
.outil-barre { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 3); align-items: end; }
.champ { display: grid; gap: var(--u); font-size: var(--text-sm); color: var(--texte-doux); }

.zone-saisie { display: flex; align-items: center; gap: var(--ecart); }
.zone-saisie input, .zone-saisie select { flex: 1; min-width: 0; min-height: var(--cible); padding: 0 calc(var(--u) * 3); background: var(--fond); color: var(--texte); border: var(--trait) solid var(--bordure); font-size: var(--text-base); }
.zone-saisie input:hover, .zone-saisie select:hover { border-color: var(--region-accent); }
.en-erreur .zone-saisie input { border-color: var(--erreur-base); }
.champ .aide { font-size: var(--text-sm); color: var(--texte-doux); }
.pc-corps { display: grid; grid-template-columns: minmax(0, 1fr) 19rem; gap: calc(var(--u) * 5); align-items: start; }
@media (max-width: 1199px) { .pc-corps { grid-template-columns: minmax(0, 1fr) 16rem; } }
.pc-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr)); gap: var(--ecart); }
.case { display: grid; grid-template-columns: calc(var(--u) * 16) minmax(0, 1fr); align-items: center; gap: var(--ecart); min-height: calc(var(--u) * 22); padding: var(--u) calc(var(--u) * 2); text-align: left; background: var(--surface); border: var(--trait) solid var(--bordure); }
.case:hover { border-color: var(--region-accent); background: var(--selection); }

/* Fenêtres */

.gros-sprite-c img.silhouette, .dex-case.inconnu img { filter: brightness(0); opacity: .75; }

.detail-dps div { padding: var(--ecart) calc(var(--u) * 3); background: var(--surface-2); border: var(--trait) solid var(--bordure); }
.detail-dps dt { font-size: var(--text-sm); color: var(--texte-doux); } .detail-dps dd { font-weight: 700; }
.xp-ligne { display: grid; gap: var(--u); } .xp-ligne .xp { height: calc(var(--u) * 2); }
.jauge { display: block; width: calc(var(--u) * 16); height: calc(var(--u) * 3); background: var(--fond); border: var(--trait) solid var(--bordure); position: relative; } .jauge::after { content: ""; position: absolute; inset: 0 auto 0 0; width: calc(var(--p) * 1%); background: var(--erreur-base); }

/* Pokédex, badges */

.badge-carte img { width: calc(var(--u) * 18); height: calc(var(--u) * 18); object-fit: contain; } .badge-carte.manque img, .gros-badge.manque { filter: brightness(0); opacity: .4; }
.badge-carte .nom { font: 700 var(--text-lg)/var(--text-lg--line-height) var(--font-titre); } .badge-carte .s { font-size: var(--text-sm); }

.stat { display: grid; gap: var(--ecart); align-content: start; padding: calc(var(--u) * 5); } .stat .valeur { font: 700 var(--text-4xl)/var(--text-4xl--line-height) var(--font-titre); color: var(--region-accent); }

.guide { display: grid; grid-template-columns: 17rem minmax(0, 1fr); gap: calc(var(--u) * 5); align-items: start; }

/* Menu, réglages, monde */

.tuile:hover { border-color: var(--region-accent); background: var(--selection); }
.tuile .ic { width: calc(var(--u) * 9); height: calc(var(--u) * 9); color: var(--region-accent); } .tuile .t { font: 700 var(--text-lg)/var(--text-lg--line-height) var(--font-titre); } .tuile .s { font-size: var(--text-sm); color: var(--texte-doux); }

.curseur input::-moz-range-thumb { width: calc(var(--u) * 6); height: calc(var(--u) * 6); border-radius: 0; background: var(--surface-2); border: var(--trait) solid var(--texte); }
.monde-corps { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(16rem, 1fr); gap: calc(var(--u) * 5); align-items: start; }
.monde-kanto { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; padding: 0; } .monde-kanto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.monde-kanto .leg { position: absolute; left: var(--ecart); bottom: var(--ecart); display: flex; gap: var(--ecart); align-items: center; padding: var(--ecart) calc(var(--u) * 4); background: var(--surface); border: var(--trait) solid var(--region-argent); font: 700 var(--text-xl)/1 var(--font-titre); }

.cercle { position: absolute; width: calc(var(--u) * 5); height: calc(var(--u) * 5); margin: calc(var(--u) * -2.5) 0 0 calc(var(--u) * -2.5); border-radius: var(--radius-plein); border: var(--trait) solid var(--fond); background: color-mix(in srgb, var(--alerte-base) 70%, transparent); }

.cercle .etiq { position: absolute; left: 50%; bottom: calc(100% + var(--u) * 2); transform: translateX(-50%); padding: 0 var(--ecart); white-space: nowrap; background: var(--surface); border: var(--trait) solid var(--region-argent); font-size: var(--text-sm); font-weight: 700; display: none; z-index: 2; }
.cercle.survol .etiq { display: block; }

.zone-l { position: relative; display: flex; align-items: center; gap: calc(var(--u) * 3); min-height: calc(var(--u) * 14); padding: 0 calc(var(--u) * 4); background: var(--surface); border: var(--trait) solid var(--bordure); text-align: left; width: 100%; flex: none; }
.zone-l:hover:not(.ferme), .zone-l.focus-l { border-color: var(--region-accent); background: var(--selection); }
.zone-l.actuelle { border-color: var(--succes-base); border-width: calc(var(--u) * 0.75); } .zone-l.ferme { color: var(--texte-doux); background: var(--surface-2); border-style: dashed; cursor: default; }

.dresseur { position: absolute; z-index: 2; width: 13.02%; aspect-ratio: 1; object-fit: contain; transform: translate(-50%, -50%); pointer-events: none; }
.vol-overlay { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; pointer-events: none; color: var(--texte); }
.vol-attente { width: 100%; height: min(calc(var(--spacing) * 45), 100%); --vol-attente: calc(var(--vol-ms) * 1ms); }
.vol-piste { position: relative; height: 100%; overflow: hidden; background: var(--fond); transform-origin: right center; animation: vol-ouverture calc(var(--vol-ms) * 1ms) ease-out var(--vol-attente) both; }
.vol-overlay[data-phase="fermeture"] .vol-piste { animation: vol-fermeture calc(var(--vol-ms) * 1ms) ease-in-out forwards; }

.vol-oiseau { transform: scale(2); image-rendering: pixelated; }
@keyframes vol-ouverture { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes vol-fermeture { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes vol-traits { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes vol-trajet { from { transform: translateX(-60%); } to { transform: translateX(60%); } }
.mini-carte.fondu { animation: fondu-carte var(--duration-lent) both; } @keyframes fondu-carte { to { opacity: 0; } }
.modal { display: flex; flex-direction: column; gap: var(--ecart); padding: calc(var(--u) * 5); width: min(26rem, 100%); animation: entre var(--duration-lent) var(--ease-sortie); }
.modal > .tete { display: flex; align-items: center; gap: var(--ecart); } .modal h2 { flex: 1; }
.modal .plaque { justify-content: flex-start; min-height: calc(var(--u) * 14); font-weight: 700; } .modal .plaque kbd { margin-left: auto; }
.modal.centre-carte { position: absolute; z-index: 5; left: 50%; top: 50%; transform: translate(-50%, -50%); animation: none; }

/* Bâtiments */
.decor-page { position: relative; min-height: 14rem; background: var(--surface-2) center / cover no-repeat; border: var(--trait) solid var(--region-argent); display: flex; align-items: flex-end; padding: calc(var(--u) * 5); }
.decor-page .bulle { background: var(--surface); border: var(--trait) solid var(--region-argent); padding: calc(var(--u) * 3) calc(var(--u) * 4); max-width: 34rem; }
.pension-grille { display: grid; grid-template-columns: minmax(0, 2fr) minmax(16rem, 1fr); gap: calc(var(--u) * 5); align-items: start; }

.parent .gros-sprite-c { transform: scale(.9); }
.oeufs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--u); list-style: none; padding: 0; }
.oeufs li { display: grid; place-items: center; align-content: center; min-height: calc(var(--u) * 14); background: var(--surface-2); border: var(--trait) solid var(--bordure); font-size: var(--text-xs); color: var(--texte-doux); }
.produits { display: grid; grid-template-columns: repeat(auto-fill, minmax(21rem, 1fr)); gap: calc(var(--u) * 4); }
.produit { display: flex; align-items: center; gap: calc(var(--u) * 4); padding: calc(var(--u) * 4); background: var(--surface); border: var(--trait) solid var(--bordure); }
.produit:hover { border-color: var(--region-accent); }
.produit.possede { background: var(--surface-2); color: var(--texte-doux); }
.produit img { width: calc(var(--u) * 14); height: calc(var(--u) * 14); padding: var(--ecart); background: var(--surface-2); object-fit: contain; flex: none; }
.produit .corps { flex: 1; min-width: 0; } .produit .t { font-weight: 700; display: block; } .produit .s { font-size: var(--text-sm); color: var(--texte-doux); display: block; }
.produit .plaque { min-width: calc(var(--u) * 26); }
.onglets { display: flex; gap: var(--ecart); }

/* Notifications : calque fixe, ne déplace jamais la page */
.pops { position: absolute; right: calc(var(--u) * 6); bottom: calc(var(--u) * 16); z-index: 60; display: flex; flex-direction: column-reverse; gap: var(--ecart); width: min(26rem, calc(100% - var(--u) * 12)); pointer-events: none; }
.pop { display: flex; align-items: center; gap: calc(var(--u) * 3); padding: calc(var(--u) * 3) calc(var(--u) * 4); font-weight: 700; animation: entre-haut var(--duration-lent) var(--ease-sortie); pointer-events: auto; }

const GUIDE = [["parcours","Parcours principal (A à Z)",["1) Départ chez Maman (Bourg Palette): sors, puis va au Labo du Prof. Chen.","2) Choisis ton starter. Une fois choisi, ouvre la Carte et va sur la Route 1 (première zone).","3) Les dégâts viennent des clics ET du DPS des Pokémon de ton équipe.","4) Chaque zone a 10 étapes. Au boss (étape 10), tu débloques la zone suivante.","5) Tu as 30 secondes pour tuer le boss: si le timer expire, tu reviens à l’étape 9.","6) Capture les Pokémon sauvages pour te faire une équipe solide et avancer plus vite.","7) Utilise le Shop pour acheter des consommables et améliorations. Plus tu avances dans les zones, plus d’objets et d’améliorations se débloquent.","8) Récupère les badges en battant les Arènes: bonus permanents. Tu peux voir leurs effets dans le menu Badges.","9) Complète le Pokédex pour débloquer des paliers et le Charme Chroma. Accès via le menu Pokédex.","10) Bats la Ligue pour accéder au Panthéon."]],["fonctions","Fonctionnalités clés",["- Auto-attaque: active le DPS des Pokémon de l’équipe (bouton « Auto-attaque »).","- Auto-clique (Restes): débloqué en zone Sylphe SARL via l’amélioration Restes. Active un clic automatique via le bouton Auto-clic.","- Auto-stop: stoppe l’auto-combat sur Commun/Peu Commun/Rare/Très Rare/Légendaire/Shiny/Nouveau. Active/désactive via le bouton « Arrêt auto », et configure via le bouton « Réglages de l’arrêt ».","- Poké-Radar: affiche les Pokémon trouvables par zone. Débloqué en zone Cave Taupiqueur via l’amélioration Poké-Radar.","- Fiche résumé: clique sur un Pokémon puis “Résumé” pour voir sexe, types, niveau et bonheur. Depuis cette fiche, tu peux aussi renommer, mettre en favori, relâcher, ou échanger un Pokémon avec le PC.","- Pension: débloquée en zone Bourg Palette (Bourg Palette). Dépose 2 Pokémon pour tenter d’obtenir des œufs. Métamorph = bonus. Même type: 2% de chance d’œuf par combat. Même espèce: 4% par combat. Tu peux acheter plus de slots d’œufs.","- Carte: permet de téléporter vers les zones débloquées.","- Bonheur: augmente en combattant. Il donne un bonus de dégâts. Un Pokémon qui sort d’un œuf démarre à 125 de bonheur. La Baie Grena du Centre commercial donne +2 de bonheur.","- Œufs: récupère un œuf à la pension, mets-le dans ton équipe, puis fais des combats pour l’éclore.","- Menu Stats: accessible via la page Plus. Il récapitule tes statistiques principales."]],["capture","Capture & Repousses",["Affaiblis un Pokémon puis utilise des Pokéballs. Les balls plus fortes augmentent la chance de capture (Super/Hyper/Master).","Repousse: bloque les Pokémon “Commun” pendant un temps. Super Repousse: bloque “Commun” et “Peu Commun”."]],["pokedex","Pokédex & Récompenses",["Accès via le menu Pokédex. Capture des Pokémon pour remplir le Pokédex: chaque palier donne une récompense visible dans la page Pokédex.","Compléter le Pokédex déclenche une scène avec le Prof. Chen qui te remet le Diplôme et le Charme Chroma."]],["pc","PC",["Débloqué en zone Arène d’Argenta. Le PC stocke tes Pokémon capturés. Tu peux trier par numéro, nom, niveau, favori ou Shiny, ou chercher par nom.","Depuis ta team, utilise la fiche Résumé pour envoyer un Pokémon au PC ou en récupérer un."]],["centre","Centre Commercial",["Débloqué via progression (à Céladopole) et accessible depuis la Carte.","Objets exclusifs: Attaque +, Attaque Spé +, Pierres d’évolution, Poké Poupée, Pierre Stase, Calcium, Jeton Shiny.","Les pierres font évoluer certains Pokémon (impossible si Pierre Stase équipée).","Pierre Stase: s’équipe via le Sac sur un Pokémon compatible. Elle bloque toute évolution et donne +25% dégâts. Retrait via le menu du Pokémon dans l’équipe."]],["fauchage","CT Fauchage",["Débloquée en zone Centrale via l’amélioration CT Fauchage au Shop.","Effet: empêche un Pokémon sauvage de mourir (le laisse à 1 PV). Inutilisable sur les boss, avec un cooldown."]],["ligue","Ligue Pokémon",["La Ligue est composée de 10 boss à la suite. Tu affrontes un boss par étape, avec un timer de 30s pour chaque combat.","En battant la Ligue, tu accèdes à la prochaine région."]],["casino","Casino",["Débloqué via progression (à Céladopole). Vous pouvez y acheter des jetons avec vos Pokédollars pour jouer à 3 mini-jeux : la Machine à sous, le Blackjack et le Pile ou Face. Les jetons gagnés peuvent être échangés contre des Pokémon rares (Abra, Insecateur, Minidraco, Porygon) et des objets exclusifs comme la CT Jackpot ou une Master Ball."]],["defi-chen","Défi du Professeur Chen",["Une fois la ligue vaincue et le Pokédex de Kanto complété (151 Pokémon capturés), un défi ultime vous attend au laboratoire du Professeur Chen. Il vous affrontera avec une équipe de 6 Pokémon, tous au niveau 100, incluant un starter avantagé sur le vôtre, Tauros, Noadkoko, Arcanin, Léviator et son puissant Dracolosse. Chaque Pokémon doit être vaincu en moins de 30 secondes. C'est le test final pour devenir le véritable maître de Kanto."]],["easter-eggs","Easter Eggs",["- Renomme un Pokémon en “dinnerbone” ou “grumm” pour l’inverser.","- Renomme en “jeb_” pour un effet arc-en-ciel.","- Renomme en “caca” pour un filtre spécial.","- Renomme en “Daran” pour obtenir un skin de Pokémon exclusif."]]];

/* ---------- PC ---------- */
function pcListe() {
  const q = norm(S.pcQ), num = /^(?:#|n°|n)?\s*(\d+)$/.exec(q);
  const l = S.pc.filter((p) => {
    if (S.pcFav && !p.fav) return false; if (S.pcShiny && !p.shiny) return false; if (S.pcOeuf && !p.oeuf) return false;
    if (!q) return true; if (num) return !p.oeuf && p.n === Number(num[1]);
    return norm(nomP(p)).includes(q) || (!p.oeuf && norm(nomEsp(p.n)).includes(q));
  });
  const cmp = {
    dps: (a, b) => (a.oeuf ? 1 : 0) - (b.oeuf ? 1 : 0) || dpsPc(b) - dpsPc(a) || (a.n || 0) - (b.n || 0),
    numero: (a, b) => (a.oeuf ? 1 : 0) - (b.oeuf ? 1 : 0) || (a.n || 0) - (b.n || 0),
    nom: (a, b) => nomP(a).localeCompare(nomP(b), "fr"), niveau: (a, b) => (b.niveau || 0) - (a.niveau || 0),
    favori: (a, b) => Number(!!b.fav) - Number(!!a.fav), shiny: (a, b) => Number(!!b.shiny) - Number(!!a.shiny),
  }[S.pcTri];
  return l.sort(cmp);
}
function caseP(p) {
  const nom = nomP(p), s = !!p.shiny && !p.oeuf;
  const img = p.oeuf ? `<span class="oeuf-v">${ic("oeuf")}</span>` : `<img class="sp" src="${sprite(p.n, p.shiny)}" width="96" height="96" alt="">`;
  const bas = p.oeuf ? `<span class="s">${pasOeuf(p)}</span>` : `${S.pcTri === "dps" ? `<span class="s dps-l">${nf(dpsPc(p))} DPS</span>` : ""}<span class="s">N° ${p.n} · Niv. ${p.niveau}</span>`;
  return `<button type="button" class="case ${s ? "shiny" : ""} ${p.fav ? "fav" : ""}" data-act="fiche-pc" data-id="${p.id}" aria-label="${esc(nom)}, ${p.oeuf ? pasOeuf(p) : (S.pcTri === "dps" ? nf(dpsPc(p)) + " DPS, " : "") + "niveau " + p.niveau}">${img}<span class="corps"><span class="nom"><span>${esc(nom)}</span>${s ? ic("etincelle") : ""}${sexeHtml(p)}${p.fav ? ic("etoile") : ""}</span>${bas}</span></button>`;
}
function pcCorps() {
  if (!S.pc.length) return `<div class="vide-etat">${ic("pc")}<p><b>Ton PC est vide.</b></p><p class="doux">Capture des Pokémon pour les ranger ici.</p></div>`;
  const l = pcListe();
  if (!l.length) {
    const f = S.pcFav || S.pcShiny || S.pcOeuf;
    return `<div class="vide-etat">${ic("loupe")}<p>${S.pcQ.trim() ? `Aucun Pokémon ne correspond à « ${esc(S.pcQ.trim())} ».` : "Aucun Pokémon ne correspond à ces filtres."}</p>${f || S.pcQ ? `<button type="button" class="plaque" data-act="pc-effacer">Effacer la recherche et les filtres</button>` : ""}</div>`;
  }
  return `<div class="pc-grille">${l.map(caseP).join("")}</div>`;
}

  "cel-choix": (el) => { S.cel = false; rendre(); lancerVol("arene-de-celadopole", el.dataset.v === "combat" ? "combat" : el.dataset.v); },
  "lieu-maman": () => aller("lieu-maman"), "lieu-blue": () => aller("lieu-blue"), "lieu-labo": () => pop("Le Prof. Chen n'a rien de nouveau pour toi.", "info", 2800), "lieu-pension": () => aller("pension"), "lieu-bateau": () => pop("Le bateau vers Johto n'est pas encore là.", "alerte", 2800),
  "egg-daran": () => pop("La télé s'allume : une vidéo de Daran, sans le son.", "info", 3200), soigner: () => pop("Ton équipe est en pleine forme.", "succes", 2600),
  "pension-reprendre": () => pop("Pokémon repris de la Pension.", "info", 2600), "pension-oeuf": () => pop("Un œuf rejoint ton PC.", "succes", 2800),
  sauvegarder: () => { S.sync = "cours"; rendre(); timers.push(setTimeout(() => { S.sync = "ajour"; rendre(); pop("Partie sauvegardée.", "succes", 2400); }, 1400)); },
  "menu-principal": () => attente("Sauvegarde de ta partie…", "Tu vas retrouver tes parties.", 1500, () => { S.page = "c-parties"; rendre(); }),
  inter: (el) => { const k = el.dataset.key; if (k === "lie") S.lie = !S.lie; else if (k.startsWith("arret-")) S.arrets[k.slice(6)] = !S.arrets[k.slice(6)]; else S[k].on = !S[k].on; rendre(); },
  "dex-detail": (el) => { S.dexSel = Number(el.dataset.id); majDex(); }, "dex-fermer": () => { S.dexSel = null; majDex(); }, "dex-filtre": (el) => { S.dexF = el.dataset.v; rendre(); },
  "dex-complet": () => { S.dexComplet = !S.dexComplet; rendre(); }, diplome: () => { S.diplomeOuv = true; rendre(); }, imprimer: () => pop("Impression : maquette sans effet.", "info", 2400),
  "badge-detail": (el) => { S.badgeSel = el.dataset.id; rendre(); }, "badges-cycle": () => { const n = S.badgesObt.length; S.badgesObt = n === 0 ? ["roche"] : n === 1 ? BADGES.map((b) => b[0]) : []; rendre(); },
  "guide-sec": (el) => { S.guideOuv = el.dataset.id; rendre(); },
  starter: (el) => { const n = Number(el.dataset.id); if (S.starter === n) { S.starter = null; EQUIPE.splice(0, EQUIPE.length, [String(n), nomEsp(n), 600]); attente("Direction la Route 1…", "Ton aventure commence.", 1200, () => { S.zone = "route-1"; S.page = "combat"; S.dialogue = true; rendre(); }); } else { S.starter = n; rendre(); } },
  oeil: (el) => { const i = el.parentNode.querySelector("input"); const on = i.type === "password"; i.type = on ? "text" : "password"; el.setAttribute("aria-pressed", String(on)); },
  "hors-reseau": () => { S.hors = true; S.sync = "hors"; aller("c-parties"); },
  ouvrir: (el) => { const p = partie(Number(el.dataset.id)); if (!p) return; if (!S.hors && p.etat === "ailleurs") { S.modal = { type: "ailleurs", id: p.id }; rendre(); } else if (!S.hors && p.etat === "supprimee") { S.modal = { type: "supprimee", id: p.id }; rendre(); } else attente("Chargement de ta partie…", "Récupération de ta sauvegarde.", 1200, () => { S.page = "monde"; rendre(); }); },
  renommer: (el) => { S.modal = { type: "renommer", id: Number(el.dataset.id) }; rendre(); }, supprimer: (el) => { S.modal = { type: "supprimer", id: Number(el.dataset.id) }; rendre(); },
  restaurer: (el) => { S.modal = { type: "restaurer", id: Number(el.dataset.id), etape: 1 }; rendre(); }, "restaurer-choix": (el) => { S.modal.etape = 2; S.modal.choix = Number(el.dataset.v); rendre(); }, "restaurer-retour": () => { S.modal.etape = 1; rendre(); },
  "restaurer-oui": () => { const p = partie(S.modal.id); if (p) p.sauve = "à l'instant"; S.modal = null; rendre(); pop("Sauvegarde précédente restaurée. Les autres appareils sont fermés.", "succes", 3600); },
  "supprimer-oui": () => { S.parties = S.parties.filter((p) => p.id !== S.modal.id); S.modal = null; rendre(); pop("Partie supprimée.", "info", 2600); },
  "reprendre-ici": () => { const p = partie(S.modal.id); if (p) p.etat = "ajour"; S.modal = null; attente("Reprise de ta partie…", "L'autre appareil est en train de se fermer.", 1300, () => { S.page = "monde"; rendre(); pop("Partie reprise ici, exactement là où tu t'étais arrêté.", "info", 3600); }); },
  "oublier-partie": () => { S.parties = S.parties.filter((p) => p.id !== S.modal.id); S.modal = null; rendre(); },
  deco: () => { S.modal = { type: "deco" }; rendre(); },
  "deco-oui": () => { S.modal = null; S.deco = null; S.attente = { t: "Sauvegarde avant la déconnexion…", s: "Ne ferme pas la page : ta partie se synchronise.", barre: true }; rendre(); timers.push(setTimeout(() => { S.attente = null; S.sync = "ajour"; S.page = "c-connexion"; rendre(); }, 1800)); },
  "deco-rester": () => { S.deco = null; S.attente = null; S.sync = "ajour"; rendre(); },
  mdp: () => { S.depuisCompte = true; aller("c-nouveau"); },
  skin: () => { S.skin = !S.skin; rendre(); }, "cycle-sync": () => { S.sync = { ajour: "cours", cours: "hors", hors: "ajour" }[S.sync]; rendre(); },
  reessayer: () => { S.erreur = null; rendre(); pop("Connexion rétablie.", "succes", 2400); },
};
function majDex() { const p = $("#dex-panneau"); if (p) p.innerHTML = dexPanneau(); document.querySelectorAll(".dex-case").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.id) === S.dexSel))); }

document.addEventListener("click", (e) => {
  if (e.target.classList && e.target.classList.contains("couche") && !S.attente) { fermerCouche(); rendre(); return; }
  const a = e.target.closest("[data-act]");
  if (a && ACT[a.dataset.act]) { ACT[a.dataset.act](a, e); return; }
  const g = e.target.closest("[data-go]"); if (g) aller(g.dataset.go);
});
document.addEventListener("input", (e) => {
  const t = e.target, k = t.dataset && t.dataset.cle; if (!k) return;
  if (t.type === "range") { S[k].v = Number(t.value); t.style.setProperty("--p", t.value + "%"); const o = t.parentNode.querySelector("output"); if (o) o.textContent = t.value; return; }
  S[k] = t.value;
  if (k === "pcQ") { const l = $("#liste-pc"); if (l) l.innerHTML = pcCorps(); const c = $("#cpt"); if (c) c.textContent = pcCompte(); }
  if (k === "dexQ") { const l = dexListe(), el = $("#dex-liste"); if (el) el.innerHTML = l.length ? `<div class="dex-grille">${l.map(dexCase).join("")}</div>` : `<div class="vide-etat">${ic("loupe")}<p>Aucune espèce ne correspond.</p></div>`; }
});
document.addEventListener("change", (e) => { const t = e.target; if (t.tagName === "SELECT" && t.dataset.cle) { S[t.dataset.cle] = t.value; rendre(); } });
document.addEventListener("submit", (e) => {
  e.preventDefault(); const f = e.target.dataset.form;
  if (f === "connexion") { S.cx = null; attente("Connexion…", "Un instant.", 900, () => { S.page = "c-parties"; rendre(); }); }
  else if (f === "inscription") { if (val("f-mdp").length < 10) { S.ins = true; rendre(); } else { S.ins = false; attente("Création du compte…", "Un instant.", 900, () => { S.page = "c-parties"; S.parties = []; rendre(); }); } }
  else if (f === "oubli") aller("c-oubli-envoye");
  else if (f === "nouveau") { const d = S.depuisCompte; S.depuisCompte = false; aller(d ? "c-compte" : "c-connexion"); pop("Mot de passe enregistré.", "succes", 2600); }
  else if (f === "creer") { const nom = val("f-nom").trim() || "Nouvelle partie"; S.parties.push({ id: Date.now() % 100000, nom, lieu: "Kanto · Bourg Palette", temps: "0 h 00", sauve: "à l'instant", etat: "ajour" }); S.page = "intro-maman"; rendre(); }
  else if (f === "renommer") { const nom = val("f-nom").trim(); const p = partie(S.modal.id); if (nom && p) p.nom = nom; S.modal = null; rendre(); }
  else if (f === "surnom") { const v = val("f-surnom").trim(), p = pDeFiche(); if (!v || v.length > 12) { S.renomErr = true; rendre(); return; } if (p.eq) S.surEq[p.i] = v; else p.surnom = v; S.renom = false; S.renomErr = false; rendre(); }
});
document.addEventListener("keydown", (e) => {
  const t = e.target, saisie = t.matches && t.matches("input:not([type=range]), textarea, select");
  const dlg_ = $(".couche [role=dialog], .couche [role=alertdialog], .attente-plein");
  if (e.key === "Tab" && dlg_) {
    const f = [...dlg_.querySelectorAll("button:not([disabled]), input:not([disabled]), select, [href]")].filter((x) => x.offsetParent !== null);
    if (f.length) { const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && (i === f.length - 1 || i < 0)) { e.preventDefault(); f[0].focus(); } }
    return;
  }
  if (e.key === "Escape") { if (aUneCouche() && !S.attente && !S.deco) { fermerCouche(); rendre(); } else if (S.choix) { ACT["choix-annuler"](); } return; }
  if (e.ctrlKey || e.metaKey || e.altKey || saisie) return;
  if (e.key === "?") { e.preventDefault(); S.raccourcis = !S.raccourcis; rendre(); return; }
  if (dlg_) { if (S.cel && "123".includes(e.key)) ACT["cel-choix"]({ dataset: { v: ["combat", "commercial", "casino"][Number(e.key) - 1] } }); return; }
  if (enCompte() || enIntro()) return;
  if ("123456".includes(e.key) && e.key.length === 1) {
    if (S.page === "shop" && false) return; const id = NAV[Number(e.key) - 1][0]; aller(id); return;
  }
  if (e.key === "/" && ["pc", "pokedex"].includes(S.page)) { e.preventDefault(); const i = $("#pc-q") || $("#dex-q"); if (i) i.focus(); return; }
  if (S.page === "shop" && false) return;
  if (S.page !== "combat") return;
  const k = e.key.toLowerCase(), sur = t.closest && t.closest("button:not(.scene)");
  if ((e.key === " " || e.key === "Enter") && !sur) { e.preventDefault(); attaquer(); return; }
  const m = { c: "capturer", b: "balle", a: "auto", t: "arret", r: "regl-auto", s: "sac", f: "fauchage", p: "radar" }[k];
  if (m) { e.preventDefault(); ACT[m](); return; }
  if (e.key === "ArrowLeft") { e.preventDefault(); ACT.zone({ dataset: { v: "-1" } }); } if (e.key === "ArrowRight") { e.preventDefault(); ACT.zone({ dataset: { v: "1" } }); }
});
document.addEventListener("mouseover", (e) => { const z = e.target.closest && e.target.closest("[data-zone]"); document.querySelectorAll(".survol,.focus-l").forEach((x) => x.classList.remove("survol", "focus-l")); if (z) document.querySelectorAll(`[data-zone="${z.dataset.zone}"]`).forEach((x) => x.classList.add(x.classList.contains("cercle") ? "survol" : "focus-l")); });
document.addEventListener("focusin", (e) => { const z = e.target.closest && e.target.closest(".zone-l"); document.querySelectorAll(".cercle.survol").forEach((x) => x.classList.remove("survol")); if (z) { const c = document.querySelector(`.cercle[data-zone="${z.dataset.zone}"]`); if (c) c.classList.add("survol"); } });

function demarrer() {
  depart(location.hash.slice(1));
  rendre();
  if (S.volAuto) timers.push(setTimeout(() => lancerVol(S.volAuto), 400));
  timers.push(setInterval(() => { if (S.page === "combat" && S.auto && !S.cs && !aUneCouche() && !document.hidden) attaquer(); }, 1100));
}
window.addEventListener("hashchange", demarrer);
demarrer();

</script>
