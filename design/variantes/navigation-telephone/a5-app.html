/* Maquettes de navigation téléphone (phase 5, ticket C). Aucune valeur propre : tout vient de design/tokens.css
   (--spacing = 4 px, --text-*, --shadow-*, --breakpoint-sm = 390 px, rôles de couleur). Thème sombre, Kanto. */
@font-face { font-family: "Pixelify Sans"; font-weight: 600; font-display: swap; src: url("../combat-v3/fonts/pixelify-sans-latin-600-normal-Dd_Dy7u5.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 400; font-display: swap; src: url("../combat-v3/fonts/atkinson-hyperlegible-next-latin-400-normal-FfmJh7DR.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 600; font-display: swap; src: url("../combat-v3/fonts/atkinson-hyperlegible-next-latin-600-normal-BBuhw47K.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 700; font-display: swap; src: url("../combat-v3/fonts/atkinson-hyperlegible-next-latin-700-normal-Dpiyiu63.woff2") format("woff2"); }

:root {
  color-scheme: dark;
  --u: var(--spacing);
  --cible: calc(var(--u) * 12);          /* 48 px : cible tactile minimale */
  --ecart: calc(var(--u) * 2);           /* 8 px : écart minimal entre cibles */
  --trait: calc(var(--u) / 2);           /* 2 px : liseré */
  --voile: color-mix(in srgb, var(--fond) 78%, transparent);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--surface-2); color: var(--texte); font-family: var(--font-texte); font-size: var(--text-base); line-height: var(--text-base--line-height); font-variant-numeric: tabular-nums; overflow-x: hidden; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; background: none; border: 0; text-align: inherit; }
img { display: block; image-rendering: pixelated; }
:focus-visible { outline: var(--u) solid var(--focus); outline-offset: var(--trait); }
[hidden] { display: none !important; }
.sr { position: absolute; width: var(--u); height: var(--u); overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.pixel { font-family: var(--font-titre); font-weight: 600; }
.doux { color: var(--texte-doux); }
.gras { font-weight: 700; }
svg.ic { width: calc(var(--u) * 6); height: calc(var(--u) * 6); flex: none; fill: none; stroke: currentColor; stroke-width: 2; }

/* Le téléphone */
.tel { position: relative; width: min(100%, var(--breakpoint-sm)); height: 100dvh; max-height: calc(var(--u) * 224); margin-inline: auto; display: flex; flex-direction: column; overflow: hidden; background: var(--fond); }
@media (min-width: 48rem) { .tel { margin-block: var(--u); height: calc(100dvh - var(--u) * 2); border: var(--trait) solid var(--bordure); } }

/* Cadre et plaques */
.cadre { background: var(--surface); border: var(--trait) solid var(--region-argent); box-shadow: inset 0 0 0 var(--trait) var(--fond), inset 0 0 0 var(--u) var(--region-argent); }
.plaque { display: inline-flex; align-items: center; justify-content: center; gap: var(--ecart); min-height: var(--cible); min-width: var(--cible); padding: var(--u) calc(var(--u) * 3); background: var(--surface-2); color: var(--texte); border: var(--trait) solid var(--bordure); box-shadow: var(--shadow-md); transition: transform var(--duration-rapide) var(--ease-standard), box-shadow var(--duration-rapide) var(--ease-standard); }
.plaque:active { transform: translateY(var(--trait)); box-shadow: var(--shadow-sm); }
.plaque.action { background: var(--action); color: var(--action-texte); border-color: var(--action-survol); font-weight: 700; }
.plaque.action:active { background: var(--action-survol); }
.plaque[aria-pressed="true"] { background: var(--selection); border-color: var(--region-accent); color: var(--region-accent); }
.plaque.vertical { flex-direction: column; gap: 0; min-height: calc(var(--u) * 14); padding: var(--u); font-size: var(--text-sm); line-height: var(--text-sm--line-height); }
.pastille { position: absolute; top: calc(var(--u) * -2); right: calc(var(--u) * -1); min-width: calc(var(--u) * 6); padding-inline: var(--u); background: var(--info-fond); color: var(--info-texte); border: var(--trait) solid var(--info-base); font-size: var(--text-xs); line-height: var(--text-sm--line-height); text-align: center; }
.point { position: absolute; top: calc(var(--u) * 2); right: calc(var(--u) * 2); width: calc(var(--u) * 3); height: calc(var(--u) * 3); background: var(--succes-base); border: var(--trait) solid var(--fond); }

/* Chiffres clés */
.cles { flex: none; padding: var(--ecart) calc(var(--u) * 4) var(--ecart); background: var(--surface); border-bottom: var(--trait) solid var(--region-argent); }
.cles .rang { display: flex; align-items: flex-end; gap: calc(var(--u) * 3); }
.cle { flex: 1; min-width: 0; }
.cle.large { flex: 1.25; }
.cle small { display: block; font-size: var(--text-sm); line-height: var(--text-sm--line-height); color: var(--texte-doux); }
.cle b { display: block; font-family: var(--font-titre); font-weight: 600; font-size: var(--text-xl); line-height: var(--text-xl--line-height); color: var(--region-accent); white-space: nowrap; }
.etapes { display: flex; align-items: center; gap: var(--ecart); margin-top: var(--u); }
.etapes i { width: calc(var(--u) * 2); height: calc(var(--u) * 2); background: var(--surface-2); border: var(--trait) solid var(--bordure); }
.etapes i.fait { background: var(--region-accent); border-color: var(--region-accent); }
.etapes i.ici { width: calc(var(--u) * 3); height: calc(var(--u) * 3); background: var(--surface); border-color: var(--region-accent); }
.etapes i.boss { width: calc(var(--u) * 4); height: calc(var(--u) * 4); border-radius: var(--radius-plein); border-color: var(--region-accent); }
.etapes span { margin-left: auto; font-size: var(--text-sm); color: var(--texte-doux); }

/* Écran */
.ecran { flex: 1; min-height: 0; overflow: hidden auto; overscroll-behavior: contain; padding: calc(var(--u) * 3) calc(var(--u) * 4); display: flex; flex-direction: column; gap: var(--ecart); }
.titre-page { display: flex; align-items: center; gap: var(--ecart); min-height: var(--cible); }
.titre-page h1 { font-family: var(--font-titre); font-weight: 600; font-size: var(--text-xl); line-height: var(--text-xl--line-height); flex: 1; }
.titre-page .retour { min-height: var(--cible); min-width: var(--cible); display: inline-flex; align-items: center; justify-content: center; margin-left: calc(var(--u) * -2); }

/* Combat : scène */
.scene { position: relative; display: block; width: 100%; aspect-ratio: 6 / 5; flex: none; padding: 0; overflow: hidden; background: var(--fond) url("../combat-v3/img/route-1.webp") center / cover; }
.scene .info { position: absolute; top: var(--ecart); left: var(--ecart); right: var(--ecart); padding: calc(var(--u) * 2) calc(var(--u) * 3); text-align: left; }
.scene .ligne { display: flex; justify-content: space-between; align-items: baseline; }
.scene .nom { font-family: var(--font-titre); font-weight: 600; font-size: var(--text-xl); line-height: var(--text-xl--line-height); }
.scene .pv { height: calc(var(--u) * 3); margin: var(--u) 0; background: var(--fond); border: var(--trait) solid var(--bordure); }
.scene .pv i { display: block; height: 100%; width: var(--pv, 100%); background: var(--succes-base); transform-origin: left; transition: width 120ms var(--ease-standard); }
.scene .pv-txt { font-size: var(--text-sm); color: var(--texte-doux); }
.scene .socle { position: absolute; left: 50%; bottom: calc(var(--u) * 4); width: calc(var(--u) * 52); height: calc(var(--u) * 9); margin-left: calc(var(--u) * -26); background: var(--region-socle); border-radius: var(--radius-plein); opacity: .85; }
.scene .rattata { position: absolute; left: 50%; bottom: calc(var(--u) * 7); width: calc(var(--u) * 48); height: calc(var(--u) * 48); margin-left: calc(var(--u) * -24); transition: transform var(--duration-rapide) var(--ease-standard); }
.scene.coup .rattata { transform: translateY(calc(var(--u) * 2)) scale(.96); }
.scene .degat { position: absolute; left: 50%; bottom: calc(var(--u) * 44); font-family: var(--font-titre); font-weight: 600; font-size: var(--text-2xl); color: var(--blanc); text-shadow: 0 var(--trait) 0 var(--fond); opacity: 0; }
.scene.coup .degat { animation: monte var(--duration-lent) var(--ease-sortie) forwards; }
@keyframes monte { from { transform: translateY(0); opacity: 1; } to { transform: translateY(calc(var(--u) * -8)); opacity: 0; } }
.scene .conseil { position: absolute; left: 0; right: 0; bottom: var(--u); text-align: center; font-size: var(--text-sm); }
.scene .conseil span { background: var(--voile); padding: 0 var(--ecart); }

/* Combat : barres d'outils, équipe, dialogue */
.outils { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--ecart); flex: none; }
.outils .plaque { position: relative; }
.bande { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--ecart); flex: none; }
.bande button { position: relative; min-width: 0; min-height: var(--cible); aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: var(--surface); border: var(--trait) solid var(--bordure); }
.bande img { width: calc(var(--u) * 12); height: calc(var(--u) * 12); }
.bande em { position: absolute; right: var(--u); bottom: 0; font-style: normal; font-size: var(--text-sm); line-height: var(--text-sm--line-height); font-weight: 700; text-shadow: 0 var(--trait) 0 var(--fond); }
.chen { display: grid; grid-template-columns: calc(var(--u) * 15) 1fr; gap: calc(var(--u) * 3); padding: calc(var(--u) * 3); flex: none; align-items: center; }
.chen img { width: calc(var(--u) * 15); height: calc(var(--u) * 15); }
.chen .pixel { color: var(--region-accent); font-size: var(--text-lg); line-height: var(--text-lg--line-height); }
.chen .zones { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: var(--ecart); }

/* Listes et pages */
.liste { display: flex; flex-direction: column; gap: var(--ecart); }
.ligne-p { display: flex; align-items: center; gap: calc(var(--u) * 3); min-height: calc(var(--u) * 16); padding: var(--u) calc(var(--u) * 3); background: var(--surface); border: var(--trait) solid var(--bordure); width: 100%; position: relative; }
.ligne-p > .corps { flex: 1; min-width: 0; }
.ligne-p .t { font-weight: 700; }
.ligne-p .s { font-size: var(--text-sm); line-height: var(--text-sm--line-height); color: var(--texte-doux); }
.ligne-p img.sp { width: calc(var(--u) * 12); height: calc(var(--u) * 12); flex: none; }
.ligne-p img.obj { width: calc(var(--u) * 15); height: calc(var(--u) * 15); flex: none; padding: calc(var(--u) * 1.5); background: var(--surface-2); }
.ligne-p .xp { height: var(--u); background: var(--fond); margin-top: var(--u); } .ligne-p .xp i { display: block; height: 100%; background: var(--info-base); }
.ligne-p.ferme { color: var(--texte-doux); background: var(--surface-2); border-style: dashed; }
.ligne-p.actuelle { background: var(--selection); border-color: var(--region-accent); }
.chips { display: flex; gap: var(--ecart); flex-wrap: wrap; }
.chips .plaque { flex: 1; padding-inline: var(--u); }
.sous-titre { font-family: var(--font-titre); font-weight: 600; font-size: var(--text-lg); line-height: var(--text-lg--line-height); color: var(--region-accent); margin-top: var(--u); }
.resume { display: grid; grid-template-columns: 1fr 1fr; gap: var(--ecart); padding: calc(var(--u) * 3); }
.resume b { display: block; font-family: var(--font-titre); font-weight: 600; font-size: var(--text-xl); color: var(--region-accent); line-height: var(--text-xl--line-height); }
.explique { display: flex; gap: calc(var(--u) * 3); padding: calc(var(--u) * 3); background: var(--alerte-fond); color: var(--alerte-texte); border: var(--trait) solid var(--alerte-base); }
.explique p { flex: 1; }
.grille-pc { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--ecart); }
.grille-pc button { display: flex; flex-direction: column; align-items: center; min-height: calc(var(--u) * 24); padding: var(--u); background: var(--surface); border: var(--trait) solid var(--bordure); font-size: var(--text-sm); line-height: var(--text-sm--line-height); }
.grille-pc img { width: calc(var(--u) * 12); height: calc(var(--u) * 12); }
.maquette { border: var(--trait) dashed var(--bordure); min-height: var(--cible); padding: var(--u) calc(var(--u) * 3); color: var(--texte-doux); font-size: var(--text-sm); line-height: var(--text-sm--line-height); width: 100%; }

/* Couches : feuille du bas, fenêtre, toast */
.voile { position: absolute; inset: 0; background: var(--voile); z-index: 20; }
.feuille { position: absolute; left: 0; right: 0; bottom: 0; max-height: 50%; z-index: 21; display: flex; flex-direction: column; gap: var(--ecart); padding: calc(var(--u) * 3) calc(var(--u) * 4) calc(var(--u) * 4); overflow-y: auto; animation: entre-bas var(--duration-lent) var(--ease-sortie); }
.fenetre { position: absolute; inset: var(--ecart); z-index: 22; display: flex; flex-direction: column; animation: entre-bas var(--duration-lent) var(--ease-sortie); }

/* Barre du bas (variantes A et B) */

.barre button[aria-current="page"] { background: var(--selection); color: var(--region-accent); font-weight: 700; }

/* Polices embarquées dans le dépôt (aucune ressource externe) : Rubik et Nunito (licence OFL), Atkinson Hyperlegible Next (OFL).

@font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 400; font-display: swap; src: url("fonts/atkinson-hyperlegible-next-latin-ext-400-normal.woff2") format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }

/* A2 : variante A corrigée (retours de Nicolas, 05/11). Même jetons, même composants que commun.css. */
.art { image-rendering: auto; }

/* Chiffres clés : trois chiffres puis la ligne de zone avec ‹ › discrets */

/* Combat A2 */
.capture { display: grid; gap: var(--ecart); flex: none; }
.capture.c1 { grid-template-columns: auto minmax(0, 1fr); }
.capture.c2 { grid-template-columns: repeat(3, calc(var(--u) * 14)) minmax(0, 1fr); }

.capture .plaque.action { font-size: var(--text-lg); }
.capture .balle { justify-content: flex-start; padding-inline: calc(var(--u) * 3); text-align: left; line-height: var(--text-sm--line-height); }
.capture .balle small { font-size: var(--text-sm); color: var(--texte-doux); }
.capture.c2 .plaque.vertical { padding: var(--u); }
.sous-ligne { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ecart); flex: none; }
.sous-ligne .plaque { position: relative; min-height: calc(var(--u) * 14); }

.plaque.tog[aria-pressed="true"] small { color: inherit; }
.plaque.petite { min-height: var(--cible); padding-inline: calc(var(--u) * 3); }

.ligne-p.possede { background: var(--surface-2); color: var(--texte-doux); }
.ligne-p .plaque:disabled { color: var(--texte-doux); border-style: dashed; box-shadow: none; cursor: default; }
.ligne-p .petite { min-width: 0; }

/* Dialogue d'exemple, fenêtre de Chen */
.dialogue { position: absolute; left: var(--ecart); right: var(--ecart); bottom: var(--ecart); z-index: 22; display: grid; grid-template-columns: calc(var(--u) * 15) 1fr; gap: calc(var(--u) * 3); padding: calc(var(--u) * 4); animation: entre-bas var(--duration-lent) var(--ease-sortie); }
.dialogue img { width: calc(var(--u) * 15); height: calc(var(--u) * 15); }

.dialogue .plaque { grid-column: 1 / -1; }
.dialogue .fleche { animation: rebond var(--duree-signal) var(--ease-standard) infinite; display: inline-block; }

/* Équipe en mode choix */
.bandeau-choix { position: sticky; top: calc(var(--u) * -3); z-index: 3; display: flex; align-items: center; gap: var(--ecart); padding: calc(var(--u) * 2) calc(var(--u) * 3); background: var(--info-fond); color: var(--info-texte); border: var(--trait) solid var(--info-base); margin-inline: calc(var(--u) * -1); }
.bandeau-choix p { flex: 1; font-weight: 700; }
.bandeau-choix .plaque { background: var(--surface); color: var(--texte); }
.liste.choix .ligne-p { border-color: var(--info-base); }

/* Shop */
.onglets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--ecart); flex: none; }

/* Carte */
.carte-page { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--ecart); }
.liste-zones { flex: 1; min-height: 0; overflow: hidden auto; display: flex; flex-direction: column; gap: var(--ecart); padding-right: var(--u); }
.zone { min-height: calc(var(--u) * 14); padding-block: 0; }
.zone.actuelle { background: var(--selection); border-color: var(--succes-base); }
.zone .marque { width: calc(var(--u) * 3); height: calc(var(--u) * 3); background: var(--succes-base); border-radius: var(--radius-plein); flex: none; }
.zone[aria-disabled="true"] { color: var(--texte-doux); background: var(--surface-2); border-style: solid; }
.mini-carte { position: relative; flex: none; aspect-ratio: 16 / 9; overflow: hidden; background: var(--fond); }
.mini-carte img { position: absolute; inset: 0; width: 100%; height: 100%; }
.cercle { position: absolute; width: calc(var(--u) * 3.5); height: calc(var(--u) * 3.5); margin: calc(var(--u) * -1.75) 0 0 calc(var(--u) * -1.75); border-radius: var(--radius-plein); border: var(--trait) solid var(--fond); background: color-mix(in srgb, var(--alerte-base) 55%, transparent); }
.cercle.ferme { background: color-mix(in srgb, var(--texte-doux) 55%, transparent); border-color: color-mix(in srgb, var(--fond) 60%, transparent); }
.cercle.actuel { background: var(--succes-base); border-color: var(--blanc); width: calc(var(--u) * 4.5); height: calc(var(--u) * 4.5); margin: calc(var(--u) * -2.25) 0 0 calc(var(--u) * -2.25); }
.vol { position: absolute; left: 0; top: 0; transition: transform var(--duree-signal) var(--ease-standard); width: calc(var(--u) * 6); height: calc(var(--u) * 6); margin: calc(var(--u) * -3) 0 0 calc(var(--u) * -3); border-radius: var(--radius-plein); background: var(--succes-base); border: var(--trait) solid var(--blanc); box-shadow: var(--shadow-sm); z-index: 2; }
.liste-zones.vole { pointer-events: none; opacity: .6; }
.centre-modal { position: absolute; inset: 0; z-index: 22; display: grid; place-items: center; padding: calc(var(--u) * 4); }
.modal { width: 100%; display: flex; flex-direction: column; gap: var(--ecart); padding: calc(var(--u) * 4); animation: entre-bas var(--duration-lent) var(--ease-sortie); }
.modal .tete { display: flex; align-items: center; gap: var(--ecart); }
.modal h2 { flex: 1; font-family: var(--font-titre); font-weight: 600; font-size: var(--text-xl); line-height: var(--text-xl--line-height); }
.modal .plaque { justify-content: flex-start; min-height: calc(var(--u) * 14); font-weight: 700; }

/* Menu, parties, monde */
.partie-active { padding: calc(var(--u) * 4); display: grid; gap: var(--ecart); }
.partie-active .nom, .partie .nom { font-family: var(--font-titre); font-weight: 600; font-size: var(--text-xl); line-height: var(--text-xl--line-height); }
.etat-sauve { display: flex; align-items: center; gap: var(--ecart); color: var(--succes-texte); }
.etat-sauve svg { color: var(--succes-base); }
.partie { display: grid; gap: var(--u); padding: calc(var(--u) * 4); width: 100%; text-align: left; }
.partie.en-cours { border-color: var(--succes-base); }
.partie dl { display: grid; grid-template-columns: auto 1fr; gap: 0 calc(var(--u) * 3); }
.partie dt { color: var(--texte-doux); font-size: var(--text-sm); line-height: var(--text-sm--line-height); }
.partie dd { margin: 0; text-align: right; }
.tag { display: inline-block; padding: 0 var(--ecart); background: var(--succes-fond); color: var(--succes-texte); border: var(--trait) solid var(--succes-base); font-size: var(--text-sm); line-height: var(--text-sm--line-height); }
.partie.nouvelle { border-style: dashed; color: var(--texte-doux); display: flex; align-items: center; justify-content: center; gap: var(--ecart); min-height: calc(var(--u) * 16); }
.compte { padding: calc(var(--u) * 4); display: grid; gap: var(--ecart); }
.reglage { display: flex; align-items: center; gap: calc(var(--u) * 3); min-height: calc(var(--u) * 14); padding: var(--u) calc(var(--u) * 3); background: var(--surface); border: var(--trait) solid var(--bordure); }
.reglage > span { flex: 1; }
.monde-kanto { position: relative; display: block; width: 100%; padding: 0; overflow: hidden; }
.monde-kanto img { width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; }
.monde-kanto .legende { display: flex; align-items: center; gap: var(--ecart); padding: calc(var(--u) * 3); }
.monde-kanto .legende b { flex: 1; font-family: var(--font-titre); font-weight: 600; font-size: var(--text-lg); line-height: var(--text-lg--line-height); }
.regions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ecart); }
.region { display: flex; align-items: center; gap: calc(var(--u) * 3); min-height: calc(var(--u) * 16); padding: var(--u) calc(var(--u) * 3); background: var(--surface-2); border: var(--trait) dashed var(--bordure); color: var(--texte-doux); }
.region small { display: block; font-size: var(--text-sm); line-height: var(--text-sm--line-height); }
.partie-active .infos { display: grid; grid-template-columns: auto 1fr; gap: 0 calc(var(--u) * 3); }
.partie-active .infos dt { color: var(--texte-doux); }
.partie-active .infos dd { margin: 0; text-align: right; }
.ligne-compte { display: flex; align-items: center; gap: calc(var(--u) * 3); }
.ligne-compte .corps { flex: 1; min-width: 0; }
.ecran.plein { overflow: hidden; }
.outils .plaque { text-align: center; }
.fenetre.sac { bottom: auto; top: calc(var(--u) * 6); max-height: calc(100% - var(--u) * 12); }
.monde-kanto, .partie, .partie-active, .compte, .regions, .reglage, .onglets, .titre-page { flex: none; }
.ecran > .liste { flex: none; }

/* A4 : A3 corrigée (retours de Nicolas, 05/11) + PC, Pokédex, Badges, Guide, Statistiques. Mêmes jetons. */

/* Police : Atkinson Hyperlegible Next, gras, pour les chiffres et les titres (retour de Nicolas). Fichiers dans fonts/, aucune ressource externe. */
:root { --font-titre: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif; }
.pixel, .cle b, .titre-page h1, .scene .nom, .scene .degat, .sous-titre, .resume b, .fenetre > .tete h2, .feuille .tete h2, .toast, .modal h2 { font-weight: 700; }

/* Mise en page fluide : l'appli remplit la largeur, jamais de bord ni de cadre ; au-delà de 480 px, le fond reste le même. */
body { background: var(--fond); }
.tel { width: 100%; max-width: calc(var(--u) * 120); max-height: none; }
@media (min-width: 48rem) { .tel { margin-block: 0; height: 100dvh; border: 0; } }

/* Chiffres clés : trois colonnes, même police, même taille, même ligne de base, même alignement */
.cles { position: relative; }
.cles .rang { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1.3fr); gap: calc(var(--u) * 3); align-items: start; }
.cles .cle, .cles .cle.large, .cles .cle.zone { flex: none; min-width: 0; text-align: left; }
.cles .cle small { white-space: nowrap; }
.cles .cle b { font-size: var(--text-lg); line-height: var(--text-lg--line-height); overflow: hidden; text-overflow: ellipsis; }
.synchro { position: absolute; top: var(--ecart); right: calc(var(--u) * 4); width: calc(var(--u) * 3); height: calc(var(--u) * 3); border-radius: var(--radius-plein); background: var(--succes-base); border: var(--trait) solid var(--fond); }
.synchro.cours { background: var(--info-base); }
.synchro.hors { background: var(--alerte-base); }
.synchro.conflit { background: var(--erreur-base); }

.bande img { width: min(calc(var(--u) * 12), 100%); height: auto; }

/* Combat : quatre boutons sur une ligne, puis Fauchage et Poké-Radar quand ils sont débloqués */
.outils4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--ecart); flex: none; }
.outils4 .plaque { position: relative; min-height: calc(var(--u) * 16); padding-inline: var(--u); text-align: center; }
.outils4 .plaque .t { display: block; }
.debloques { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ecart); flex: none; }
.debloques .plaque { min-height: calc(var(--u) * 14); }
.debloques img { width: calc(var(--u) * 6); height: calc(var(--u) * 6); }
.lot-maquette { display: grid; gap: var(--ecart); flex: none; }

/* Interrupteur et curseur */
.reglage .corps-r { flex: 1; min-width: 0; }
.reglage small { display: block; font-size: var(--text-sm); line-height: var(--text-sm--line-height); color: var(--texte-doux); }
.inter { display: inline-flex; align-items: center; justify-content: center; flex: none; min-width: calc(var(--u) * 16); min-height: var(--cible); }
.inter i { position: relative; display: block; width: calc(var(--u) * 12); height: calc(var(--u) * 7); background: var(--fond); border: var(--trait) solid var(--bordure); }
.inter i::after { content: ""; position: absolute; top: var(--trait); left: var(--trait); width: calc(var(--u) * 5); height: calc(var(--u) * 5); background: var(--texte-doux); transition: transform var(--duration-rapide) var(--ease-standard); }
.inter[aria-checked="true"] i { background: var(--succes-fond); border-color: var(--succes-base); }
.inter[aria-checked="true"] i::after { background: var(--succes-base); transform: translateX(calc(var(--u) * 5)); }
.reglage.son { flex-direction: column; align-items: stretch; gap: 0; padding-block: var(--u); }
.reglage.son .haut { display: flex; align-items: center; gap: calc(var(--u) * 3); min-height: calc(var(--u) * 14); }
.reglage.son .haut > span { flex: 1; min-width: 0; }
.curseur { display: flex; align-items: center; gap: calc(var(--u) * 3); }
.curseur output { min-width: calc(var(--u) * 10); text-align: right; font-family: var(--font-titre); font-weight: 700; }
.curseur input { flex: 1; min-width: 0; height: var(--cible); background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; --p: 50%; }
.curseur input:disabled { opacity: .4; cursor: default; }
.curseur input::-webkit-slider-runnable-track { height: calc(var(--u) * 3); background: linear-gradient(to right, var(--action) var(--p), var(--fond) var(--p)); border: var(--trait) solid var(--bordure); }
.curseur input::-moz-range-track { height: calc(var(--u) * 3); background: var(--fond); border: var(--trait) solid var(--bordure); }
.curseur input::-moz-range-progress { height: calc(var(--u) * 3); background: var(--action); }
.curseur input::-webkit-slider-thumb { -webkit-appearance: none; width: calc(var(--u) * 7); height: calc(var(--u) * 7); margin-top: calc(var(--u) * -2.5); background: var(--surface-2); border: var(--trait) solid var(--texte); }
.curseur input::-moz-range-thumb { width: calc(var(--u) * 6); height: calc(var(--u) * 6); border-radius: 0; background: var(--surface-2); border: var(--trait) solid var(--texte); }
.fenetre .intro { flex: none; }
.fenetre .sous-titre { flex: none; }

/* Carte : animation de vol reprise du jeu PC (src/styles/index.css, src/ui/VolGen1.tsx), mêmes éléments et mêmes durées */
.dresseur { position: absolute; z-index: 2; width: 13.02%; aspect-ratio: 1; object-fit: contain; transform: translate(-50%, -50%); pointer-events: none; }
.mini-carte img.dresseur { inset: auto; width: 13.02%; height: auto; }
.mini-carte img.vol-oiseau { position: static; inset: auto; width: auto; height: auto; }
.vol-overlay { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; pointer-events: none; color: var(--texte); }
.vol-attente { width: 100%; height: min(calc(var(--spacing) * 45), 100%); --vol-attente: calc(var(--vol-ms) * 1ms); }
.vol-piste { position: relative; height: 100%; overflow: hidden; background: var(--fond); transform-origin: right center; animation: vol-ouverture calc(var(--vol-ms) * 1ms) ease-out var(--vol-attente) both; }
.vol-overlay[data-phase="fermeture"] .vol-piste { animation: vol-fermeture calc(var(--vol-ms) * 1ms) ease-in-out forwards; }
.vol-traits { position: absolute; inset: 0; display: flex; width: 200%; height: 100%; animation: vol-traits calc(var(--vol-ms) * 1ms) linear infinite; }
.vol-traits > svg { flex: 0 0 50%; height: 100%; }
.vol-trajet { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; animation: vol-trajet calc(var(--vol-ms) * 1ms) ease-in-out both; }

.dps-gros { font-family: var(--font-titre); font-weight: 700; font-size: var(--text-3xl); line-height: var(--text-3xl--line-height); color: var(--region-accent); }

.barre-xp { height: calc(var(--u) * 2); background: var(--fond); }

.bonheur { display: flex; align-items: center; gap: calc(var(--u) * 3); }
.jauge { --p: 50; flex: none; width: calc(var(--u) * 14); aspect-ratio: 1; border-radius: var(--radius-plein); background: conic-gradient(var(--succes-base) calc(var(--p) * 1%), var(--fond) 0); display: grid; place-items: center; }

.actions-fiche { display: grid; gap: var(--ecart); }

.renommer-form { display: grid; gap: var(--ecart); }
.renommer-form .rang-boutons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ecart); }

/* ---------- Pokédex ---------- */
.progres { height: calc(var(--u) * 3); background: var(--fond); border: var(--trait) solid var(--bordure); }

.palier .s { display: block; font-size: var(--text-sm); line-height: var(--text-sm--line-height); color: var(--texte-doux); }
.dex-grille { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--ecart); }
.dex-case { display: grid; justify-items: center; align-content: start; min-height: calc(var(--u) * 30); padding: var(--u); background: var(--surface); border: var(--trait) solid var(--bordure); text-align: center; min-width: 0; }

.dex-case .n { font-size: var(--text-sm); line-height: var(--text-sm--line-height); color: var(--texte-doux); }
.dex-case .nom { font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dex-case.inconnu { background: var(--surface-2); }
.dex-case.inconnu img, .gros-sprite.silhouette { filter: brightness(0); opacity: .55; }
.dex-case .capt { display: inline-flex; align-items: center; gap: var(--u); font-size: var(--text-sm); line-height: var(--text-sm--line-height); color: var(--succes-texte); }
.dex-case .capt .ic { width: calc(var(--u) * 3.5); height: calc(var(--u) * 3.5); }

/* ---------- Badges ---------- */
.badges-grille { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ecart); }
.badge-carte { display: grid; justify-items: center; align-content: start; gap: var(--u); min-height: calc(var(--u) * 40); padding: calc(var(--u) * 3); background: var(--surface); border: var(--trait) solid var(--bordure); text-align: center; min-width: 0; }

.stat dl { display: grid; grid-template-columns: auto 1fr; gap: 0 calc(var(--u) * 3); margin: 0; }

.reprise-liste { display: grid; gap: var(--ecart); margin: 0; padding: 0; list-style: none; }

.diplome-img { width: 100%; height: auto; display: block; }

/* Fenêtres courtes (détail d espèce, de badge, diplôme) : ancrées en haut, pas plein écran */
.fenetre.court { bottom: auto; top: calc(var(--u) * 6); max-height: calc(100% - var(--u) * 12); }

/* A5 : retours de Nicolas sur A4. S'ajoute à a4.css et a4-ecrans.css, rien n'est modifié dans A4. */

.tri-select .zone-saisie { position: relative; }
.tri-select select { flex: 1; min-width: 0; height: calc(var(--u) * 14); padding-inline: calc(var(--u) * 3) calc(var(--u) * 12); background: var(--fond); color: var(--texte); border: var(--trait) solid var(--bordure); font: inherit; font-weight: 700; appearance: none; -webkit-appearance: none; border-radius: 0; }

.case .dps-ligne { color: var(--region-accent); font-weight: 700; }

/* Fiche : pastilles de la ligne (sexe, Shiny, Favori, types) à la même hauteur */
.rangee { --h-pastille: calc(var(--u) * 7); }

.sexe svg { width: 1.3em; height: 1.3em; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.rangee .sexe svg { width: var(--h-pastille); height: var(--h-pastille); }

.tag.type { background: var(--t); color: var(--tt); border-color: var(--t); }

/* Favori : même taille que les autres pastilles, zone de toucher agrandie à 48 px par un pseudo-élément */
.tag-btn { position: relative; cursor: pointer; }
.tag-btn::after { content: ""; position: absolute; inset: calc(var(--u) * -2.5) calc(var(--u) * -1); }
.tag.fav-on { background: var(--alerte-fond); color: var(--alerte-texte); border-color: var(--alerte-base); }

.case .sexe svg { width: 1.1em; height: 1.1em; }

<script>
/* Contenu fictif commun aux quatre variantes (même texte partout : on compare des navigations, pas des contenus).
   Sprites et objets : images du dépôt, par chemin relatif (design/variantes/combat-v3/img). */
const IMG = "../combat-v3/img/";
const PK = {
  etat: { pcOuvert: false, pieces: 250000, pv: 152, pvMax: 152 },
  nf: (n) => n.toLocaleString("fr-FR"),

  cles() {

      <div class="rang">
        <div class="cle large"><small>Pièces</small><b id="pieces">${this.nf(this.etat.pieces)}</b></div>
        <div class="cle"><small>DPS</small><b>${this.nf(40365)}</b></div>
        <div class="cle"><small>Zone</small><b>Route 1</b></div>
        ${this.suiteCles || ""}
      </div>
      <div class="etapes" role="img" aria-label="Étape 1 sur 10">${marques}<span>1/10</span></div>
    </header>`;
  },

  combat({ outils = true } = {}) {

    return `

      <span class="info cadre"><span class="ligne"><span class="nom">Rattata</span><span>Niv. 2</span></span>

        <span class="pv-txt" id="pvtxt">PV ${this.etat.pv} / ${this.etat.pvMax}</span></span>
      <span class="socle"></span>
      <img class="rattata" src="${IMG}19.png" width="96" height="96" alt="">
      <span class="degat" id="degat">−412</span>
    </button>
    ${outils ? `<div class="outils">
      <button type="button" class="plaque vertical" data-act="capturer">${this.ic("balle")}Capturer<span class="pastille">×50</span></button>
      <button type="button" class="plaque vertical" aria-pressed="false" data-act="auto">${this.ic("auto")}Auto</button>
      <button type="button" class="plaque vertical" data-go="sac">${this.ic("sac")}Sac<span class="pastille">82</span></button>

      <div class="zones">
        <button type="button" class="plaque">Zone précédente</button>
        <button type="button" class="plaque action">Zone suivante</button>
      </div>
    </section>`;

  equipe() {
    const lignes = [["1", "Florizarre", 100, 9420], ["4", "Dracaufeu", 100, 8910], ["16", "Roucool", 100, 5120], ["25", "Pikachu", 100, 8300], ["26", "Raichu", 100, 7615], ["21", "Piafabec", 100, 5000]]
      .map(([n, nom, l, d]) => `<button type="button" class="ligne-p"><img class="sp" src="${IMG}${n}.png" width="96" height="96" alt=""><span class="corps"><span class="t">${nom}</span><br><span class="s">Niv. ${l} · ${this.nf(d)} DPS</span><span class="xp" style="display:block"><i style="display:block;width:100%"></i></span></span>${this.ic("chevron")}</button>`).join("");

  shop() {
    const obj = [["poke-ball", "Poké Ball", "Une chance de capturer", "200"], ["great-ball", "Super Ball", "Capture plus sûre", "600"], ["ultra-ball", "Hyper Ball", "La meilleure des balles", "1 200"],
      ["repel", "Repousse", "Moins de rencontres, 15 s", "350"], ["x-attack", "Attaque +", "Dégâts ×1,5 pendant 30 s", "800"], ["rare-candy", "Bonbon rare", "+1 niveau", "4 800"],

    return `<div class="liste">${z.map(([n, s, c]) => `<button type="button" class="ligne-p ${c}"><span class="corps"><span class="t">${n}</span><br><span class="s">${s}${c === "actuelle" ? " · tu es ici" : ""}</span></span>${this.ic("chevron")}</button>`).join("")}</div>`;

  lignesPlus({ avecPc = true } = {}) {
    const ouvert = this.etat.pcOuvert;
    const pc = avecPc ? `<button type="button" class="ligne-p ${ouvert ? "" : "ferme"}" data-go="pc">${this.ic(ouvert ? "pc" : "cadenas")}<span class="corps"><span class="t">PC de Léo</span><br><span class="s">${ouvert ? "12 Pokémon rangés" : "Après l'arène d'Argenta"}</span></span>${this.ic("chevron")}</button>` : "";
    const l = (go, ic, t, s) => `<button type="button" class="ligne-p" data-go="${go}">${this.ic(ic)}<span class="corps"><span class="t">${t}</span><br><span class="s">${s}</span></span>${this.ic("chevron")}</button>`;
    return pc + l("pokedex", "pokedex", "Pokédex", "47 vus sur 151") + l("badges", "badge", "Badges", "0 sur 8") + l("parties", "parties", "Mes parties", "Sauvegardes et compte") + l("reglages", "reglages", "Réglages", "Son, thème, arrêt auto");

  aventure() {
    return `<div class="resume cadre"><div><small class="doux">Région</small><b>Kanto</b></div><div><small class="doux">Pokédex</small><b>47/151</b></div><div><small class="doux">Badges</small><b>0/8</b></div><div><small class="doux">DPS</small><b>${this.nf(40365)}</b></div></div>`;
  },

  /* PC : verrouillé = on explique et on dit comment le débloquer ; ouvert = bande d'équipe + grille. */
  pc() {
    if (!this.etat.pcOuvert) {
      return `<div class="explique">${this.ic("cadenas")}<p><b>Le PC n'est pas encore à toi.</b> Il se débloque quand tu bats l'arène d'Argenta.</p></div>
        <button type="button" class="maquette" data-act="debloquer-pc">Maquette : simuler la victoire à l'arène d'Argenta</button>`;
    }
    const b = [["7", "Carapuce"], ["95", "Onix"], ["19", "Rattata"], ["16", "Roucool"], ["25", "Pikachu"], ["4", "Salamèche"]];
    return `<div class="grille-pc">${b.map(([n, nom]) => `<button type="button"><img src="${n === "7" || n === "95" ? "../../specimens/assets/pokemon/" + n + ".png" : IMG + n + ".png"}" width="96" height="96" alt=""><span>${nom}</span></button>`).join("")}</div>
      <button type="button" class="maquette" data-act="verrouiller-pc">Maquette : verrouiller à nouveau le PC</button>`;
  },
  page(nom) {
    const m = { equipe: () => this.equipe(), shop: () => this.shop(), carte: () => this.carte(), pc: () => this.pc(),
      plus: () => this.aventure() + `<div class="liste">${this.lignesPlus()}</div>` };
    return (m[nom] || (() => `<p class="doux">Contenu de la page « ${nom} » : hors périmètre de ce ticket.</p>`))();
  },
  titres: { combat: "Combat", equipe: "Équipe", shop: "Shop", carte: "Carte", pc: "PC de Léo", plus: "Plus", sac: "Sac", outils: "Outils", pokedex: "Pokédex", badges: "Badges", parties: "Mes parties", reglages: "Réglages", aventure: "Ton aventure" },

  /* Interactions communes : toucher la scène, toast */
  scene(racine) {
    const s = racine.querySelector("#scene"); if (!s) return;
    s.addEventListener("click", () => {
      s.classList.remove("coup"); void s.offsetWidth; s.classList.add("coup");
      this.etat.pv -= 12; if (this.etat.pv <= 0) { this.etat.pv = this.etat.pvMax; this.etat.pieces += 150; const p = document.getElementById("pieces"); if (p) p.textContent = this.nf(this.etat.pieces); }
      racine.querySelector("#pv").style.setProperty("--pv", (this.etat.pv / this.etat.pvMax * 100) + "%");
      racine.querySelector("#pvtxt").textContent = `PV ${this.etat.pv} / ${this.etat.pvMax}`;
    });
    racine.querySelectorAll("[data-act=auto]").forEach((b) => b.addEventListener("click", () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true")));
  },
  toast(texte, ms = 3000) {
    const t = document.createElement("div"); t.className = "toast cadre"; t.setAttribute("role", "status"); t.textContent = texte;
    document.getElementById("tel").appendChild(t); setTimeout(() => t.remove(), ms);
  },
};

/* Guide du jeu : data/guide.json, valeurs entre accolades remplacées par celles des réglages (étapes 10, minuteur du boss 30 s…). */
const GUIDE = [["parcours","Parcours principal (A à Z)",["1) Départ chez Maman (Bourg Palette): sors, puis va au Labo du Prof. Chen.","2) Choisis ton starter. Une fois choisi, ouvre la Carte et va sur la Route 1 (première zone).","3) Les dégâts viennent des clics ET du DPS des Pokémon de ton équipe.","4) Chaque zone a 10 étapes. Au boss (étape 10), tu débloques la zone suivante.","5) Tu as 30 secondes pour tuer le boss: si le timer expire, tu reviens à l’étape 9.","6) Capture les Pokémon sauvages pour te faire une équipe solide et avancer plus vite.","7) Utilise le Shop pour acheter des consommables et améliorations. Plus tu avances dans les zones, plus d’objets et d’améliorations se débloquent.","8) Récupère les badges en battant les Arènes: bonus permanents. Tu peux voir leurs effets dans le menu Badges.","9) Complète le Pokédex pour débloquer des paliers et le Charme Chroma. Accès via le menu Pokédex.","10) Bats la Ligue pour accéder au Panthéon."]],["fonctions","Fonctionnalités clés",["- Auto-attaque: active le DPS des Pokémon de l’équipe (bouton « Auto-attaque »).","- Auto-clique (Restes): débloqué en zone Sylphe SARL via l’amélioration Restes. Active un clic automatique via le bouton Auto-clic.","- Auto-stop: stoppe l’auto-combat sur Commun/Peu Commun/Rare/Très Rare/Légendaire/Shiny/Nouveau. Active/désactive via le bouton « Arrêt auto », et configure via le bouton « Réglages de l’arrêt ».","- Poké-Radar: affiche les Pokémon trouvables par zone. Débloqué en zone Cave Taupiqueur via l’amélioration Poké-Radar.","- Fiche résumé: clique sur un Pokémon puis “Résumé” pour voir sexe, types, niveau et bonheur. Depuis cette fiche, tu peux aussi renommer, mettre en favori, relâcher, ou échanger un Pokémon avec le PC.","- Pension: débloquée en zone Bourg Palette (Bourg Palette). Dépose 2 Pokémon pour tenter d’obtenir des œufs. Métamorph = bonus. Même type: 2% de chance d’œuf par combat. Même espèce: 4% par combat. Tu peux acheter plus de slots d’œufs.","- Carte: permet de téléporter vers les zones débloquées.","- Bonheur: augmente en combattant. Il donne un bonus de dégâts. Un Pokémon qui sort d’un œuf démarre à 125 de bonheur. La Baie Grena du Centre commercial donne +2 de bonheur.","- Œufs: récupère un œuf à la pension, mets-le dans ton équipe, puis fais des combats pour l’éclore.","- Menu Stats: accessible via la page Plus. Il récapitule tes statistiques principales."]],["capture","Capture & Repousses",["Affaiblis un Pokémon puis utilise des Pokéballs. Les balls plus fortes augmentent la chance de capture (Super/Hyper/Master).","Repousse: bloque les Pokémon “Commun” pendant un temps. Super Repousse: bloque “Commun” et “Peu Commun”."]],["pokedex","Pokédex & Récompenses",["Accès via le menu Pokédex. Capture des Pokémon pour remplir le Pokédex: chaque palier donne une récompense visible dans la page Pokédex.","Compléter le Pokédex déclenche une scène avec le Prof. Chen qui te remet le Diplôme et le Charme Chroma."]],["pc","PC",["Débloqué en zone Arène d’Argenta. Le PC stocke tes Pokémon capturés. Tu peux trier par numéro, nom, niveau, favori ou Shiny, ou chercher par nom.","Depuis ta team, utilise la fiche Résumé pour envoyer un Pokémon au PC ou en récupérer un."]],["centre","Centre Commercial",["Débloqué via progression (à Céladopole) et accessible depuis la Carte.","Objets exclusifs: Attaque +, Attaque Spé +, Pierres d’évolution, Poké Poupée, Pierre Stase, Calcium, Jeton Shiny.","Les pierres font évoluer certains Pokémon (impossible si Pierre Stase équipée).","Pierre Stase: s’équipe via le Sac sur un Pokémon compatible. Elle bloque toute évolution et donne +25% dégâts. Retrait via le menu du Pokémon dans l’équipe."]],["fauchage","CT Fauchage",["Débloquée en zone Centrale via l’amélioration CT Fauchage au Shop.","Effet: empêche un Pokémon sauvage de mourir (le laisse à 1 PV). Inutilisable sur les boss, avec un cooldown."]],["ligue","Ligue Pokémon",["La Ligue est composée de 10 boss à la suite. Tu affrontes un boss par étape, avec un timer de 30s pour chaque combat.","En battant la Ligue, tu accèdes à la prochaine région."]],["casino","Casino",["Débloqué via progression (à Céladopole). Vous pouvez y acheter des jetons avec vos Pokédollars pour jouer à 3 mini-jeux : la Machine à sous, le Blackjack et le Pile ou Face. Les jetons gagnés peuvent être échangés contre des Pokémon rares (Abra, Insecateur, Minidraco, Porygon) et des objets exclusifs comme la CT Jackpot ou une Master Ball."]],["defi-chen","Défi du Professeur Chen",["Une fois la ligue vaincue et le Pokédex de Kanto complété (151 Pokémon capturés), un défi ultime vous attend au laboratoire du Professeur Chen. Il vous affrontera avec une équipe de 6 Pokémon, tous au niveau 100, incluant un starter avantagé sur le vôtre, Tauros, Noadkoko, Arcanin, Léviator et son puissant Dracolosse. Chaque Pokémon doit être vaincu en moins de 30 secondes. C'est le test final pour devenir le véritable maître de Kanto."]],["easter-eggs","Easter Eggs",["- Renomme un Pokémon en “dinnerbone” ou “grumm” pour l’inverser.","- Renomme en “jeb_” pour un effet arc-en-ciel.","- Renomme en “caca” pour un filtre spécial.","- Renomme en “Daran” pour obtenir un skin de Pokémon exclusif."]]];

const pcDepart = () => [
  { id: 1, n: 7, niveau: 34, sexe: "m", fav: true }, { id: 2, n: 10, niveau: 8, sexe: "f" }, { id: 3, n: 19, niveau: 12, sexe: "m", surnom: "Rata" },

const JALONS = [[10, "Débutant", "Dégâts Clic x2"], [20, "Amateur", "+2 500 ₽"], [30, "Collectionneur", "DPS Équipe +50%"], [40, "Dresseur", "Omni Exp (XP +100%)"], [50, "Expert", "Apparition +20%"],
  [70, "Champion", "Boutique -15%"], [90, "Maître", "Dégâts Totaux +50%"], [110, "Légende", "Jeton Shiny"], [130, "Mythique", "Master Ball + 10 Bonbons"], [151, "Maître de Kanto", "Charme Chroma (Shiny x3)"]];
const CAPT = (() => { const s = new Set([3, 6, 7, 10, 16, 19, 21, 25, 26, 39, 54, 63, 74, 92, 129, 130, 133]); for (let k = 1; s.size < 47; k++) s.add((k * 37) % 151 + 1); return s; })();
const BADGES = [
  ["roche", "Roche", "Dégâts Clic +50%", "Arène d'Argenta", "Pierre (Onix)"], ["cascade", "Cascade", "DPS Équipe +30%", "Arène d'Azuria", "Ondine (Staross)"],

  ["ame", "Âme", "XP gagnée +50%", "Arène de Parmanie", "Koga (Smogogo)"], ["marais", "Marais", "Taux de capture +30%", "Arène de Safrania", "Sabrina (Alakazam)"],
  ["volcan", "Volcan", "Dégâts Totaux +50%", "Arène de Cramois'Île", "Blaine (Arcanin)"], ["terre", "Terre", "Vitesse d'apparition +20%", "Arène de Jadielle", "Giovanni (Rhinoféros)"],
];

const norm = (t) => String(t).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();

const nbCapt = () => (S.dexComplet ? 151 : CAPT.size);

const nomP = (p) => (p.oeuf ? "Œuf" : p.surnom || nomEsp(p.n));

const SEXE_SVG = {
  m: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="9.5" cy="14.5" r="6"/><path d="M14 10L21 3M15 3h6v6"/></svg>',
  f: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8.5" r="6"/><path d="M12 14.5V22M8.5 18.5h7"/></svg>',

const ic = (n, c = "") => PK.ic(n, c);
/* Couleurs des types : celles du jeu (legacy/js/data/constants.js, TYPE_COLORS), noms français de data/types-noms.json.
   Le texte passe en sombre (--fond) sur les fonds clairs, en clair (--texte) sur les fonds foncés. */
const TYPE_HEX = { Normal: "#A8A77A", Feu: "#EE8130", Eau: "#6390F0", "Électrik": "#F7D02C", Plante: "#7AC74C", Glace: "#96D9D6", Combat: "#C22E28", Poison: "#A33EA1", Sol: "#E2BF65", Vol: "#A98FF3", Psy: "#F95587", Insecte: "#A6B91A", Roche: "#B6A136", Spectre: "#735797", Dragon: "#6F35FC", Acier: "#B7B7CE", "Ténèbres": "#705746", "Fée": "#D685AD" };
function typeStyle(nom) {
  const h = TYPE_HEX[nom]; if (!h) return "";
  const lin = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
  const lum = 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2];

}
const typeTag = (t) => `<span class="tag type" style="${typeStyle(t)}">${t}</span>`;

/* DPS : base = niveau × 41, puis les multiplicateurs de la fiche (type ×1 au PC) */
function dpsDetail(p) {
  const base = p.niveau * 41, type = 1, shiny = p.shiny ? 2 : 1, bonheur = 1.12, stase = 1, calcium = 1.02;
  return { base, type, shiny, bonheur, stase, calcium, total: Math.round(base * type * shiny * bonheur * stase * calcium) };
}
/* Pokémon de l'équipe vu comme une fiche */
function pEquipe(i) { const [n, nom, d] = EQUIPE[i]; return { id: "eq" + i, eq: true, i, n: Number(n), niveau: 100, sexe: Number(n) % 2 ? "m" : "f", dps: d, fav: !!S.favEq[i] }; }
function pDeFiche() { const f = S.fiche; if (!f) return null; return f.src === "eq" ? (EQUIPE[f.i] ? pEquipe(f.i) : null) : S.pc.find((p) => p.id === f.id); }

/* ---------- PC ---------- */
const dpsPc = (p) => (p.oeuf ? 0 : dpsDetail(p).total);
function pcListe() {
  const q = norm(S.pcQ), num = /^(?:#|n°|n)?\s*(\d+)$/.exec(q);
  let l = S.pc.filter((p) => {
    if (S.pcFav && !p.fav) return false;
    if (S.pcShiny && !p.shiny) return false;
    if (S.pcOeuf && !p.oeuf) return false;
    if (!q) return true;
    if (num) return !p.oeuf && p.n === Number(num[1]);
    return norm(nomP(p)).includes(q) || (!p.oeuf && norm(nomEsp(p.n)).includes(q));
  });
  const cmp = {
    dps: (a, b) => (a.oeuf ? 1 : 0) - (b.oeuf ? 1 : 0) || dpsPc(b) - dpsPc(a) || (a.n || 0) - (b.n || 0),
    numero: (a, b) => (a.oeuf ? 1 : 0) - (b.oeuf ? 1 : 0) || (a.n || 0) - (b.n || 0) || (b.niveau || 0) - (a.niveau || 0),
    nom: (a, b) => nomP(a).localeCompare(nomP(b), "fr"), niveau: (a, b) => (b.niveau || 0) - (a.niveau || 0),
    favori: (a, b) => Number(!!b.fav) - Number(!!a.fav), shiny: (a, b) => Number(!!b.shiny) - Number(!!a.shiny),
  }[S.pcTri];
  return l.sort(cmp);
}
function caseP(p) {
  const nom = nomP(p), s = !!p.shiny && !p.oeuf;

  return `<button type="button" class="case ${s ? "shiny" : ""} ${p.fav ? "fav" : ""}" data-act="fiche-pc" data-id="${p.id}" aria-label="${esc(nom)}, ${p.oeuf ? pasOeuf(p) : (S.pcTri === "dps" ? nf(dpsPc(p)) + " DPS, " : "") + "niveau " + p.niveau}">${img}<span class="corps"><span class="nom"><span>${esc(nom)}</span>${s ? ic("etincelle") : ""}${sexeHtml(p)}${p.fav ? ic("etoile") : ""}</span>${bas}</span></button>`;
}
function pcCorps() {

/* ---------- fiche d'un Pokémon ---------- */
function ficheCouche() {

  const nom = nomP(p), egg = !!p.oeuf, d = egg ? null : dpsDetail(p), dps = p.eq ? p.dps : d && d.total;

      ${xp}${egg ? "" : `<div class="dps-gros">${nf(dps)} DPS</div>`}
      ${egg ? `<p class="doux">Un œuf n'a ni niveau ni XP. Mets-le dans ton équipe, puis fais des combats pour l'éclore.</p>` : `<dl class="detail-dps">${[["Base", nf(d.base)], ["Type", "× " + d.type], ["Shiny", "× " + d.shiny], ["Bonheur", "× " + virg(d.bonheur)], ["Pierre Stase", "× " + d.stase], ["Calcium", "× " + virg(d.calcium)]].map(bloc).join("")}</dl>${evo}

/* ---------- Pokédex ---------- */
function dexListe() {
  const q = norm(S.dexQ), num = /^(?:#|n°|n)?\s*(\d+)$/.exec(q);
  return DEX.filter(([n, nom]) => {
    if (S.dexF === "captures" && !estCapt(n)) return false;
    if (S.dexF === "manquants" && estCapt(n)) return false;
    if (!q) return true;
    if (num) return n === Number(num[1]);
    return estCapt(n) && norm(nom).includes(q);
  });
}
function dexCase([n, nom]) {

    <details class="repli" ${S.paliersOuv ? "open" : ""}><summary data-act="paliers">Paliers du Pokédex · ${recus} sur 10 reçus${ic("chevron")}</summary><div class="contenu">${paliers}</div></details>
    ${S.dexComplet ? `<button type="button" class="ligne-p" data-act="diplome">${ic("diplome")}<span class="corps"><span class="t">Diplôme du Pokédex</span><br><span class="s">Remis par le Prof. Chen</span></span>${ic("chevron")}</button>` : ""}

/* ---------- couches ---------- */
const fermer = `<button type="button" class="plaque" data-act="fermer" aria-label="Fermer">${PK.ic("croix")}</button>`;
function couches() {
  let h = "";
  if (S.sac) {
    const l = SAC.map(([i, nom, n, eff, cible]) => `<div class="ligne-p"><img class="obj" src="${IMG}${i}.png" width="30" height="30" alt=""><div class="corps"><div class="t">${nom} <span class="doux">×${n}</span></div><div class="s">${eff}${cible ? " · sur un Pokémon" : ""}</div></div><button type="button" class="plaque" data-act="utiliser" data-nom="${nom}" data-cible="${cible ? 1 : 0}">Utiliser</button></div>`).join("");

  }
  if (S.reglAuto) {
    const r = (k, t, on) => `<div class="reglage"><span class="corps-r"><b>${t}</b><small class="etat">${etatTxt(on)}</small></span>${inter("ar:" + k, t, on)}</div>`;
    h += `<div class="voile" data-act="fermer"></div><section class="fenetre cadre" role="dialog" aria-modal="true" aria-label="Réglage de l'arrêt auto"><div class="tete"><h2>Réglage de l'arrêt auto</h2>${fermer}</div>

      <h3 class="sous-titre">L'attaque auto s'arrête quand apparaît</h3>
      <div class="liste">${ARRETS.map(([k, t]) => r(k, t, S.arrets[k])).join("")}</div></div></section>`;
  }
  if (S.dialogue) {
    h += `<div class="voile" data-act="fermer"></div><section class="dialogue cadre" role="dialog" aria-modal="true" aria-label="Prof. Chen"><img src="${IMG}chen-1.png" width="120" height="120" alt="">
      <div><p class="pixel">Prof. Chen</p><p>Un Pokémon sauvage ! Touche-le pour l'attaquer. Quand il est affaibli, lance une Poké Ball.</p></div>
      <button type="button" class="plaque action" data-act="fermer">Compris <span class="fleche" aria-hidden="true">▸</span></button></section>`;
  }
  if (S.cel) {
    const l = ["Arène", "Centre commercial", "Casino"].map((t) => `<button type="button" class="plaque" data-act="lieu" data-lieu="${t}">${t}${PK.ic("chevron")}</button>`).join("");
    h += `<div class="voile" data-act="fermer"></div><div class="centre-modal"><section class="modal cadre" role="dialog" aria-modal="true" aria-label="Céladopole"><div class="tete"><h2>Céladopole</h2>${fermer}</div><p class="doux">Où veux-tu aller ?</p>${l}</section></div>`;
  }
  if (S.modal) {
    const p = partie(S.modal.id);
    let corps = "";
    if (S.modal.type === "renommer") corps = `<div class="tete"><h2>Renommer la partie</h2>${fermer}</div>${formNom(p ? p.nom : "")}<button type="button" class="plaque action" data-act="renommer-ok">Enregistrer</button><button type="button" class="plaque" data-act="fermer">Annuler</button>`;
    else if (S.modal.type === "supprimer") corps = `<div class="tete"><h2>Supprimer « ${esc(p ? p.nom : "")} » ?</h2></div><p>Sa progression sera perdue pour de bon. Tes diamants, tes succès et tes skins restent sur ton compte.</p><button type="button" class="plaque danger" data-act="supprimer-ok">Oui, supprimer</button><button type="button" class="plaque" data-act="fermer">Annuler</button>`;
    else corps = `<div class="tete"><h2>Se déconnecter ?</h2></div><p>Ta dernière progression n'est pas encore envoyée en ligne. Elle sera sauvegardée avant la déconnexion.</p><button type="button" class="plaque action" data-act="deco-sauver">Sauvegarder et se déconnecter</button><button type="button" class="plaque" data-act="fermer">Rester connecté</button>`;
    h += `<div class="voile" data-act="fermer"></div><div class="centre-modal"><section class="modal cadre" role="dialog" aria-modal="true" aria-label="Confirmation">${corps}</section></div>`;
  }
  if (S.deco === "charge") {
    h += `<div class="attente-plein" role="alertdialog" aria-modal="true" aria-label="Sauvegarde en cours"><span class="rond-charge" aria-hidden="true"></span><h1>Sauvegarde en cours…</h1>
      <p>Ne ferme pas la page et ne quitte pas l'application. Tu seras déconnecté dès que ta partie sera sauvegardée.</p><div class="barre-ind" aria-hidden="true"><i></i></div>
      <div class="actions-bas"><button type="button" class="maquette" data-act="deco-echec">Maquette : simuler un échec de la sauvegarde</button></div></div>`;
  } else if (S.deco === "echec") {
    h += `<div class="attente-plein" role="alertdialog" aria-modal="true" aria-label="Échec de la sauvegarde">${PK.ic("alerte", "gros")}<h1>La sauvegarde n'a pas abouti</h1>
      <p>Ta progression n'a pas été envoyée en ligne. Vérifie ta connexion, puis réessaie. Tant que ce n'est pas fait, tu restes connecté et ta partie reste sur cet appareil.</p>
      <div class="actions-bas"><button type="button" class="plaque action large" data-act="deco-sauver">Réessayer</button><button type="button" class="plaque large" data-act="deco-rester">Rester connecté</button></div></div>`;
  }
  return h + couchesA4();
}

/* ---------- rendu ---------- */
const PAGES = { combat: ecranCombat, equipe: ecranEquipe, pc: ecranPc, shop: ecranShop, carte: ecranCarte, menu: ecranMenu, monde: ecranMonde, reglages: ecranReglages,
  "c-connexion": ecranConnexion, "c-inscription": ecranInscription, "c-oubli": ecranOubli, "c-oubli-envoye": ecranOubliEnvoye, "c-nouveau": ecranNouveau,
  "c-parties": ecranParties, "c-nouvelle": ecranNouvelle, "c-ailleurs": ecranAilleurs, "c-reprise-ailleurs": ecranRepriseAilleurs, "c-supprimee": ecranSupprimee, "c-compte": ecranCompte, "c-reglages": ecranReglages,
  pokedex: ecranPokedex, badges: ecranBadges, stats: ecranStats, guide: ecranGuide };
const AUTH = ["c-connexion", "c-inscription", "c-oubli", "c-oubli-envoye", "c-nouveau"];
function rendre() {
  const hc = document.getElementById("cles"), hb = document.getElementById("barre");
  hc.innerHTML = cles(); hb.innerHTML = barre(); hb.hidden = !hb.innerHTML;
  const e = document.getElementById("ecran"), haut = e.scrollTop;
  e.innerHTML = PAGES[S.page]();
  e.classList.toggle("plein", S.page === "carte");
  e.classList.toggle("auth", AUTH.includes(S.page));
  e.scrollTop = S.garde ? haut : 0; S.garde = false;
  document.getElementById("couches").innerHTML = couches();
  const s = e.querySelector("#scene");
  if (s) s.addEventListener("click", () => {
    s.classList.remove("coup"); void s.offsetWidth; s.classList.add("coup");
    PK.etat.pv -= 12; if (PK.etat.pv <= 0) PK.etat.pv = PK.etat.pvMax;
    e.querySelector("#pv").style.setProperty("--pv", (PK.etat.pv / PK.etat.pvMax * 100) + "%");
    e.querySelector("#pvtxt").textContent = `PV ${PK.etat.pv} / ${PK.etat.pvMax}`;
  });
}

/* Vol : reprise de l'animation du jeu (reglages.interface.vol : pose 800, ouverture 50, vol 2500, fermeture 500, image 150 ms, 5 images). */
const VOL = { poseMs: 800, delaiOuvertureMs: 50, volMs: 2500, fermetureMs: 500, imageMs: 150, images: 5, pisteMs: 400, traitsMs: 200, fonduReduitMs: 300, changerReduitMs: 150 };
const TRAITS = `<svg viewBox="0 0 400 180" preserveAspectRatio="none"><path stroke="currentColor" stroke-width="2" fill="none" d="M25 15h8 M150 30h12 M80 100h10 M300 80h8 M350 20h9 M220 90h11 M20 70h7 M250 50h9 M120 5h8 M380 110h10 M50 85h9 M180 60h12 M100 140h10 M320 160h8 M200 130h12"/></svg>`;
function lancerVol(id, lieu) {
  const carte = document.getElementById("mini"); if (!carte || S.enVol) return;
  S.enVol = true; const tok = S.tok, a = Z(S.zone), b = Z(id);
  document.getElementById("liste-zones").classList.add("vole");
  const reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fini = () => { S.enVol = false; if (tok !== S.tok) return; S.zone = id; S.page = "combat"; rendre(); PK.toast(`Zone : ${b.nom}${lieu ? " · " + lieu : ""}`); };
  const changer = () => { carte.querySelectorAll(".cercle.actuel").forEach((c) => c.classList.remove("actuel")); const c = carte.querySelector(`[data-z="${id}"]`); if (c) c.classList.add("actuel"); };
  if (reduit) {
    carte.classList.add("fondu");
    setTimeout(changer, VOL.changerReduitMs); setTimeout(fini, VOL.fonduReduitMs); return;
  }
  const d = document.createElement("img"); d.className = "dresseur"; d.alt = ""; d.setAttribute("aria-hidden", "true");
  d.style.left = a.x * 100 + "%"; d.style.top = a.y * 100 + "%"; d.src = "img/dresseur/vol-1.png"; carte.appendChild(d);
  const T = (f, ms) => setTimeout(() => { if (carte.isConnected) f(); }, ms);
  for (let i = 1; i < VOL.images; i++) T(() => { d.src = `img/dresseur/vol-${i + 1}.png`; }, i * VOL.imageMs);
  T(() => {
    const o = document.createElement("div"); o.className = "vol-overlay"; o.dataset.phase = "vol"; o.setAttribute("aria-hidden", "true");
    o.innerHTML = `<div class="vol-attente" style="--vol-ms:${VOL.delaiOuvertureMs}"><div class="vol-piste" style="--vol-ms:${VOL.pisteMs}"><div class="vol-traits" style="--vol-ms:${VOL.traitsMs}">${TRAITS}${TRAITS}</div><div class="vol-trajet" style="--vol-ms:${VOL.volMs}"><img class="vol-oiseau" src="img/animes/roucarnage-vol.gif" alt=""></div></div></div>`;
    carte.appendChild(o);
  }, VOL.poseMs);
  T(() => { changer(); const o = carte.querySelector(".vol-overlay"); if (o) o.dataset.phase = "fermeture"; }, VOL.poseMs + VOL.volMs);
  setTimeout(fini, VOL.poseMs + VOL.volMs + VOL.fermetureMs);
}
function voisine(sens) { const i = OUVERTES.indexOf(Z(S.zone)) + sens; if (OUVERTES[i]) { S.zone = OUVERTES[i].id; rendre(); } }

const val = (id) => (document.getElementById(id) || {}).value || "";
function ouvrirPartie(id) {
  const p = partie(id); S.ouverte = id; S.depuis = "compte"; S.page = "monde";
  S.sync = S.hors ? "hors" : p && p.etat === "cours" ? "cours" : "ajour";
}
document.addEventListener("click", (ev) => {
  const g = ev.target.closest("[data-go]"), a = ev.target.closest("[data-act]");
  if (a && !a.closest("[aria-disabled=true]")) {
    const act = a.dataset.act; S.tok++;
    if (act === "fermer") { S.sac = S.reglAuto = S.dialogue = S.cel = false; S.modal = null; S.dexSel = null; S.badgeSel = null; S.diplomeOuv = false; fermeFiche(); }
    else if (ACT4[act]) { if (ACT4[act](a, ev) === "stop") return; }
    else if (act === "ball") S.ball = (S.ball + 1) % BALLS.length;
    else if (act === "capturer") { PK.toast(`${BALLS[S.ball][1]} lancée !`); return; }
    else if (act === "auto") S.auto = !S.auto;
    else if (act === "arret") S.arret = !S.arret;
    else if (act === "deb") S.deb = !S.deb;
    else if (act === "fauchage") { PK.toast("Fauchage lancé"); return; }
    else if (act === "radar") { PK.toast("Poké-Radar activé"); return; }
    else if (act === "dialogue") S.dialogue = true;
    else if (act === "regl") { a.setAttribute("aria-pressed", a.getAttribute("aria-pressed") !== "true"); return; }
    else if (act === "inter") {
      const k = a.dataset.key, on = a.getAttribute("aria-checked") !== "true";
      if (k === "lie") S.lie = on; else if (k.startsWith("ar:")) S.arrets[k.slice(3)] = on; else S[k].on = on;
      a.setAttribute("aria-checked", on);
      const r = a.closest(".reglage"), et = r.querySelector(".etat");
      if (et) et.textContent = k === "lie" ? (on ? "Lié : l'auto-clic s'active et s'arrête avec Attaque auto" : "Délié : l'auto-clic est désactivé") : etatTxt(on);
      const rg = r.querySelector("input[type=range]"); if (rg) rg.disabled = !on;
      return;
    }
    else if (act === "oeil") { const i = a.closest(".zone-saisie").querySelector("input"); const v = i.type === "password"; i.type = v ? "text" : "password"; a.setAttribute("aria-pressed", v); a.setAttribute("aria-label", v ? "Masquer le mot de passe" : "Afficher le mot de passe"); return; }
    else if (act === "utiliser") {
      S.sac = false;
      if (a.dataset.cible === "1") { S.choix = a.dataset.nom; S.page = "equipe"; } else PK.toast(`${a.dataset.nom} utilisé`);
    }
    else if (act === "annuler") { S.choix = null; S.page = "combat"; S.sac = true; }
    else if (act === "cible") { PK.toast(`${S.choix} utilisé sur ${a.dataset.nom}`); S.choix = null; S.page = "combat"; }
    else if (act.startsWith("onglet-")) S.onglet = act.slice(7);
    else if (act === "acheter") { PK.toast(`${a.dataset.nom} acheté`); return; }
    else if (act === "zone-prec") return voisine(-1);
    else if (act === "zone-suiv") return voisine(1);
    else if (act === "zone") {
      if (S.enVol) return;
      if (a.dataset.id === "arene-de-celadopole") { S.cel = true; } else { return lancerVol(a.dataset.id); }
    }
    else if (act === "lieu") { const lieu = a.dataset.lieu; S.cel = false; rendre(); return lancerVol("arene-de-celadopole", lieu === "Arène" ? "" : lieu); }
    else if (act === "sauver") { S.sauve = "à l'instant"; if (S.sync === "cours") S.sync = "ajour"; PK.toast("Partie sauvegardée"); }
    else if (act === "cycle-sync") { const o = Object.keys(SYNCS); S.sync = o[(o.indexOf(S.sync) + 1) % o.length]; }
    else if (act === "region-kanto") { S.page = "combat"; S.choix = null; rendre(); PK.toast("Kanto : retour à Route 1"); return; }
    else if (act === "debloquer-pc") { PK.etat.pcOuvert = true; S.pcVu = false; PK.toast("PC débloqué ! Il est dans l'écran Équipe."); }
    else if (act === "verrouiller-pc") PK.etat.pcOuvert = false;
    /* compte */
    else if (act === "hors-reseau") { S.cx = "reseau"; PK.toast("Pas de connexion : réessaie quand tu auras du réseau."); S.cx = null; return; }
    else if (act === "ouvrir") {
      const p = partie(Number(a.dataset.id));
      if (p.etat === "ailleurs" && !S.hors) { S.cible = p.id; S.page = "c-ailleurs"; }
      else if (p.etat === "supprimee" && !S.hors) { S.cible = p.id; S.page = "c-supprimee"; }
      else ouvrirPartie(p.id);
    }
    else if (act === "renommer") S.modal = { type: "renommer", id: Number(a.dataset.id) };
    else if (act === "supprimer") S.modal = { type: "supprimer", id: Number(a.dataset.id) };
    else if (act === "renommer-ok") { const n = val("f-nom").trim(); if (n) partie(S.modal.id).nom = n; S.modal = null; PK.toast("Partie renommée"); }
    else if (act === "supprimer-ok") { S.parties = S.parties.filter((p) => p.id !== S.modal.id); S.modal = null; PK.toast("Partie supprimée"); }
    else if (act === "reprendre") {
      /* L'autre appareil est fermé ; ici on repart exactement où la partie en était (même zone, même étape), sans passer par le Monde. */
      const p = partie(S.cible); if (p) { p.etat = "ajour"; p.sauve = "à l'instant"; }
      S.ouverte = S.cible; S.depuis = "menu"; S.sync = "ajour"; S.zone = "foret-de-jade"; S.page = "combat"; PK.toast("Partie reprise ici : tu repars de Forêt de Jade, là où tu en étais");
    }
    else if (act === "garder") { const p = partie(S.cible); if (p) { p.etat = "ajour"; } PK.toast("Partie gardée sur cet appareil"); S.page = "c-parties"; }
    else if (act === "abandonner") { S.parties = S.parties.filter((p) => p.id !== S.cible); PK.toast("Partie abandonnée"); S.page = "c-parties"; }
    else if (act === "mdp") { S.depuisCompte = true; S.page = "c-nouveau"; }
    else if (act === "skin") S.skin = !S.skin;
    else if (act === "deco") { if (S.sync === "cours") S.modal = { type: "deco" }; else { S.page = "c-connexion"; S.cx = null; PK.toast("Tu es déconnecté"); } }
    else if (act === "deco-sauver") {
      /* Page de chargement plein écran, puis déconnexion une fois la sauvegarde faite (2,6 s en maquette) */
      S.modal = null; S.deco = "charge"; const t = S.tok;
      setTimeout(() => { if (S.deco === "charge" && t === S.tok) { S.deco = null; S.sync = "ajour"; S.page = "c-connexion"; S.cx = null; PK.toast("Partie sauvegardée. Tu es déconnecté."); rendre(); } }, 2600);
    }
    else if (act === "deco-echec") S.deco = "echec";
    else if (act === "deco-rester") S.deco = null;
    rendre(); return refocus(a);
  }
  if (!g) return;
  const go = g.dataset.go; S.tok++; S.choix = null;
  if (go === "sac") S.sac = true;
  else if (go === "reglAuto") S.reglAuto = true;
  else if (go === "a-venir") { PK.toast("Cet écran n'est pas dans cette maquette"); return; }
  else if (go === "menu-principal") { S.sauve = "à l'instant"; if (S.sync === "cours") S.sync = "ajour"; PK.toast("Partie sauvegardée"); S.page = "c-parties"; S.hors = S.sync === "hors"; S.sac = S.reglAuto = S.dialogue = S.cel = false; }
  else {
    if (go === "monde") S.depuis = S.page === "carte" ? "carte" : "menu";
    if (go === "pc") S.pcVu = true;
    if (go === "c-connexion") S.cx = null;
    if (go === "c-inscription") S.ins = false;
    if (go === "c-parties" && S.page === "monde") S.hors = S.sync === "hors";
    S.depuisCompte = false; fermeFiche(); S.echange = null; S.dexSel = null; S.badgeSel = null; S.diplomeOuv = false;
    S.page = go; S.sac = S.reglAuto = S.dialogue = S.cel = false; S.modal = null;
  }
  rendre();
});
document.addEventListener("submit", (ev) => {
  ev.preventDefault(); const f = ev.target.dataset.form; S.tok++;
  if (f === "connexion") { if (S.cx === "erreur") { S.cx = null; } S.hors = false; S.page = "c-parties"; }
  else if (f === "inscription") { if (val("f-mdp").length < 10) { S.ins = true; } else { S.parties = []; S.page = "c-parties"; S.ins = false; PK.toast("Compte créé"); } }
  else if (f === "surnom") {
    const v = val("f-surnom").trim(), p = pDeFiche();
    if (v.length < 1 || v.length > 12) S.renomErr = true;
    else { if (p) { if (p.eq) EQUIPE[p.i][1] = v; else p.surnom = v; } S.renom = false; S.renomErr = false; PK.toast("Surnom enregistré"); }
  }
  else if (f === "oubli") S.page = "c-oubli-envoye";
  else if (f === "nouveau") { PK.toast("Mot de passe enregistré"); S.page = S.depuisCompte ? "c-compte" : "c-connexion"; S.depuisCompte = false; }
  else if (f === "creer") {
    const n = val("f-nom").trim() || "Ma partie"; const id = Math.max(0, ...S.parties.map((p) => p.id)) + 1;
    S.parties.push({ id, nom: n, lieu: "Kanto · Bourg Palette", temps: "0 h 00", sauve: "à l'instant", etat: "ajour" }); S.page = "c-parties"; PK.toast("Partie créée");
  }
  rendre();
});
document.addEventListener("change", (ev) => {
  const i = ev.target;
  if (i.tagName === "SELECT" && i.dataset.cle === "pcTri") { S.pcTri = i.value; S.garde = true; rendre(); const n = document.getElementById("pc-tri"); if (n) n.focus(); }
});
document.addEventListener("input", (ev) => {
  const i = ev.target;
  if (i.dataset.cle === "pcQ" || i.dataset.cle === "dexQ") { S[i.dataset.cle] = i.value; majListes(); return; }
  if (i.id === "f-surnom") { const c = document.getElementById("cpt-surnom"); if (c) c.textContent = `${i.value.length} / 12 caractères`; return; }
  if (i.type !== "range") return;
  S[i.dataset.cle].v = Number(i.value); i.style.setProperty("--p", i.value + "%"); i.nextElementSibling.textContent = i.value;
});

function demarrer() {
  depart(location.hash.slice(1)); rendre();
  if (S.volAuto) setTimeout(() => lancerVol(S.volAuto), 400);
}
window.addEventListener("hashchange", demarrer);
demarrer();

</script>
