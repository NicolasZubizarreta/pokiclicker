/* Maquettes de navigation téléphone (phase 5, ticket C). Aucune valeur propre : tout vient de design/tokens.css
   (--spacing = 4 px, --text-*, --shadow-*, --breakpoint-sm = 390 px, rôles de couleur). Thème sombre, Kanto. */
@font-face { font-family: "Pixelify Sans"; font-weight: 600; font-display: swap; src: url("../combat-v3/fonts/pixelify-sans-latin-600-normal-Dd_Dy7u5.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 400; font-display: swap; src: url("../combat-v3/fonts/atkinson-hyperlegible-next-latin-400-normal-FfmJh7DR.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 600; font-display: swap; src: url("../combat-v3/fonts/atkinson-hyperlegible-next-latin-600-normal-BBuhw47K.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 700; font-display: swap; src: url("../combat-v3/fonts/atkinson-hyperlegible-next-latin-700-normal-Dpiyiu63.woff2") format("woff2"); }

:root {
  color-scheme: dark;
  --u: var(--spacing);
  --cible: calc(var(--u) * 12);          /* 48 px : cible tactile minimale */
  --ecart: calc(var(--u) * 2);           /* 8 px : écart minimal entre cibles */
  --trait: calc(var(--u) / 2);           /* 2 px : liseré */
  --voile: color-mix(in srgb, var(--fond) 78%, transparent);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--surface-2); color: var(--texte); font-family: var(--font-texte); font-size: var(--text-base); line-height: var(--text-base--line-height); font-variant-numeric: tabular-nums; overflow-x: hidden; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; background: none; border: 0; text-align: inherit; }
img { display: block; image-rendering: pixelated; }
:focus-visible { outline: var(--u) solid var(--focus); outline-offset: var(--trait); }
[hidden] { display: none !important; }
.sr { position: absolute; width: var(--u); height: var(--u); overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.pixel { font-family: var(--font-titre); font-weight: 600; }
.doux { color: var(--texte-doux); }
.gras { font-weight: 700; }
svg.ic { width: calc(var(--u) * 6); height: calc(var(--u) * 6); flex: none; fill: none; stroke: currentColor; stroke-width: 2; }

/* Le téléphone */
.tel { position: relative; width: min(100%, var(--breakpoint-sm)); height: 100dvh; max-height: calc(var(--u) * 224); margin-inline: auto; display: flex; flex-direction: column; overflow: hidden; background: var(--fond); }
@media (min-width: 48rem) { .tel { margin-block: var(--u); height: calc(100dvh - var(--u) * 2); border: var(--trait) solid var(--bordure); } }

/* Cadre et plaques */
.cadre { background: var(--surface); border: var(--trait) solid var(--region-argent); box-shadow: inset 0 0 0 var(--trait) var(--fond), inset 0 0 0 var(--u) var(--region-argent); }
.plaque { display: inline-flex; align-items: center; justify-content: center; gap: var(--ecart); min-height: var(--cible); min-width: var(--cible); padding: var(--u) calc(var(--u) * 3); background: var(--surface-2); color: var(--texte); border: var(--trait) solid var(--bordure); box-shadow: var(--shadow-md); transition: transform var(--duration-rapide) var(--ease-standard), box-shadow var(--duration-rapide) var(--ease-standard); }
.plaque:active { transform: translateY(var(--trait)); box-shadow: var(--shadow-sm); }
.plaque.action { background: var(--action); color: var(--action-texte); border-color: var(--action-survol); font-weight: 700; }
.plaque.action:active { background: var(--action-survol); }
.plaque[aria-pressed="true"] { background: var(--selection); border-color: var(--region-accent); color: var(--region-accent); }
.plaque.vertical { flex-direction: column; gap: 0; min-height: calc(var(--u) * 14); padding: var(--u); font-size: var(--text-sm); line-height: var(--text-sm--line-height); }
.pastille { position: absolute; top: calc(var(--u) * -2); right: calc(var(--u) * -1); min-width: calc(var(--u) * 6); padding-inline: var(--u); background: var(--info-fond); color: var(--info-texte); border: var(--trait) solid var(--info-base); font-size: var(--text-xs); line-height: var(--text-sm--line-height); text-align: center; }
.point { position: absolute; top: calc(var(--u) * 2); right: calc(var(--u) * 2); width: calc(var(--u) * 3); height: calc(var(--u) * 3); background: var(--succes-base); border: var(--trait) solid var(--fond); }

/* Chiffres clés */
.cles { flex: none; padding: var(--ecart) calc(var(--u) * 4) var(--ecart); background: var(--surface); border-bottom: var(--trait) solid var(--region-argent); }
.cles .rang { display: flex; align-items: flex-end; gap: calc(var(--u) * 3); }
.cle { flex: 1; min-width: 0; }
.cle.large { flex: 1.25; }
.cle small { display: block; font-size: var(--text-sm); line-height: var(--text-sm--line-height); color: var(--texte-doux); }
.cle b { display: block; font-family: var(--font-titre); font-weight: 600; font-size: var(--text-xl); line-height: var(--text-xl--line-height); color: var(--region-accent); white-space: nowrap; }
.etapes { display: flex; align-items: center; gap: var(--ecart); margin-top: var(--u); }
.etapes i { width: calc(var(--u) * 2); height: calc(var(--u) * 2); background: var(--surface-2); border: var(--trait) solid var(--bordure); }
.etapes i.fait { background: var(--region-accent); border-color: var(--region-accent); }
.etapes i.ici { width: calc(var(--u) * 3); height: calc(var(--u) * 3); background: var(--surface); border-color: var(--region-accent); }
.etapes i.boss { width: calc(var(--u) * 4); height: calc(var(--u) * 4); border-radius: var(--radius-plein); border-color: var(--region-accent); }
.etapes span { margin-left: auto; font-size: var(--text-sm); color: var(--texte-doux); }

/* Écran */
.ecran { flex: 1; min-height: 0; overflow: hidden auto; overscroll-behavior: contain; padding: calc(var(--u) * 3) calc(var(--u) * 4); display: flex; flex-direction: column; gap: var(--ecart); }
.titre-page { display: flex; align-items: center; gap: var(--ecart); min-height: var(--cible); }
.titre-page h1 { font-family: var(--font-titre); font-weight: 600; font-size: var(--text-xl); line-height: var(--text-xl--line-height); flex: 1; }
.titre-page .retour { min-height: var(--cible); min-width: var(--cible); display: inline-flex; align-items: center; justify-content: center; margin-left: calc(var(--u) * -2); }

/* Combat : scène */
.scene { position: relative; display: block; width: 100%; aspect-ratio: 6 / 5; flex: none; padding: 0; overflow: hidden; background: var(--fond) url("../combat-v3/img/route-1.webp") center / cover; }
.scene .info { position: absolute; top: var(--ecart); left: var(--ecart); right: var(--ecart); padding: calc(var(--u) * 2) calc(var(--u) * 3); text-align: left; }
.scene .ligne { display: flex; justify-content: space-between; align-items: baseline; }
.scene .nom { font-family: var(--font-titre); font-weight: 600; font-size: var(--text-xl); line-height: var(--text-xl--line-height); }
.scene .pv { height: calc(var(--u) * 3); margin: var(--u) 0; background: var(--fond); border: var(--trait) solid var(--bordure); }
.scene .pv i { display: block; height: 100%; width: var(--pv, 100%); background: var(--succes-base); transform-origin: left; transition: width 120ms var(--ease-standard); }
.scene .pv-txt { font-size: var(--text-sm); color: var(--texte-doux); }
.scene .socle { position: absolute; left: 50%; bottom: calc(var(--u) * 4); width: calc(var(--u) * 52); height: calc(var(--u) * 9); margin-left: calc(var(--u) * -26); background: var(--region-socle); border-radius: var(--radius-plein); opacity: .85; }
.scene .rattata { position: absolute; left: 50%; bottom: calc(var(--u) * 7); width: calc(var(--u) * 48); height: calc(var(--u) * 48); margin-left: calc(var(--u) * -24); transition: transform var(--duration-rapide) var(--ease-standard); }
.scene.coup .rattata { transform: translateY(calc(var(--u) * 2)) scale(.96); }
.scene .degat { position: absolute; left: 50%; bottom: calc(var(--u) * 44); font-family: var(--font-titre); font-weight: 600; font-size: var(--text-2xl); color: var(--blanc); text-shadow: 0 var(--trait) 0 var(--fond); opacity: 0; }
.scene.coup .degat { animation: monte var(--duration-lent) var(--ease-sortie) forwards; }
@keyframes monte { from { transform: translateY(0); opacity: 1; } to { transform: translateY(calc(var(--u) * -8)); opacity: 0; } }
.scene .conseil { position: absolute; left: 0; right: 0; bottom: var(--u); text-align: center; font-size: var(--text-sm); }
.scene .conseil span { background: var(--voile); padding: 0 var(--ecart); }

/* Combat : barres d'outils, équipe, dialogue */
.outils { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--ecart); flex: none; }
.outils .plaque { position: relative; }
.bande { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--ecart); flex: none; }
.bande button { position: relative; min-width: 0; min-height: var(--cible); aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: var(--surface); border: var(--trait) solid var(--bordure); }
.bande img { width: calc(var(--u) * 12); height: calc(var(--u) * 12); }
.bande em { position: absolute; right: var(--u); bottom: 0; font-style: normal; font-size: var(--text-sm); line-height: var(--text-sm--line-height); font-weight: 700; text-shadow: 0 var(--trait) 0 var(--fond); }
.chen { display: grid; grid-template-columns: calc(var(--u) * 15) 1fr; gap: calc(var(--u) * 3); padding: calc(var(--u) * 3); flex: none; align-items: center; }
.chen img { width: calc(var(--u) * 15); height: calc(var(--u) * 15); }
.chen .pixel { color: var(--region-accent); font-size: var(--text-lg); line-height: var(--text-lg--line-height); }
.chen .zones { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: var(--ecart); }

/* Listes et pages */
.liste { display: flex; flex-direction: column; gap: var(--ecart); }
.ligne-p { display: flex; align-items: center; gap: calc(var(--u) * 3); min-height: calc(var(--u) * 16); padding: var(--u) calc(var(--u) * 3); background: var(--surface); border: var(--trait) solid var(--bordure); width: 100%; position: relative; }
.ligne-p > .corps { flex: 1; min-width: 0; }
.ligne-p .t { font-weight: 700; }
.ligne-p .s { font-size: var(--text-sm); line-height: var(--text-sm--line-height); color: var(--texte-doux); }
.ligne-p img.sp { width: calc(var(--u) * 12); height: calc(var(--u) * 12); flex: none; }
.ligne-p img.obj { width: calc(var(--u) * 15); height: calc(var(--u) * 15); flex: none; padding: calc(var(--u) * 1.5); background: var(--surface-2); }
.ligne-p .xp { height: var(--u); background: var(--fond); margin-top: var(--u); } .ligne-p .xp i { display: block; height: 100%; background: var(--info-base); }
.ligne-p.ferme { color: var(--texte-doux); background: var(--surface-2); border-style: dashed; }
.ligne-p.actuelle { background: var(--selection); border-color: var(--region-accent); }
.chips { display: flex; gap: var(--ecart); flex-wrap: wrap; }
.chips .plaque { flex: 1; padding-inline: var(--u); }
.sous-titre { font-family: var(--font-titre); font-weight: 600; font-size: var(--text-lg); line-height: var(--text-lg--line-height); color: var(--region-accent); margin-top: var(--u); }
.resume { display: grid; grid-template-columns: 1fr 1fr; gap: var(--ecart); padding: calc(var(--u) * 3); }
.resume b { display: block; font-family: var(--font-titre); font-weight: 600; font-size: var(--text-xl); color: var(--region-accent); line-height: var(--text-xl--line-height); }
.explique { display: flex; gap: calc(var(--u) * 3); padding: calc(var(--u) * 3); background: var(--alerte-fond); color: var(--alerte-texte); border: var(--trait) solid var(--alerte-base); }
.explique p { flex: 1; }
.grille-pc { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--ecart); }
.grille-pc button { display: flex; flex-direction: column; align-items: center; min-height: calc(var(--u) * 24); padding: var(--u); background: var(--surface); border: var(--trait) solid var(--bordure); font-size: var(--text-sm); line-height: var(--text-sm--line-height); }
.grille-pc img { width: calc(var(--u) * 12); height: calc(var(--u) * 12); }
.maquette { border: var(--trait) dashed var(--bordure); min-height: var(--cible); padding: var(--u) calc(var(--u) * 3); color: var(--texte-doux); font-size: var(--text-sm); line-height: var(--text-sm--line-height); width: 100%; }

/* Couches : feuille du bas, fenêtre, toast */
.voile { position: absolute; inset: 0; background: var(--voile); z-index: 20; }
.feuille { position: absolute; left: 0; right: 0; bottom: 0; max-height: 50%; z-index: 21; display: flex; flex-direction: column; gap: var(--ecart); padding: calc(var(--u) * 3) calc(var(--u) * 4) calc(var(--u) * 4); overflow-y: auto; animation: entre-bas var(--duration-lent) var(--ease-sortie); }
.fenetre { position: absolute; inset: var(--ecart); z-index: 22; display: flex; flex-direction: column; animation: entre-bas var(--duration-lent) var(--ease-sortie); }

/* Barre du bas (variantes A et B) */
.barre { flex: none; display: flex; gap: var(--ecart); padding-inline: calc(var(--u) * 4); background: var(--surface); border-top: var(--trait) solid var(--region-argent); box-shadow: inset 0 var(--trait) 0 var(--fond), inset 0 var(--u) 0 var(--region-argent); padding-top: var(--u); padding-bottom: env(safe-area-inset-bottom); }

/* A2 : variante A corrigée (retours de Nicolas, 05/11). Même jetons, même composants que commun.css. */
.art { image-rendering: auto; }

/* Chiffres clés : trois chiffres puis la ligne de zone avec ‹ › discrets */
.cles .cle.zone { flex: 1.6; }
.cles .cle.zone b { overflow: hidden; text-overflow: ellipsis; font-size: var(--text-lg); line-height: var(--text-lg--line-height); }
.zone-ligne { display: flex; align-items: center; gap: var(--ecart); margin-top: calc(var(--u) * -1); margin-bottom: calc(var(--u) * -2); }
.zone-ligne .centre { flex: 1; min-width: 0; text-align: center; }
.zone-ligne .centre b { display: block; font-family: var(--font-titre); font-weight: 600; font-size: var(--text-base); line-height: var(--text-base--line-height); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Combat A2 */
.capture { display: grid; gap: var(--ecart); flex: none; }

.dialogue { position: absolute; left: var(--ecart); right: var(--ecart); bottom: var(--ecart); z-index: 22; display: grid; grid-template-columns: calc(var(--u) * 15) 1fr; gap: calc(var(--u) * 3); padding: calc(var(--u) * 4); animation: entre-bas var(--duration-lent) var(--ease-sortie); }
.dialogue img { width: calc(var(--u) * 15); height: calc(var(--u) * 15); }
.dialogue .pixel { color: var(--region-accent); font-size: var(--text-lg); line-height: var(--text-lg--line-height); }
.dialogue .plaque { grid-column: 1 / -1; }
.dialogue .fleche { animation: rebond var(--duree-signal) var(--ease-standard) infinite; display: inline-block; }

/* Équipe en mode choix */
.bandeau-choix { position: sticky; top: calc(var(--u) * -3); z-index: 3; display: flex; align-items: center; gap: var(--ecart); padding: calc(var(--u) * 2) calc(var(--u) * 3); background: var(--info-fond); color: var(--info-texte); border: var(--trait) solid var(--info-base); margin-inline: calc(var(--u) * -1); }

/* Shop */
.onglets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--ecart); flex: none; }

/* Carte */
.carte-page { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--ecart); }

.zone { min-height: calc(var(--u) * 14); padding-block: 0; }
.zone.actuelle { background: var(--selection); border-color: var(--succes-base); }
.zone .marque { width: calc(var(--u) * 3); height: calc(var(--u) * 3); background: var(--succes-base); border-radius: var(--radius-plein); flex: none; }
.zone[aria-disabled="true"] { color: var(--texte-doux); background: var(--surface-2); border-style: solid; }

.mini-carte img { position: absolute; inset: 0; width: 100%; height: 100%; }
.cercle { position: absolute; width: calc(var(--u) * 3.5); height: calc(var(--u) * 3.5); margin: calc(var(--u) * -1.75) 0 0 calc(var(--u) * -1.75); border-radius: var(--radius-plein); border: var(--trait) solid var(--fond); background: color-mix(in srgb, var(--alerte-base) 55%, transparent); }
.cercle.ferme { background: color-mix(in srgb, var(--texte-doux) 55%, transparent); border-color: color-mix(in srgb, var(--fond) 60%, transparent); }
.cercle.actuel { background: var(--succes-base); border-color: var(--blanc); width: calc(var(--u) * 4.5); height: calc(var(--u) * 4.5); margin: calc(var(--u) * -2.25) 0 0 calc(var(--u) * -2.25); }
.vol { position: absolute; left: 0; top: 0; transition: transform var(--duree-signal) var(--ease-standard); width: calc(var(--u) * 6); height: calc(var(--u) * 6); margin: calc(var(--u) * -3) 0 0 calc(var(--u) * -3); border-radius: var(--radius-plein); background: var(--succes-base); border: var(--trait) solid var(--blanc); box-shadow: var(--shadow-sm); z-index: 2; }
.liste-zones.vole { pointer-events: none; opacity: .6; }
.centre-modal { position: absolute; inset: 0; z-index: 22; display: grid; place-items: center; padding: calc(var(--u) * 4); }
.modal { width: 100%; display: flex; flex-direction: column; gap: var(--ecart); padding: calc(var(--u) * 4); animation: entre-bas var(--duration-lent) var(--ease-sortie); }
.modal .tete { display: flex; align-items: center; gap: var(--ecart); }

.modal .plaque { justify-content: flex-start; min-height: calc(var(--u) * 14); font-weight: 700; }

/* Menu, parties, monde */
.partie-active { padding: calc(var(--u) * 4); display: grid; gap: var(--ecart); }
.partie-active .nom, .partie .nom { font-family: var(--font-titre); font-weight: 600; font-size: var(--text-xl); line-height: var(--text-xl--line-height); }
.etat-sauve { display: flex; align-items: center; gap: var(--ecart); color: var(--succes-texte); }

.partie { display: grid; gap: var(--u); padding: calc(var(--u) * 4); width: 100%; text-align: left; }
.partie.en-cours { border-color: var(--succes-base); }
.partie dl { display: grid; grid-template-columns: auto 1fr; gap: 0 calc(var(--u) * 3); }
.partie dt { color: var(--texte-doux); font-size: var(--text-sm); line-height: var(--text-sm--line-height); }
.partie dd { margin: 0; text-align: right; }
.tag { display: inline-block; padding: 0 var(--ecart); background: var(--succes-fond); color: var(--succes-texte); border: var(--trait) solid var(--succes-base); font-size: var(--text-sm); line-height: var(--text-sm--line-height); }
.partie.nouvelle { border-style: dashed; color: var(--texte-doux); display: flex; align-items: center; justify-content: center; gap: var(--ecart); min-height: calc(var(--u) * 16); }
.compte { padding: calc(var(--u) * 4); display: grid; gap: var(--ecart); }
.reglage { display: flex; align-items: center; gap: calc(var(--u) * 3); min-height: calc(var(--u) * 14); padding: var(--u) calc(var(--u) * 3); background: var(--surface); border: var(--trait) solid var(--bordure); }

.monde-kanto .legende { display: flex; align-items: center; gap: var(--ecart); padding: calc(var(--u) * 3); }

<body>
<div class="tel" id="tel"><header id="cles"></header><main class="ecran" id="ecran"></main><nav class="barre" id="barre" aria-label="Navigation principale"></nav><div id="couches"></div></div>
<script>
/* Contenu fictif commun aux quatre variantes (même texte partout : on compare des navigations, pas des contenus).
   Sprites et objets : images du dépôt, par chemin relatif (design/variantes/combat-v3/img). */
const IMG = "../combat-v3/img/";
const PK = {
  etat: { pcOuvert: false, pieces: 250000, pv: 152, pvMax: 152 },
  nf: (n) => n.toLocaleString("fr-FR"),
  chemins: {
    combat: "M3 3l5 1 12 14-3 3L4 8zM21 3l-5 1-5 6m-3 5-5 5m12-1 5-5M4 14l6 6",
    equipe: "M4 3h6v6H4zM14 3h6v6h-6zM4 15h6v6H4zM14 15h6v6h-6z",
    shop: "M4 8h16v13H4zM8 8V3h8v5M4 13h16M10 12v3h4v-3",
    carte: "m2 5 6-3 8 3 6-3v17l-6 3-8-3-6 3zM8 2v17M16 5v17",
    pc: "M3 4h18v12H3zM9 20h6M12 16v4",
    plus: "M3 10h3v4H3zM10 10h3v4h-3zM17 10h3v4h-3z",
    menu: "M4 6h16M4 12h16M4 18h16",
    croix: "M5 5l14 14M19 5 5 19",
    retour: "M15 4 7 12l8 8",
    cadenas: "M7 10V7a5 5 0 0 1 10 0v3M5 10h14v12H5z",
    sac: "M8 6V3h8v3M6 6h12l3 15H3zM7 13h10v5H7z",
    auto: "m13 2-9 12h7l-1 8 10-13h-7z",
    outils: "M4 6h16M4 12h16M4 18h16M8 3v6M16 9v6M10 15v6",
    pokedex: "M5 3h14v18H5zM9 8h6M9 12h6M9 16h3",
    badge: "m12 2 3 4 5 1-1 5 1 5-5 1-3 4-3-4-5-1 1-5-1-5 5-1z",
    reglages: "M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2",
    parties: "M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01",
    chevron: "m9 4 8 8-8 8",
    balle: "M3 12a9 9 0 0 1 18 0zM3 12a9 9 0 0 0 18 0zM3 12h18M12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z",
  },
  ic(nom, extra = "") { return `<svg class="ic ${extra}" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="${this.chemins[nom]}"/></svg>`; },

  cles() {
    const marques = Array.from({ length: 10 }, (_, i) => `<i class="${i === 0 ? "ici" : i === 9 ? "boss" : ""}"></i>`).join("");
    return `<header class="cles" aria-label="Chiffres clés">
      <div class="rang">
        <div class="cle large"><small>Pièces</small><b id="pieces">${this.nf(this.etat.pieces)}</b></div>
        <div class="cle"><small>DPS</small><b>${this.nf(40365)}</b></div>
        <div class="cle"><small>Zone</small><b>Route 1</b></div>
        ${this.suiteCles || ""}
      </div>
      <div class="etapes" role="img" aria-label="Étape 1 sur 10">${marques}<span>1/10</span></div>
    </header>`;
  },

  combat({ outils = true } = {}) {
    const team = [["1", 100], ["4", 100], ["16", 100], ["25", 100], ["26", 100], ["21", 100]]
      .map(([n, l]) => `<button type="button" data-go="equipe" aria-label="Pokémon ${n}, niveau ${l}"><img src="${IMG}${n}.png" width="96" height="96" alt=""><em>${l}</em></button>`).join("");
    return `
    <button type="button" class="scene cadre" id="scene" aria-label="Attaquer Rattata">
      <span class="info cadre"><span class="ligne"><span class="nom">Rattata</span><span>Niv. 2</span></span>
        <span class="pv" style="display:block"><i id="pv" style="--pv:100%"></i></span>
        <span class="pv-txt" id="pvtxt">PV ${this.etat.pv} / ${this.etat.pvMax}</span></span>
      <span class="socle"></span>
      <img class="rattata" src="${IMG}19.png" width="96" height="96" alt="">
      <span class="degat" id="degat">−412</span>
    </button>
    ${outils ? `<div class="outils">
      <button type="button" class="plaque vertical" data-act="capturer">${this.ic("balle")}Capturer<span class="pastille">×50</span></button>
      <button type="button" class="plaque vertical" aria-pressed="false" data-act="auto">${this.ic("auto")}Auto</button>
      <button type="button" class="plaque vertical" data-go="sac">${this.ic("sac")}Sac<span class="pastille">82</span></button>
      <button type="button" class="plaque vertical" data-go="outils">${this.ic("outils")}Outils</button>
    </div>` : ""}
    <div class="bande" aria-label="Ton équipe">${team}</div>
    <section class="chen cadre" aria-label="Prof. Chen">
      <img src="${IMG}chen-1.png" width="120" height="120" alt="">
      <div><p class="pixel">Prof. Chen</p><p>Les Rattata sont ici. Touche le Pokémon pour attaquer.</p></div>
      <div class="zones">
        <button type="button" class="plaque">Zone précédente</button>
        <button type="button" class="plaque action">Zone suivante</button>
      </div>
    </section>`;
  },

  equipe() {
    const lignes = [["1", "Florizarre", 100, 9420], ["4", "Dracaufeu", 100, 8910], ["16", "Roucool", 100, 5120], ["25", "Pikachu", 100, 8300], ["26", "Raichu", 100, 7615], ["21", "Piafabec", 100, 5000]]
      .map(([n, nom, l, d]) => `<button type="button" class="ligne-p"><img class="sp" src="${IMG}${n}.png" width="96" height="96" alt=""><span class="corps"><span class="t">${nom}</span><br><span class="s">Niv. ${l} · ${this.nf(d)} DPS</span><span class="xp" style="display:block"><i style="display:block;width:100%"></i></span></span>${this.ic("chevron")}</button>`).join("");
    return `<div class="liste">${lignes}</div>
      <button type="button" class="ligne-p" data-go="sac"><span class="corps"><span class="t">Sac</span><br><span class="s">82 objets · Bonbon rare, Repousse, Attaque +…</span></span>${this.ic("chevron")}</button>`;
  },

  shop() {
    const obj = [["poke-ball", "Poké Ball", "Une chance de capturer", "200"], ["great-ball", "Super Ball", "Capture plus sûre", "600"], ["ultra-ball", "Hyper Ball", "La meilleure des balles", "1 200"],
      ["repel", "Repousse", "Moins de rencontres, 15 s", "350"], ["x-attack", "Attaque +", "Dégâts ×1,5 pendant 30 s", "800"], ["rare-candy", "Bonbon rare", "+1 niveau", "4 800"],
      ["thunder-stone", "Pierre Foudre", "Fait évoluer Pikachu", "2 100"], ["leftovers", "Restes", "Auto-clic au repos", "12 000"]]
      .map(([i, nom, eff, prix]) => `<div class="ligne-p"><img class="obj" src="${IMG}${i}.png" width="30" height="30" alt=""><div class="corps"><div class="t">${nom}</div><div class="s">${eff}</div></div><button type="button" class="plaque" style="min-width:calc(var(--u)*24)" aria-label="Acheter ${nom}, ${prix} pièces">${prix} PO</button></div>`).join("");
    return `<div class="chips" role="group" aria-label="Catégories"><button type="button" class="plaque" aria-pressed="true">Tout</button><button type="button" class="plaque">Balles</button><button type="button" class="plaque">Soins</button><button type="button" class="plaque">Objets</button></div>
      <div class="liste">${obj}</div>`;
  },

  carte() {
    const z = [["Route 1 · Bourg Palette", "Zone 1", "actuelle"], ["Jadielle", "Zone 2", ""], ["Forêt de Jade", "Zone 3", "ferme"], ["Argenta", "Zone 4 · arène", "ferme"]];
    return `<div class="liste">${z.map(([n, s, c]) => `<button type="button" class="ligne-p ${c}"><span class="corps"><span class="t">${n}</span><br><span class="s">${s}${c === "actuelle" ? " · tu es ici" : ""}</span></span>${this.ic("chevron")}</button>`).join("")}</div>`;
  },

  /* Lignes du menu « Plus » : le PC verrouillé s'ouvre quand même pour dire pourquoi (comportement V1). */
  lignesPlus({ avecPc = true } = {}) {
    const ouvert = this.etat.pcOuvert;
    const pc = avecPc ? `<button type="button" class="ligne-p ${ouvert ? "" : "ferme"}" data-go="pc">${this.ic(ouvert ? "pc" : "cadenas")}<span class="corps"><span class="t">PC de Léo</span><br><span class="s">${ouvert ? "12 Pokémon rangés" : "Après l'arène d'Argenta"}</span></span>${this.ic("chevron")}</button>` : "";

  pc() {

  /* Interactions communes : toucher la scène, toast */
  scene(racine) {
    const s = racine.querySelector("#scene"); if (!s) return;
    s.addEventListener("click", () => {
      s.classList.remove("coup"); void s.offsetWidth; s.classList.add("coup");
      this.etat.pv -= 12; if (this.etat.pv <= 0) { this.etat.pv = this.etat.pvMax; this.etat.pieces += 150; const p = document.getElementById("pieces"); if (p) p.textContent = this.nf(this.etat.pieces); }
      racine.querySelector("#pv").style.setProperty("--pv", (this.etat.pv / this.etat.pvMax * 100) + "%");
      racine.querySelector("#pvtxt").textContent = `PV ${this.etat.pv} / ${this.etat.pvMax}`;

    racine.querySelectorAll("[data-act=auto]").forEach((b) => b.addEventListener("click", () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true")));
  },
  toast(texte, ms = 3000) {
    const t = document.createElement("div"); t.className = "toast cadre"; t.setAttribute("role", "status"); t.textContent = texte;
    document.getElementById("tel").appendChild(t); setTimeout(() => t.remove(), ms);

};

  const r = (t, v, on) => `<div class="reglage"><span>${t}</span><button type="button" class="plaque" aria-pressed="${on}" data-act="regl">${v}</button></div>`;
  return `<div class="titre-page"><button type="button" class="retour plaque" data-go="menu" aria-label="Retour">${PK.ic("retour")}</button><h1>Réglages</h1></div>
    <div class="liste">${r("Effets sonores", "Activés", true)}${r("Musique", "Activée", true)}${r("Thème", "Sombre", true)}${r("Arrêt auto", "Activé", true)}</div>`;
}

function ecranPc() {
  return `<div class="titre-page"><button type="button" class="retour plaque" data-go="equipe" aria-label="Retour">${PK.ic("retour")}</button><h1>PC de Léo</h1></div>${PK.pc()}`;
}

/* ---------- couches ---------- */
function couches() {
  let h = "";
  if (A2.sac) {
    const l = SAC.map(([i, nom, n, eff, cible]) => `<div class="ligne-p"><img class="obj" src="${IMG}${i}.png" width="30" height="30" alt=""><div class="corps"><div class="t">${nom} <span class="doux">×${n}</span></div><div class="s">${eff}${cible ? " · sur un Pokémon" : ""}</div></div><button type="button" class="plaque" data-act="utiliser" data-nom="${nom}" data-cible="${cible ? 1 : 0}">Utiliser</button></div>`).join("");
    h += `<div class="voile" data-act="fermer"></div><section class="fenetre sac cadre" role="dialog" aria-modal="true" aria-label="Sac"><div class="tete"><h2>Sac</h2><button type="button" class="plaque" data-act="fermer" aria-label="Fermer">${PK.ic("croix")}</button></div><div class="corps"><div class="liste">${l}</div></div></section>`;
  }
  if (A2.outils) {
    const r = (t, s, v, on) => `<div class="reglage"><span><b>${t}</b><br><span class="doux">${s}</span></span><button type="button" class="plaque" aria-pressed="${on}" data-act="regl">${v}</button></div>`;
    h += `<div class="voile" data-act="fermer"></div><section class="feuille cadre" role="dialog" aria-modal="true" aria-label="Outils"><div class="tete"><h2>Outils</h2><button type="button" class="plaque" data-act="fermer" aria-label="Fermer">${PK.ic("croix")}</button></div>
      <div class="liste">${r("Arrêt auto", "Coupe l'auto si le Pokémon est trop faible", "Activé", true)}${r("Arrêter après", "Durée sans capture", "10 min", false)}
      <div class="ligne-p ferme"><img class="obj" src="${IMG}PokeRadar.png" width="30" height="30" alt=""><span class="corps"><span class="t">Poké-Radar</span><br><span class="s">Bientôt</span></span></div>
      <div class="ligne-p ferme">${PK.ic("combat")}<span class="corps"><span class="t">Fauchage</span><br><span class="s">Bientôt</span></span></div></div></section>`;
  }
  if (A2.dialogue) {
    h += `<div class="voile" data-act="fermer"></div><section class="dialogue cadre" role="dialog" aria-modal="true" aria-label="Prof. Chen"><img src="${IMG}chen-1.png" width="120" height="120" alt="">
      <div><p class="pixel">Prof. Chen</p><p>Un Pokémon sauvage ! Touche-le pour l'attaquer. Quand il est affaibli, lance une Poké Ball.</p></div>
      <button type="button" class="plaque action" data-act="fermer">Compris <span class="fleche" aria-hidden="true">▸</span></button></section>`;
  }
  if (A2.cel) {
    const l = ["Arène", "Centre commercial", "Casino"].map((t) => `<button type="button" class="plaque" data-act="lieu" data-lieu="${t}">${t}${PK.ic("chevron")}</button>`).join("");
    h += `<div class="voile" data-act="fermer"></div><div class="centre-modal"><section class="modal cadre" role="dialog" aria-modal="true" aria-label="Céladopole"><div class="tete"><h2>Céladopole</h2><button type="button" class="plaque" data-act="fermer" aria-label="Fermer">${PK.ic("croix")}</button></div><p class="doux">Où veux-tu aller ?</p>${l}</section></div>`;
  }
  return h;
}

/* ---------- rendu ---------- */
function rendre() {
  document.getElementById("cles").innerHTML = cles();
  document.getElementById("barre").innerHTML = barre();
  const e = document.getElementById("ecran");
  const f = { combat: ecranCombat, equipe: ecranEquipe, pc: ecranPc, shop: ecranShop, carte: ecranCarte, menu: ecranMenu, parties: ecranParties, monde: ecranMonde, reglages: ecranReglages }[A2.page];
  e.innerHTML = f();
  e.classList.toggle("plein", A2.page === "carte");
  e.scrollTop = 0;
  document.getElementById("couches").innerHTML = couches();
  const s = e.querySelector("#scene");
  if (s) s.addEventListener("click", () => {
    s.classList.remove("coup"); void s.offsetWidth; s.classList.add("coup");
    PK.etat.pv -= 12; if (PK.etat.pv <= 0) PK.etat.pv = PK.etat.pvMax;
    e.querySelector("#pv").style.setProperty("--pv", (PK.etat.pv / PK.etat.pvMax * 100) + "%");
    e.querySelector("#pvtxt").textContent = `PV ${PK.etat.pv} / ${PK.etat.pvMax}`;
  });
}

function lancerVol(id, lieu) {
  const carte = document.getElementById("mini"); if (!carte || A2.enVol) return;
  A2.enVol = true; const tok = A2.tok;
  const w = carte.clientWidth, h = carte.clientHeight, a = Z(A2.zone), b = Z(id);
  const act = carte.querySelector(".cercle.actuel"); if (act) act.style.opacity = "0";
  const v = document.createElement("span"); v.className = "vol"; v.style.transform = `translate(${a.x * w}px, ${a.y * h}px)`;
  carte.appendChild(v); document.getElementById("liste-zones").classList.add("vole");
  void v.offsetWidth; v.style.transform = `translate(${b.x * w}px, ${b.y * h}px)`;
  setTimeout(() => {
    A2.enVol = false; if (tok !== A2.tok) return;
    A2.zone = id; A2.page = "combat"; rendre(); PK.toast(`Zone : ${b.nom}${lieu ? " · " + lieu : ""}`);
  }, 1150);
}
function voisine(sens) { const i = OUVERTES.indexOf(Z(A2.zone)) + sens; if (OUVERTES[i]) { A2.zone = OUVERTES[i].id; rendre(); } }

document.addEventListener("click", (ev) => {
  const g = ev.target.closest("[data-go]"), a = ev.target.closest("[data-act]");
  if (a && !a.closest("[aria-disabled=true]")) {
    const act = a.dataset.act; A2.tok++;
    if (act === "fermer") { A2.sac = A2.outils = A2.dialogue = A2.cel = false; }
    else if (act === "ball") A2.ball = (A2.ball + 1) % BALLS.length;
    else if (act.startsWith("ball-")) A2.ball = Number(act.slice(5));
    else if (act === "capturer") { PK.toast(`${BALLS[A2.ball][1]} lancée !`); return; }
    else if (act === "auto") A2.auto = !A2.auto;
    else if (act === "clic") A2.clic = !A2.clic;
    else if (act === "dialogue") A2.dialogue = true;
    else if (act === "regl") { a.setAttribute("aria-pressed", a.getAttribute("aria-pressed") !== "true"); return; }
    else if (act === "utiliser") {
      A2.sac = false;
      if (a.dataset.cible === "1") { A2.choix = a.dataset.nom; A2.page = "equipe"; } else PK.toast(`${a.dataset.nom} utilisé`);
    }
    else if (act === "annuler") { A2.choix = null; A2.page = "combat"; A2.sac = true; }
    else if (act === "cible") { PK.toast(`${A2.choix} utilisé sur ${a.dataset.nom}`); A2.choix = null; A2.page = "combat"; }
    else if (act === "fiche") { PK.toast(`Fiche de ${a.dataset.nom} : hors périmètre`); return; }
    else if (act.startsWith("onglet-")) A2.onglet = act.slice(7);
    else if (act === "acheter") { PK.toast(`${a.dataset.nom} acheté`); return; }
    else if (act === "zone-prec") return voisine(-1);
    else if (act === "zone-suiv") return voisine(1);
    else if (act === "zone") {
      if (A2.enVol) return;
      if (a.dataset.id === "arene-de-celadopole") { A2.cel = true; } else { return lancerVol(a.dataset.id); }
    }
    else if (act === "lieu") { const lieu = a.dataset.lieu; A2.cel = false; rendre(); return lancerVol("arene-de-celadopole", lieu); }
    else if (act === "sauver") { A2.sauve = "à l'instant"; PK.toast("Partie sauvegardée"); }
    else if (act === "deco") { PK.toast("Déconnexion : hors périmètre"); return; }
    else if (act === "nouvelle") { PK.toast("Nouvelle partie : hors périmètre"); return; }
    else if (act === "region-kanto") { A2.page = "combat"; A2.choix = null; rendre(); PK.toast("Kanto : retour à Route 1"); return; }
    else if (act === "debloquer-pc") { PK.etat.pcOuvert = true; A2.pcVu = false; PK.toast("PC débloqué ! Il est dans Équipe."); }
    else if (act === "verrouiller-pc") PK.etat.pcOuvert = false;
    return rendre();
  }
  if (!g) return;
  const go = g.dataset.go; A2.tok++; A2.choix = null;
  if (go === "sac") A2.sac = true;
  else if (go === "outils") A2.outils = true;
  else if (go === "a-venir") { PK.toast("Cet écran n'est pas dans cette maquette"); return; }
  else {
    if (go === "monde") A2.depuis = A2.page === "carte" ? "carte" : "menu";
    if (go === "pc") A2.pcVu = true;
    A2.page = go; A2.sac = A2.outils = A2.dialogue = A2.cel = false;
  }
  rendre();
});

function demarrer() {
  depart(location.hash.slice(1)); rendre();
  if (A2.volAuto) setTimeout(() => lancerVol(A2.volAuto), 400);
}
window.addEventListener("hashchange", demarrer);
demarrer();

</script>
</body>
</html>
