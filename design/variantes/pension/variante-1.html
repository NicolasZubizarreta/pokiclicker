:root { color-scheme:dark; --marge:calc(var(--spacing) * 4); --f:1; --fo:3; --bande-nav:calc(var(--spacing) * 14); }
@media (min-width:64rem) { :root { --marge:calc(var(--spacing) * 8); --f:2; --fo:4; } }
* { box-sizing:border-box; }
html { background:var(--fond); }
body { margin:0; background:var(--fond); color:var(--texte); font:400 var(--text-base)/var(--text-base--line-height) var(--font-texte); font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%; }
h1,h2,h3,h4,p,ul,ol,dl,dd,figure { margin:0; padding:0; }
ul,ol { list-style:none; }
h1,h2,h3,h4,.titre,b,strong { font-family:var(--font-titre); font-weight:700; }
h1 { font-size:var(--text-2xl); line-height:var(--text-2xl--line-height); }
h2 { font-size:var(--text-xl); line-height:var(--text-xl--line-height); }
h3 { font-size:var(--text-lg); line-height:var(--text-lg--line-height); }
button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
img { display:block; max-width:100%; }
a { color:var(--lien); }
:focus-visible { outline:calc(var(--spacing) * 0.75) solid var(--focus); outline-offset:var(--spacing); }
[hidden] { display:none !important; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
.px { image-rendering:pixelated; }
svg.ic { width:calc(var(--spacing) * 6); height:calc(var(--spacing) * 6); fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
svg.ic.p { width:calc(var(--spacing) * 5); height:calc(var(--spacing) * 5); }
svg.plein { fill:currentColor; stroke:none; }

/* Coquille : bandeau du haut, navigation (bas sur téléphone, colonne rouge à gauche sur PC) */
.coque { min-height:100dvh; padding-bottom:calc(var(--bande-nav) + env(safe-area-inset-bottom)); }
.bandeau { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:calc(var(--spacing) * 4); min-height:calc(var(--spacing) * 14); padding:0 var(--marge); background:var(--surface); }
.bandeau .lieu { margin-right:auto; font-weight:700; font-family:var(--font-titre); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chiffre { font-family:var(--font-titre); font-weight:700; color:var(--region-accent); white-space:nowrap; }
.bandeau .chiffre { font-size:var(--text-lg); }
.bandeau .doux { color:var(--texte-doux); font-size:var(--text-sm); }
.bandeau .raccourci { display:none; }
nav.principale { position:fixed; inset:auto 0 0 0; z-index:50; display:flex; height:calc(var(--bande-nav) + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom); background:var(--surface); }
nav.principale button { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:none; border:0; border-top:var(--spacing) solid transparent; padding:0; color:var(--texte-doux); font-size:var(--text-sm); }
nav.principale button[aria-current="page"] { background:var(--selection); color:var(--region-accent); border-top-color:var(--region-accent); font-weight:700; }
nav.principale .menu-principal, nav.principale .pc-seulement { display:none; }
nav.principale .marque { display:none; }
@media (min-width:64rem) {
  .coque { padding:0 0 0 calc(var(--spacing) * 60); }
  .bandeau { min-height:calc(var(--spacing) * 20); border-bottom:var(--spacing) solid var(--region-argent); }
  nav.principale { inset:0 auto 0 0; width:calc(var(--spacing) * 60); height:auto; padding:calc(var(--spacing) * 6) calc(var(--spacing) * 3); flex-direction:column; gap:var(--spacing); background:var(--action); color:var(--action-texte); }
  nav.principale .marque { display:block; padding:var(--spacing) calc(var(--spacing) * 3) calc(var(--spacing) * 6); font-family:var(--font-titre); font-weight:700; font-size:var(--text-xl); }
  nav.principale button { flex:none; flex-direction:row; justify-content:flex-start; gap:calc(var(--spacing) * 3); min-height:calc(var(--spacing) * 12); padding:0 calc(var(--spacing) * 3); border:0; border-radius:var(--radius-md); color:var(--action-texte); font-size:var(--text-base); }
  nav.principale button:hover { background:var(--action-survol); }
  nav.principale button[aria-current="page"] { background:var(--fond); color:var(--texte); }
  nav.principale .menu-principal { display:flex; margin-top:auto; }
  nav.principale .pc-seulement { display:flex; }
}

/* Composants : cadre à un seul contour, plaques (boutons), pastille, barre */
.cadre { background:var(--surface); border:calc(var(--spacing) / 2) solid var(--bordure); border-radius:var(--rayon); }
.cadre-alerte { background:var(--alerte-fond); border:calc(var(--spacing) / 2) solid var(--alerte-base); border-radius:var(--rayon); }
.cadre-info { background:var(--region-accent-fond); border:calc(var(--spacing) / 2) solid var(--region-accent); border-radius:var(--rayon); }
.plaque { position:relative; display:inline-flex; align-items:center; justify-content:center; gap:calc(var(--spacing) * 2); min-height:calc(var(--spacing) * 12); min-width:calc(var(--spacing) * 12); padding:var(--spacing) calc(var(--spacing) * 3); background:var(--region-accent-fond); color:var(--texte); border:calc(var(--spacing) / 2) solid var(--region-accent); border-radius:var(--radius-md); font-weight:700; text-align:center; transition:filter var(--duration-rapide) var(--ease-standard); }
.plaque:hover:not(:disabled) { filter:brightness(1.25); }
.plaque:active:not(:disabled) { filter:brightness(0.9); }
.plaque[aria-pressed="true"], .plaque[aria-current="true"] { background:var(--region-accent-fort); color:var(--blanc); }
.plaque:disabled { opacity:0.5; cursor:default; }
.plaque-action { background:var(--action); color:var(--action-texte); border-color:var(--action-survol); }
.plaque-action:hover:not(:disabled) { filter:none; background:var(--action-survol); }
.plaque-action:active:not(:disabled) { filter:none; background:var(--action-survol); }
.plaque.grand { min-height:calc(var(--spacing) * 14); font-size:var(--text-lg); }
.plaque.bloc { width:100%; }
.pastille { display:inline-flex; align-items:center; gap:calc(var(--spacing) * 2); min-height:calc(var(--spacing) * 8); padding:0 calc(var(--spacing) * 3); background:var(--region-accent-fond); border:calc(var(--spacing) / 2) solid var(--region-accent); border-radius:var(--radius-md); color:var(--texte); white-space:nowrap; }
.pastille b { color:var(--region-accent); }
.pastille.ok { background:var(--succes-fond); border-color:var(--succes-base); color:var(--succes-texte); }
.pastille.ok b { color:var(--succes-texte); }
.pastille.alerte { background:var(--alerte-fond); border-color:var(--alerte-base); color:var(--alerte-texte); }
.pastille.alerte b { color:var(--alerte-texte); }
.pastille.neutre { background:var(--surface-2); border-color:var(--bordure); color:var(--texte-doux); }
.exemple { display:inline-flex; align-items:center; min-height:calc(var(--spacing) * 6); padding:0 calc(var(--spacing) * 2); background:var(--alerte-fond); border:calc(var(--spacing) / 2) solid var(--alerte-base); border-radius:var(--radius-sm); color:var(--alerte-texte); font-size:var(--text-sm); font-weight:700; white-space:nowrap; }
.doux { color:var(--texte-doux); }
.rappel { color:var(--texte-doux); font-size:var(--text-sm); }

    coche: '<path d="m5 12 5 5 9-10"/>',
    verrou: '<path d="M5 10h14v11H5zM8 10V6a4 4 0 0 1 8 0v4"/>',
    cible: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
    oeuf: '<path d="M12 3c4 0 7 6 7 11a7 7 0 0 1-14 0c0-5 3-11 7-11z"/>',
    fissure: '<path d="M12 3c4 0 7 6 7 11a7 7 0 0 1-14 0c0-5 3-11 7-11zM6 13l3 2 2-3 2 3 3-2"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    livre:'<path d="M4 4h7a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H4zM20 4h-6M20 4v15h-6"/>'
  };
  function ic(n, c) { return '<svg class="ic ' + (c || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + ICONES[n] + '</svg>'; }
  var COEUR = '<svg class="coeur" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 3 12C-3 3 7-2 12 5c5-7 15-2 9 7Z"/></svg>';
  var DIAMANT = '<span class="diamant" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2 22 9 12 22 2 9z"/></svg></span>';
  var ETOILE = '<svg class="ic p plein" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/></svg>';
  var MARQUE = '<span class="marque-oeuf" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24">' + ICONES.fissure + '</svg></span>';

  var etat, ecouteurs = [], focusCle = null, rendre = function () {};
  function neuf(scenario) {
    var deja = scenario === 'palier' ? DEJA9 : DEJA;
    etat = {
      argent: 42000, emplacements: 3, parents: [true, true],
      oeufs: [{ pas: PASMAX }, { pas: 14 }, null, null, null],
      eclos: deja.slice(), derniere: null, filtre: 'toutes', statut: 'Dépose deux parents compatibles. Les œufs avancent seulement dans ton équipe.'
    };
    if (scenario === 'palier') etat.eclos = DEJA9.slice();
  }
  neuf();
  function nom(n) { return NOMS[n - 1]; }
  function nbEclos() { return etat.eclos.length; }
  function estEclos(n) { return etat.eclos.indexOf(n) >= 0; }
  function chance() { return etat.parents[0] && etat.parents[1] ? 4 : 0; }
  function prixSuivant() { return etat.emplacements * PRIX; }
  function sprite(n, o) { o = o || {}; return '<img class="px sprite ' + (o.cls || '') + '" src="' + IMG + 'sprites/pokemon' + (o.shiny ? '-shiny' : '') + '/' + n + '.png" width="96" height="96" alt="' + (o.alt || '') + '">'; }
  function portrait(n, cls, spriteCls) { return '<div class="portrait ' + (cls || '') + '" style="--m:' + PIEDS[n - 1] + '">' + sprite(n, { cls: (cls || '') + ' ' + (spriteCls || '') }) + '</div>'; }
  function portraitOeuf(alt) { return '<div class="portrait oeuf-p x1" style="--m:6">' + oeuf('x3', alt) + '</div>'; }
  function oeuf(cls, alt) { return '<img class="px oeuf-img ' + (cls || '') + '" src="' + IMG + 'objets/lucky-egg.png" width="30" height="30" alt="' + (alt === undefined ? 'Œuf' : alt) + '">'; }
  function barre(pas, max, cls) { return '<div class="barre ' + (pas >= max ? 'prete ' : '') + (cls || '') + '" role="progressbar" aria-valuemin="0" aria-valuemax="' + max + '" aria-valuenow="' + pas + '" aria-label="Combats gagnés avec l’œuf"><i style="--p:' + (pas / max) + '"></i></div>'; }
  function prochainPalier() { for (var i = 0; i < PALIERS.length; i++) if (nbEclos() < PALIERS[i].n) return PALIERS[i]; return null; }
  function etatPalier(p) { return nbEclos() >= p.n ? 'obtenu' : (prochainPalier() === p ? 'prochain' : 'verrouille'); }
  function palier(p) {
    var e = etatPalier(p);
    var lib = { obtenu: 'Obtenu', prochain: 'Prochain · encore ' + (p.n - nbEclos()), verrouille: 'Verrouillé' }[e];
    var pic = { obtenu: ic('coche', 'p'), prochain: ic('cible', 'p'), verrouille: ic('verrou', 'p') }[e];
    return '<li class="palier ' + e + '"><span class="etat-ic">' + pic + '</span><div><h4>' + p.n + ' espèces écloses</h4><p class="petit">' + lib + '</p></div><span class="gain">+' + p.d + ' ' + DIAMANT + '<span class="sr">diamants</span></span></li>';
  }
  function paliers() { return '<ol class="liste-paliers" style="display:grid;gap:calc(var(--spacing) * 2)" aria-label="Paliers de la collection">' + PALIERS.map(palier).join('') + '</ol>'; }
  function caseEspece(n) {
    var ec = estEclos(n), nv = etat.derniere === n;
    var num = 'N°' + nbsp + ('00' + n).slice(-3);
    return '<li class="case ' + (ec ? 'eclos' : 'non') + (nv ? ' nouveau' : '') + '" aria-label="' + (ec ? nom(n) + ', éclos' : num + ', pas encore éclos') + '"><img class="px" src="' + IMG + 'sprites/pokemon/' + n + '.png" width="96" height="96" alt="" loading="lazy"><span class="num">' + num + '</span>' + (ec ? '<span class="nom">' + nom(n) + '</span>' : '<span class="nom doux">?</span>') + '</li>';
  }
  function grille() {
    var out = [];
    for (var n = 1; n <= 151; n++) {
      if (etat.filtre === 'eclos' && !estEclos(n)) continue;
      if (etat.filtre === 'non' && estEclos(n)) continue;
      out.push(caseEspece(n));
    }
    return '<ul class="grille151" aria-label="Les 151 espèces">' + out.join('') + '</ul>';
  }
  function filtres() {
    var f = [['toutes', 'Toutes (151)'], ['eclos', 'Écloses (' + nbEclos() + ')'], ['non', 'À trouver (' + (151 - nbEclos()) + ')']];
    return '<div class="filtres" role="group" aria-label="Filtrer les espèces">' + f.map(function (x) { return '<button type="button" class="plaque" data-act="filtre" data-v="' + x[0] + '" data-focus="f-' + x[0] + '" aria-pressed="' + (etat.filtre === x[0]) + '">' + x[1] + '</button>'; }).join('') + '</div>';
  }
  function progressionPalier() {
    var p = prochainPalier();
    if (!p) return '<p><b>Collection complète.</b> Les 151 espèces ont éclos.</p>';
    return '<div class="progression-palier"><p>Encore <b>' + (p.n - nbEclos()) + '</b> espèces pour « ' + p.n + ' espèces écloses » : <b>+' + p.d + '</b> ' + DIAMANT + '</p>' + barre(nbEclos(), p.n, 'epaisse').replace('Combats gagnés avec l’œuf', 'Progression vers le prochain palier') + '</div>';
  }
  function compteur() { return '<span class="chiffre">' + nbEclos() + '/151</span>'; }

  /* ---- coquille ---- */
  function coquille() {
    var h = $('[data-bandeau]');
    if (h) {
      h.className = 'bandeau'; h.setAttribute('role', 'banner');
      h.innerHTML = '<span class="lieu">Pension · Bourg Palette</span><span class="chiffre" data-argent>' + fmt(etat.argent) + nbsp + '₽</span><span class="doux">Kanto</span>';
    }
    var n = $('[data-nav]');
    if (n) {
      var items = [['combat', 'Combat', 1, 0], ['equipe', 'Équipe', 0, 0], ['pc', 'PC', 0, 1], ['shop', 'Shop', 0, 0], ['carte', 'Carte', 0, 0], ['menu', 'Menu', 0, 0]];
      n.className = 'principale'; n.setAttribute('aria-label', 'Navigation principale');
      n.innerHTML = '<span class="marque">PokiClicker</span>' + items.map(function (i) { return '<button type="button" class="' + (i[3] ? 'pc-seulement' : '') + '"' + (i[2] ? ' aria-current="page"' : '') + '>' + ic(i[0]) + '<span>' + i[1] + '</span></button>'; }).join('') + '<button type="button" class="menu-principal">' + ic('retour') + '<span>Menu principal</span></button>';
    }
  }
  function majArgent() { $$('[data-argent]').forEach(function (e) { e.textContent = fmt(etat.argent) + nbsp + '₽'; }); }
  function dire(m) { etat.statut = m; $$('[data-statut]').forEach(function (e) { e.textContent = m; }); }

  /* ---- boîte d'éclosion ---- */
  var dlg, timers = [], enCours = false;
  function boite() {
    if (dlg) return dlg;
    dlg = document.createElement('dialog');
    dlg.className = 'eclosion'; dlg.setAttribute('aria-labelledby', 'ecl-titre');
    dlg.innerHTML = '<div class="ecl-corps"><div class="ecl-titre"><h2 id="ecl-titre"></h2><span class="exemple">exemple</span></div>' +
      '<div class="ecl-scene" data-etape="secousse"><span class="socle"></span>' + oeuf('', 'Œuf qui éclot') +
      '<svg class="fissures" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3 13 8 16 11 12 15 15 19 13 24"/><path d="M16 11 21 12M12 15 8 14"/></svg>' +
      '<img class="px nouveau-sprite" alt=""><span class="eclair"></span><i class="eclat"></i><i class="eclat"></i><i class="eclat"></i><i class="eclat"></i><i class="eclat"></i></div>' +
      '<div class="ecl-resultat" hidden></div>' +
      '<div class="ecl-actions"><button type="button" class="plaque" data-act="passer">Passer l’animation</button></div></div>';
    document.body.appendChild(dlg);
    dlg.addEventListener('close', apresFermeture);
    dlg.addEventListener('click', function (e) { var b = e.target.closest('[data-ecl]'); if (b) agirBoite(b.getAttribute('data-ecl')); });
    var p = $('[data-act="passer"]', dlg); p.addEventListener('click', function () { vider(); etape('revele'); });
    return dlg;
  }
  function vider() { timers.forEach(clearTimeout); timers = []; }
  function etape(e) {
    var sc = $('.ecl-scene', dlg); sc.setAttribute('data-etape', e);
    if (e === 'revele') { fin(); }
  }
  var pending = null;
  function fin() {
    enCours = false;
    var r = pending, n = ESPECE;
    var avant = nbEclos(), apres = avant, nouveau = !estEclos(n), paliersGagnes = [];
    if (r.prev) { r.nouveau = r.prev.nouveau; r.gagnes = r.prev.gagnes; r.apres = r.prev.apres; }
    else {
      if (nouveau) apres = avant + 1;
      PALIERS.forEach(function (p) { if (avant < p.n && apres >= p.n) paliersGagnes.push(p); });
      if (r.commit) {
        etat.oeufs[r.i] = null;
        if (nouveau) { etat.eclos.push(n); etat.derniere = n; }
        r.commit = false;
      }
      r.nouveau = nouveau; r.gagnes = paliersGagnes; r.apres = apres;
    }
    $('#ecl-titre', dlg).textContent = nom(n) + ' est né !';
    var res = $('.ecl-resultat', dlg); res.hidden = false;
    res.innerHTML = '<div class="ecl-compteur">' +
      '<span class="pastille">Niveau <b>1</b></span><span class="pastille">Mâle</span><span class="pastille">Bonheur <b>125</b></span>' + (r.shiny ? '<span class="pastille alerte">' + ETOILE + '<b>Chromatique !</b></span>' : '') + '</div>' +
      '<div class="ecl-marque cadre-alerte">' + MARQUE + '<div><strong>Marque d’éclosion · +5' + nbsp + '% de dégâts</strong><p>' + nom(n) + ' garde cette marque pour toujours. Un Pokémon ne la reçoit qu’une fois.</p></div></div>' +
      '<div class="ecl-compteur"><span class="pastille">Espèces écloses <b>' + r.apres + '/151</b></span>' + (r.nouveau ? '<span class="pastille ok">' + ic('coche', 'p') + 'Nouvelle espèce</span>' : '<span class="pastille neutre">Déjà dans ta collection</span>') + '</div>' +
      (r.gagnes.length ? r.gagnes.map(function (p) { return '<div class="cadre-info ecl-marque"><span class="marque-oeuf" style="color:var(--info-base);border-color:var(--info-base);background:var(--info-fond)">' + DIAMANT + '</span><div><strong>Succès obtenu : ' + p.n + ' espèces écloses</strong><p>+' + p.d + ' diamants reçus.</p></div></div>'; }).join('') : '');
    var img = $('.nouveau-sprite', dlg); img.src = IMG + 'sprites/pokemon' + (r.shiny ? '-shiny' : '') + '/' + n + '.png'; img.width = 96; img.height = 96;
    img.alt = nom(n) + (r.shiny ? ' chromatique' : '');
    var act = $('.ecl-actions', dlg);
    act.innerHTML = '<button type="button" class="plaque plaque-action grand" data-ecl="fermer" id="ecl-fermer">Continuer</button><button type="button" class="plaque grand" data-ecl="rejouer">' + (r.shiny ? 'Revoir en normal' : 'Revoir en chromatique') + '</button>';
    $('#ecl-fermer', dlg).focus();
    majArgent(); dire(nom(n) + ' éclot !');
  }
  function agirBoite(a) {
    if (a === 'fermer') dlg.close();
    if (a === 'rejouer') { var s = !pending.shiny; lancer({ i: pending.i, shiny: s, commit: false, rejeu: true, prev: { nouveau: pending.nouveau, gagnes: pending.gagnes, apres: pending.apres } }); }
  }
  function apresFermeture() { vider(); enCours = false; rendre(); var h = $('h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus(); } }
  function lancer(r) {
    boite(); pending = r; enCours = true; vider();
    $('#ecl-titre', dlg).textContent = 'Ton œuf bouge…';
    $('.ecl-resultat', dlg).hidden = true;
    $('.ecl-actions', dlg).innerHTML = '<button type="button" class="plaque grand" data-act="passer" id="ecl-passer">Passer l’animation</button>';
    $('#ecl-passer', dlg).addEventListener('click', function () { vider(); etape('revele'); });
    var sc = $('.ecl-scene', dlg); sc.setAttribute('data-etape', 'secousse');
    $('.nouveau-sprite', dlg).removeAttribute('src');
    if (!dlg.open) dlg.showModal();
    $('#ecl-passer', dlg).focus();
    if (reduit) { etape('revele'); return; }
    timers.push(setTimeout(function () { etape('fissure'); }, 1800));
    timers.push(setTimeout(function () { etape('eclair'); }, 2700));
    timers.push(setTimeout(function () { etape('revele'); }, 3000));
  }

  /* ---- actions de la page ---- */
  function agir(a, el) {
    var i = parseInt(el.getAttribute('data-i'), 10);
    if (a === 'eclore') { var o = etat.oeufs[i]; if (o && o.pas >= PASMAX) lancer({ i: i, shiny: false, commit: true }); return; }
    if (a === 'acheter') {
      if (etat.emplacements >= MAXEMP) return;
      var p = prixSuivant();
      if (etat.argent < p) { dire('Pas assez de Pokédollars : il en faut ' + fmt(p) + nbsp + '₽.'); return; }
      etat.argent -= p; etat.emplacements++;
      dire('Emplacement ouvert. Tu peux accueillir un œuf de plus.'); change('acheter');
      return;
    }
    if (a === 'parent') {
      var pr = etat.parents[i];
      etat.parents[i] = !pr;
      dire(pr ? 'Le parent rejoint ton équipe.' : 'Le parent rejoint la pension.');
      change('parent-' + i); return;
    }
    if (a === 'filtre') { etat.filtre = el.getAttribute('data-v'); change('f-' + etat.filtre); return; }
    if (a === 'reset') { neuf(el.getAttribute('data-v') || ''); change('reset'); return; }
    if (a === 'chromatique') { lancer({ i: 1, shiny: true, commit: false, rejeu: true }); return; }
  }
  function change(cle) { focusCle = cle || null; majArgent(); rendre(); dire(etat.statut); if (focusCle) { var e = document.querySelector('[data-focus="' + focusCle + '"]'); if (e) e.focus(); } }
  document.addEventListener('click', function (e) { var b = e.target.closest('[data-act]'); if (b && !b.closest('dialog')) agir(b.getAttribute('data-act'), b); });

  function outils() {
    return '<section class="cadre notice-exemple" aria-label="Outils de la maquette"><p><span class="exemple">exemple</span> Données d’exemple, rien n’est sauvegardé.</p><div class="rail" style="margin-top:calc(var(--spacing) * 2)">' +
      '<button type="button" class="plaque" data-act="reset" data-v="" data-focus="reset">Remettre l’exemple</button>' +
      '<button type="button" class="plaque" data-act="reset" data-v="palier" data-focus="reset-palier">Exemple : 9 espèces écloses</button>' +
      '<button type="button" class="plaque" data-act="chromatique" data-focus="chroma">Voir un chromatique</button></div></section>';
  }

  window.Pension = {
    get etat() { return etat; }, h: { ic: ic, COEUR: COEUR, DIAMANT: DIAMANT, ETOILE: ETOILE, MARQUE: MARQUE, sprite: sprite, portrait: portrait, portraitOeuf: portraitOeuf, oeuf: oeuf, barre: barre, paliers: paliers, palier: palier, grille: grille, filtres: filtres, progressionPalier: progressionPalier, compteur: compteur, outils: outils, fmt: fmt, nbsp: nbsp, nom: nom },
    PASMAX: PASMAX, PRIX: PRIX, MAXEMP: MAXEMP, PALIERS: PALIERS, nbEclos: nbEclos, chance: chance, prixSuivant: prixSuivant, prochainPalier: prochainPalier, etatPalier: etatPalier,
    init: function (r) { rendre = r; coquille(); rendre(); }
  };
})();

/* Variante 1 : « Le nid en scène » */
(function () {
  var P = window.Pension, h = P.h, e = P.etat;
  function parent(i) {
    var present = P.etat.parents[i];
    return '<article class="parent-carte cadre">' +
      (present
        ? h.portrait(25, 'x1') + '<div><h3>Pikachu</h3><p class="doux">' + (i ? 'Femelle · Niveau 22' : 'Mâle · Niveau 24') + '</p></div>'
        : '<div class="vide-parent">' + h.ic('cible') + '</div><div><h3>Place libre</h3><p class="doux">Choisis un parent dans ton équipe ou ton PC.</p></div>') +
      '<button type="button" class="plaque bloc" data-act="parent" data-i="' + i + '" data-focus="parent-' + i + '">' + (present ? 'Retirer Pikachu' : 'Déposer un parent') + '</button></article>';
  }
  function fente(i) {
    var s = P.etat, o = s.oeufs[i], num = i + 1;
    if (i >= s.emplacements) {
      var suivante = i === s.emplacements, prix = (i) * P.PRIX, ok = s.argent >= prix;
      return '<li class="fente cadre fermee"><div class="nid-vide">' + h.ic('verrou') + '</div><div class="fente-texte"><h3>Emplacement ' + num + ' · fermé</h3>' +
        (suivante
          ? '<p class="doux">' + (ok ? 'Un œuf de plus à la fois.' : 'Il te manque ' + h.fmt(prix - s.argent) + h.nbsp + '₽.') + '</p><button type="button" class="plaque" data-act="acheter" data-focus="acheter"' + (ok ? '' : ' disabled') + '>Ouvrir · ' + h.fmt(prix) + h.nbsp + '₽</button>'
          : '<p class="doux">Ouvre d’abord l’emplacement ' + i + '.</p><button type="button" class="plaque" disabled>Ouvrir · ' + h.fmt(prix) + h.nbsp + '₽</button>') + '</div></li>';
    }
    if (!o) return '<li class="fente cadre"><div class="portrait oeuf-p x1" style="--m:6"><span class="nid-vide-socle"></span></div><div class="fente-texte"><h3>Emplacement ' + num + ' · libre</h3><p class="doux">' + (P.chance() ? 'Le prochain œuf arrive avec 4' + h.nbsp + '% de chance par élimination.' : 'Dépose deux parents compatibles pour obtenir un œuf.') + '</p></div></li>';
    var pret = o.pas >= P.PASMAX;
    return '<li class="fente cadre' + (pret ? ' cadre-pret oeuf-pret' : '') + '"' + '>' + h.portraitOeuf(pret ? 'Œuf prêt à éclore' : 'Œuf en cours') + '<div class="fente-texte"><h3>Emplacement ' + num + ' · ' + (pret ? 'prêt à éclore' : 'en route') + '</h3>' +
      '<p class="doux">' + (pret ? '25/25 combats gagnés. Espèce inconnue jusqu’à l’éclosion.' : o.pas + '/25 combats gagnés · encore ' + (P.PASMAX - o.pas) + ' avec lui dans ton équipe.') + '</p>' + h.barre(o.pas, P.PASMAX) +
      (pret ? '<button type="button" class="plaque plaque-action grand" data-act="eclore" data-i="' + i + '" data-focus="eclore-' + i + '">Faire éclore l’œuf</button>' : '') + '</div></li>';
  }
  function rendre() {
    var s = P.etat, c = P.chance();
    document.getElementById('app').innerHTML =
      '<div class="entete"><div><h1>La pension</h1><p class="sous">Bourg Palette · Kanto</p></div><button type="button" class="plaque">Retour à Bourg Palette</button></div>' +
      '<div class="haut">' +
      '<div class="colonne-scene"><figure class="scene cadre" aria-label="Le paddock de la pension"><div class="scene-img"><img src="../../../public/img/decors/pension.webp" width="1920" height="1080" alt="La pension de Bourg Palette : un enclos d’herbe au centre, l’étagère aux œufs au fond"></div>' +
      '<span class="scene-chance pastille">' + h.COEUR.replace('class="coeur"', 'class="coeur petit"') + '<b>' + c + h.nbsp + '% par élimination</b></span>' +
      [0, 1].map(function (i) { return '<div class="sc-parent p' + i + '">' + (s.parents[i] ? h.portrait(25, '', i ? 'miroir' : '') : '<div class="portrait"><span class="place-libre">Place libre</span></div>') + '</div>'; }).join('') +
      (c ? '<span class="coeurs" aria-hidden="true">' + h.COEUR.replace('class="coeur"', 'class="coeur coeur-vole"') + '</span>' : '') +
      '</figure>' +
      '<div class="parents">' + parent(0) + parent(1) + '</div></div>' +
      '<section class="colonne-oeufs" aria-label="Œufs"><div class="ligne-titre"><h2>Les œufs · ' + s.oeufs.filter(Boolean).length + '/' + s.emplacements + '</h2><span class="pastille neutre">' + s.emplacements + ' emplacements ouverts sur 5</span></div>' +
      '<ul class="fentes">' + [0, 1, 2, 3, 4].map(fente).join('') + '</ul></section></div>' +
      '<section class="cadre collection" aria-labelledby="t-col"><div class="col-tete"><span class="marque-oeuf">' + h.ic('livre') + '</span><div><h2 id="t-col">Collection d’éclosions</h2><p class="doux">Chaque espèce éclose compte une fois, pour toujours.</p></div><div class="gros-compteur"><span class="chiffre">' + s.eclos.length + '/151</span><span class="doux">espèces écloses</span></div></div>' +
      h.progressionPalier() +
      '<div class="paliers">' + h.PALIERS_HTML() + '</div>' +
      h.filtres() + h.grille() + '</section>' +
      '<p role="status" class="cadre statut" data-statut>' + s.statut + '</p>' + h.outils();
  }
  h.PALIERS_HTML = function () { return P.PALIERS.map(h.palier).join(''); };
  P.init(rendre);
})();

</script>
