:root { color-scheme:dark; --marge:calc(var(--spacing) * 4); --f:1; --fo:3; --bande-nav:calc(var(--spacing) * 14); }
@media (min-width:64rem) { :root { --marge:calc(var(--spacing) * 8); --f:2; --fo:4; } }
* { box-sizing:border-box; }
html { background:var(--fond); }
body { margin:0; background:var(--fond); color:var(--texte); font:400 var(--text-base)/var(--text-base--line-height) var(--font-texte); font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%; }
h1,h2,h3,h4,p,ul,ol,dl,dd,figure { margin:0; padding:0; }
ul,ol { list-style:none; }
h1,h2,h3,h4,.titre,b,strong { font-family:var(--font-titre); font-weight:700; }
h1 { font-size:var(--text-2xl); line-height:var(--text-2xl--line-height); }
h2 { font-size:var(--text-xl); line-height:var(--text-xl--line-height); }
h3 { font-size:var(--text-lg); line-height:var(--text-lg--line-height); }
button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
img { display:block; max-width:100%; }
a { color:var(--lien); }
:focus-visible { outline:calc(var(--spacing) * 0.75) solid var(--focus); outline-offset:var(--spacing); }
[hidden] { display:none !important; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
.px { image-rendering:pixelated; }
svg.ic { width:calc(var(--spacing) * 6); height:calc(var(--spacing) * 6); fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
svg.ic.p { width:calc(var(--spacing) * 5); height:calc(var(--spacing) * 5); }
svg.plein { fill:currentColor; stroke:none; }

/* Coquille : bandeau du haut, navigation (bas sur téléphone, colonne rouge à gauche sur PC) */
.coque { min-height:100dvh; padding-bottom:calc(var(--bande-nav) + env(safe-area-inset-bottom)); }
.bandeau { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:calc(var(--spacing) * 4); min-height:calc(var(--spacing) * 14); padding:0 var(--marge); background:var(--surface); }
.bandeau .lieu { margin-right:auto; font-weight:700; font-family:var(--font-titre); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chiffre { font-family:var(--font-titre); font-weight:700; color:var(--region-accent); white-space:nowrap; }
.bandeau .chiffre { font-size:var(--text-lg); }
.bandeau .doux { color:var(--texte-doux); font-size:var(--text-sm); }
.bandeau .raccourci { display:none; }
nav.principale { position:fixed; inset:auto 0 0 0; z-index:50; display:flex; height:calc(var(--bande-nav) + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom); background:var(--surface); }
nav.principale button { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:none; border:0; border-top:var(--spacing) solid transparent; padding:0; color:var(--texte-doux); font-size:var(--text-sm); }
nav.principale button[aria-current="page"] { background:var(--selection); color:var(--region-accent); border-top-color:var(--region-accent); font-weight:700; }
nav.principale .menu-principal, nav.principale .pc-seulement { display:none; }
nav.principale .marque { display:none; }
@media (min-width:64rem) {
  .coque { padding:0 0 0 calc(var(--spacing) * 60); }
  .bandeau { min-height:calc(var(--spacing) * 20); border-bottom:var(--spacing) solid var(--region-argent); }
  nav.principale { inset:0 auto 0 0; width:calc(var(--spacing) * 60); height:auto; padding:calc(var(--spacing) * 6) calc(var(--spacing) * 3); flex-direction:column; gap:var(--spacing); background:var(--action); color:var(--action-texte); }
  nav.principale .marque { display:block; padding:var(--spacing) calc(var(--spacing) * 3) calc(var(--spacing) * 6); font-family:var(--font-titre); font-weight:700; font-size:var(--text-xl); }
  nav.principale button { flex:none; flex-direction:row; justify-content:flex-start; gap:calc(var(--spacing) * 3); min-height:calc(var(--spacing) * 12); padding:0 calc(var(--spacing) * 3); border:0; border-radius:var(--radius-md); color:var(--action-texte); font-size:var(--text-base); }
  nav.principale button:hover { background:var(--action-survol); }
  nav.principale button[aria-current="page"] { background:var(--fond); color:var(--texte); }
  nav.principale .menu-principal { display:flex; margin-top:auto; }
  nav.principale .pc-seulement { display:flex; }
}

/* Composants : cadre à un seul contour, plaques (boutons), pastille, barre */
.cadre { background:var(--surface); border:calc(var(--spacing) / 2) solid var(--bordure); border-radius:var(--rayon); }
.cadre-alerte { background:var(--alerte-fond); border:calc(var(--spacing) / 2) solid var(--alerte-base); border-radius:var(--rayon); }
.cadre-info { background:var(--region-accent-fond); border:calc(var(--spacing) / 2) solid var(--region-accent); border-radius:var(--rayon); }
.plaque { position:relative; display:inline-flex; align-items:center; justify-content:center; gap:calc(var(--spacing) * 2); min-height:calc(var(--spacing) * 12); min-width:calc(var(--spacing) * 12); padding:var(--spacing) calc(var(--spacing) * 3); background:var(--region-accent-fond); color:var(--texte); border:calc(var(--spacing) / 2) solid var(--region-accent); border-radius:var(--radius-md); font-weight:700; text-align:center; transition:filter var(--duration-rapide) var(--ease-standard); }
.plaque:hover:not(:disabled) { filter:brightness(1.25); }
.plaque:active:not(:disabled) { filter:brightness(0.9); }
.plaque[aria-pressed="true"], .plaque[aria-current="true"] { background:var(--region-accent-fort); color:var(--blanc); }
.plaque:disabled { opacity:0.5; cursor:default; }
.plaque-action { background:var(--action); color:var(--action-texte); border-color:var(--action-survol); }
.plaque-action:hover:not(:disabled) { filter:none; background:var(--action-survol); }
.plaque-action:active:not(:disabled) { filter:none; background:var(--action-survol); }
.plaque.grand { min-height:calc(var(--spacing) * 14); font-size:var(--text-lg); }
.plaque.bloc { width:100%; }
.pastille { display:inline-flex; align-items:center; gap:calc(var(--spacing) * 2); min-height:calc(var(--spacing) * 8); padding:0 calc(var(--spacing) * 3); background:var(--region-accent-fond); border:calc(var(--spacing) / 2) solid var(--region-accent); border-radius:var(--radius-md); color:var(--texte); white-space:nowrap; }
.pastille b { color:var(--region-accent); }
.pastille.ok { background:var(--succes-fond); border-color:var(--succes-base); color:var(--succes-texte); }
.pastille.ok b { color:var(--succes-texte); }
.pastille.alerte { background:var(--alerte-fond); border-color:var(--alerte-base); color:var(--alerte-texte); }
.pastille.alerte b { color:var(--alerte-texte); }
.pastille.neutre { background:var(--surface-2); border-color:var(--bordure); color:var(--texte-doux); }
.exemple { display:inline-flex; align-items:center; min-height:calc(var(--spacing) * 6); padding:0 calc(var(--spacing) * 2); background:var(--alerte-fond); border:calc(var(--spacing) / 2) solid var(--alerte-base); border-radius:var(--radius-sm); color:var(--alerte-texte); font-size:var(--text-sm); font-weight:700; white-space:nowrap; }
.doux { color:var(--texte-doux); }
.rappel { color:var(--texte-doux); font-size:var(--text-sm); }
.barre { height:calc(var(--spacing) * 2); background:var(--fond); border:calc(var(--spacing) / 2) solid var(--bordure); border-radius:var(--radius-sm); overflow:hidden; }

/* Marque d'éclosion */

/* Éclosion : fenêtre modale, scène de 4 temps (secousse, fissures, éclair, révélation) */

.ecl-scene .socle { position:absolute; z-index:-1; left:50%; bottom:calc(var(--spacing) * 16.5); width:calc(var(--spacing) * 40); height:calc(var(--spacing) * 10); transform:translateX(-50%); background:var(--region-socle); border-radius:var(--radius-plein); }

}

  .paliers .palier .gain { grid-column:1 / -1; }
}

/* Fenêtre « Choisir un parent » : feuille du bas sur téléphone, boîte centrée à partir de 48 rem */
dialog.choix { width:100%; max-width:100%; max-height:85dvh; margin:auto 0 0; padding:0; background:var(--surface); color:var(--texte); border:calc(var(--spacing) / 2) solid var(--bordure); border-radius:var(--radius-lg) var(--radius-lg) 0 0; overflow:auto; }
dialog.choix::backdrop { background:var(--fond); opacity:0.85; }
.ch-corps { display:grid; gap:calc(var(--spacing) * 3); padding:calc(var(--spacing) * 4); }
.ch-tete { display:flex; align-items:center; gap:calc(var(--spacing) * 3); }
.ch-tete h2 { margin-right:auto; }
.ch-ctx b { color:var(--region-accent); }
.ch-champ { display:grid; gap:var(--spacing); }
.ch-champ input { min-height:calc(var(--spacing) * 12); min-width:0; padding:0 calc(var(--spacing) * 3); background:var(--surface-2); color:var(--texte); border:calc(var(--spacing) / 2) solid var(--bordure); border-radius:var(--radius-md); font:inherit; }
.ch-champ input:focus-visible { border-color:var(--region-accent); }
.ch-sect { display:grid; gap:calc(var(--spacing) * 2); }
.ch-liste { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:calc(var(--spacing) * 2); }
.ch-item { display:grid; justify-items:center; align-content:start; gap:var(--spacing); width:100%; min-height:calc(var(--spacing) * 12); padding:calc(var(--spacing) * 2); background:var(--surface-2); color:var(--texte); border:calc(var(--spacing) / 2) solid var(--bordure); border-radius:var(--radius-md); text-align:center; }
.ch-item:hover { border-color:var(--region-accent); background:var(--region-accent-fond); }
.ch-item .doux { font-size:var(--text-sm); line-height:var(--text-sm--line-height); }
.compat { display:inline-block; padding:calc(var(--spacing) / 2) calc(var(--spacing) * 2); border:calc(var(--spacing) / 2) solid var(--bordure); border-radius:var(--radius-sm); font-size:var(--text-sm); line-height:var(--text-sm--line-height); background:var(--surface); color:var(--texte-doux); }
.compat.c4 { background:var(--succes-fond); border-color:var(--succes-base); color:var(--succes-texte); }
.compat.c2 { background:var(--region-accent-fond); border-color:var(--region-accent); color:var(--texte); }
.compat b { font-family:var(--font-titre); }
@media (min-width:48rem) {
  dialog.choix { width:min(calc(100vw - var(--spacing) * 8), calc(var(--spacing) * 200)); max-height:calc(100dvh - var(--spacing) * 8); margin:auto; border-radius:var(--rayon); }
  .ch-liste { grid-template-columns:repeat(3, minmax(0, 1fr)); }
}

    var pret = o.pas >= P.PASMAX;
    return '<li class="jeton carte' + (pret ? ' pret oeuf-pret' : '') + '"><span class="j-tete">' + h.oeuf('x2', pret ? 'Œuf prêt à éclore' : 'Œuf en cours') + '<span class="j-t"><strong>' + n + ' · ' + (pret ? 'prêt' : 'en route') + '</strong><span class="doux j-txt">' + o.pas + '/25 combats</span></span></span>' + h.barre(o.pas, P.PASMAX) +
      (pret ? '<button type="button" class="plaque plaque-action" data-act="eclore" data-i="' + i + '" data-focus="eclore-' + i + '">Faire éclore</button>' : '') + '</li>';
  }
  function jetonMini(i) {
    var s = P.etat, o = s.oeufs[i], n = i + 1, ico;
    if (i >= s.emplacements) return '<li class="jeton mini ferme">' + ic('verrou', 'p') + '<span class="n">' + n + '</span></li>';
    if (!o) return '<li class="jeton mini libre">' + ic('oeuf', 'p') + '<span class="n">' + n + '</span></li>';
    var pret = o.pas >= P.PASMAX;
    return '<li class="jeton mini' + (pret ? ' pret oeuf-pret' : '') + '">' + h.oeuf('', '') + '<span class="n">' + n + '</span></li>';
  }
  function scene() {
    var s = P.etat, grand = LARGE.matches, c = chance(), nb = s.oeufs.filter(Boolean).length;
    return '<figure class="decor cadre" aria-label="La salle de la pension"><img class="fond" src="' + U('decors/pension.webp') + '" width="1920" height="1080" alt="La pension de Bourg Palette : l’étagère aux œufs au fond, l’enclos d’herbe au centre">' +
      '<div class="chance voile">' + h.COEUR.replace('class="coeur"', 'class="coeur petit"') + '<span><b>' + c + nbsp + '% par élimination</b><span class="phrase doux">' + phraseChance() + '</span></span></div>' +
      '<span class="compte-oeufs voile">Œufs <b>' + nb + '/' + s.emplacements + '</b> · ' + s.emplacements + ' emplacements sur 5</span>' +
      parentScene(0) + parentScene(1) +
      (c ? '<span class="coeurs" aria-hidden="true">' + h.COEUR.replace('class="coeur"', 'class="coeur coeur-vole"') + '</span>' : '') +
      (grand ? '<ul class="jetons grand" aria-label="Emplacements d’œuf">' + [0, 1, 2, 3, 4].map(jetonGrand).join('') + '</ul>'
        : '<ul class="jetons" aria-hidden="true">' + [0, 1, 2, 3, 4].map(jetonMini).join('') + '</ul>') +
      '</figure>';
  }

  /* ---- sous la scène (téléphone et PC étroit) ---- */
  function carteParent(i) {
    var p = parents[i];
    return '<article class="parent-carte cadre">' +
      (p ? h.portrait(p.n, 'x1') + '<div><h3>' + nomDe(p) + '</h3><p class="doux">' + descr(p) + '</p></div>'
        : '<div class="vide-parent">' + ic('cible') + '</div><div><h3>Place libre</h3><p class="doux">Choisis un parent dans ton équipe ou ton PC.</p></div>') +
      '<button type="button" class="plaque bloc" data-b="' + (p ? 'retirer' : 'deposer') + '" data-i="' + i + '" data-focus="' + (p ? 'retirer-' : 'deposer-') + i + '">' + (p ? 'Retirer ' + nomDe(p) : 'Déposer un parent') + '</button></article>';
  }
  function fente(i) {
    var s = P.etat, o = s.oeufs[i], num = i + 1;
    if (i >= s.emplacements) {
      var f = fermee(i);
      return '<li class="fente cadre fermee"><div class="nid-vide">' + ic('verrou') + '</div><div class="fente-texte"><h3>Emplacement ' + num + ' · fermé</h3>' +
        (f.suiv ? '<p class="doux">' + (f.ok ? 'Un œuf de plus à la fois.' : 'Il te manque ' + h.fmt(f.prix - s.argent) + nbsp + '₽.') + '</p><button type="button" class="plaque" data-act="acheter" data-focus="acheter"' + (f.ok ? '' : ' disabled') + '>Ouvrir · ' + h.fmt(f.prix) + nbsp + '₽</button>'
          : '<p class="doux">Ouvre d’abord l’emplacement ' + i + '.</p><button type="button" class="plaque" disabled>Ouvrir · ' + h.fmt(f.prix) + nbsp + '₽</button>') + '</div></li>';
    }
    if (!o) return '<li class="fente cadre"><div class="portrait oeuf-p x1" style="--m:6"><span class="nid-vide-socle"></span></div><div class="fente-texte"><h3>Emplacement ' + num + ' · libre</h3><p class="doux">' + (chance() ? 'Le prochain œuf arrive avec ' + chance() + nbsp + '% de chance par élimination.' : 'Dépose deux parents compatibles pour obtenir un œuf.') + '</p></div></li>';
    var pret = o.pas >= P.PASMAX;
    return '<li class="fente cadre' + (pret ? ' cadre-pret oeuf-pret' : '') + '">' + h.portraitOeuf(pret ? 'Œuf prêt à éclore' : 'Œuf en cours') + '<div class="fente-texte"><h3>Emplacement ' + num + ' · ' + (pret ? 'prêt à éclore' : 'en route') + '</h3>' +
      '<p class="doux">' + (pret ? '25/25 combats gagnés. Espèce inconnue jusqu’à l’éclosion.' : o.pas + '/25 combats gagnés · encore ' + (P.PASMAX - o.pas) + ' avec lui dans ton équipe.') + '</p>' + h.barre(o.pas, P.PASMAX) +
      (pret ? '<button type="button" class="plaque plaque-action grand" data-act="eclore" data-i="' + i + '" data-focus="eclore-' + i + '">Faire éclore l’œuf</button>' : '') + '</div></li>';
  }
  function sousScene() {
    var s = P.etat;
    return '<div class="sous-scene"><section aria-label="Parents"><div class="ligne-titre"><h2>Les parents</h2></div><div class="parents">' + carteParent(0) + carteParent(1) + '</div></section>' +
      '<section aria-label="Œufs"><div class="ligne-titre"><h2>Les œufs · ' + s.oeufs.filter(Boolean).length + '/' + s.emplacements + '</h2><span class="pastille neutre">' + s.emplacements + ' emplacements ouverts sur 5</span></div><ul class="fentes">' + [0, 1, 2, 3, 4].map(fente).join('') + '</ul></section></div>';
  }

  function rendre() {
    if (vu !== P.etat) { vu = P.etat; reinit(); }
    var s = P.etat;
    document.getElementById('app').innerHTML =
      '<div class="entete"><div><h1>La pension</h1><p class="sous">Bourg Palette · Kanto</p></div><button type="button" class="plaque">Retour à Bourg Palette</button></div>' +
      '<div class="monde">' + scene() + (LARGE.matches ? '' : sousScene()) + '</div>' +
      '<section class="cadre collection" aria-labelledby="t-col"><div class="col-tete"><span class="marque-oeuf">' + ic('livre') + '</span><div><h2 id="t-col">Collection d’éclosions</h2><p class="doux">Chaque espèce éclose compte une fois, pour toujours.</p></div><div class="gros-compteur"><span class="chiffre">' + s.eclos.length + '/151</span><span class="doux">espèces écloses</span></div></div>' +
      h.progressionPalier() + '<div class="paliers">' + P.PALIERS.map(h.palier).join('') + '</div>' + h.filtres() + h.grille() + '</section>' +
      '<p role="status" class="cadre statut" data-statut>' + s.statut + '</p>' + h.outils();
  }
  LARGE.addEventListener('change', function () { if (!dlg || !dlg.open) { rendre(); } });

  /* ---- fenêtre « Choisir un parent » ---- */
  function norm(t) { return String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function filtrer(liste) {
    var r = norm(recherche.trim());
    return liste.filter(function (p) { return !r || norm(nomDe(p)).indexOf(r) >= 0 || ('00' + p.n).slice(-3).indexOf(r) >= 0 || String(p.n) === r; })
      .sort(function (a, b) { return a.n - b.n; });
  }
  function ligne(p) {
    var autre = parents[0];
    return '<li><button type="button" class="ch-item" data-b="pick" data-uid="' + p.uid + '" aria-label="Déposer ' + nomDe(p) + '">' + h.portrait(p.n, 'x1') +
      '<strong>' + nomDe(p) + '</strong><span class="doux">' + descr(p) + '</span>' + (autre ? badge(compat(autre, p)) : '') + '</button></li>';
  }
  function listes() {
    return [['Équipe', equipe], ['PC', pc]].map(function (x) {
      var l = filtrer(x[1]);
      return '<section class="ch-sect" aria-label="' + x[0] + '"><h3>' + x[0] + ' <span class="doux">· ' + x[1].length + '</span></h3>' +
        (l.length ? '<ul class="ch-liste">' + l.map(ligne).join('') + '</ul>' : '<p class="doux">Aucun Pokémon.</p>') + '</section>';
    }).join('');
  }
  function ouvrir(opener) {
    retourFocus = opener || null;
    if (!dlg) {
      dlg = document.createElement('dialog');
      dlg.className = 'choix'; dlg.setAttribute('aria-labelledby', 'ch-titre');
      document.body.appendChild(dlg);
      dlg.addEventListener('close', function () { var e = retourFocus && document.querySelector('[data-focus="' + retourFocus + '"]'); if (e) e.focus(); });
      dlg.addEventListener('click', function (ev) {
        var b = ev.target.closest('[data-b]'); if (!b) return;
        if (b.getAttribute('data-b') === 'annuler') dlg.close();
        if (b.getAttribute('data-b') === 'pick') choisir(b.getAttribute('data-uid'));
      });
      dlg.addEventListener('input', function (ev) { if (ev.target.id === 'ch-rech') { recherche = ev.target.value; document.getElementById('ch-listes').innerHTML = listes(); } });
    }
    recherche = '';
    var autre = parents[0];
    dlg.innerHTML = '<div class="ch-corps"><div class="ch-tete"><h2 id="ch-titre">Choisir un parent</h2><span class="exemple">exemple</span><button type="button" class="plaque" data-b="annuler">Annuler</button></div>' +
      '<p class="ch-ctx">' + (autre
        ? 'Parent ' + (parents.length + 1) + ' sur 2. Il part avec <b>' + nomDe(autre) + '</b>, ' + descr(autre).toLowerCase() + '. Chaque ligne montre la chance de ponte du couple.'
        : 'Parent 1 sur 2. Dépose un premier parent : la chance de ponte s’affichera avec le second.') + '</p>' +
      '<div class="ch-champ"><label for="ch-rech">Nom ou numéro</label><input id="ch-rech" type="search" autocomplete="off" enterkeyhint="search"></div>' +
      (autre ? '<p class="rappel">4 % : même espèce de sexes opposés, ou Métamorph · 2 % : un type en commun · 0 % sinon.</p>' : '') +
      '<div id="ch-listes">' + listes() + '</div></div>';
    dlg.showModal();
    var c = document.getElementById('ch-rech'); if (c) c.focus();
  }
  function choisir(uid) {
    var liste = equipe.some(function (p) { return p.uid === uid; }) ? equipe : pc;
    var i = liste.map(function (p) { return p.uid; }).indexOf(uid);
    if (i < 0 || parents.length >= 2) return;
    var p = liste.splice(i, 1)[0];
    parents.push(p); nouveau = parents.length - 1;
    P.etat.statut = nomDe(p) + ' rejoint la pension.';
    var cle = 'retirer-' + nouveau;
    retourFocus = cle;
    dlg.close(); rendre();
  }
  function retirer(i) {
    var p = parents[i]; if (!p) return;
    parents.splice(i, 1); nouveau = -1;
    var versEquipe = equipe.length < TAILLE_EQUIPE;
    (versEquipe ? equipe : pc).push(p);
    P.etat.statut = nomDe(p) + ' rejoint ' + (versEquipe ? 'ton équipe' : 'PC (équipe pleine)') + '.';
    rendre();
    var e = document.querySelector('[data-focus="deposer-' + parents.length + '"]') || document.querySelector('h1'); if (e) e.focus();
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-b]'); if (!b || b.closest('dialog')) return;
    var a = b.getAttribute('data-b');
    if (a === 'deposer') { ouvrir(b.getAttribute('data-focus')); }
    if (a === 'retirer') { retirer(parseInt(b.getAttribute('data-i'), 10)); }
  });
  P.init(rendre);
})();



</script>
</body>
</html>
