<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartes de Kanto à comparer</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #131a23; color: #e8ecf1; font: 16px/1.4 system-ui, sans-serif; }
  h1 { font-size: 1.25rem; margin: 0 0 16px; }
  .grille { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
  figure { margin: 0; background: #1f2937; padding: 12px; }
  img { display: block; width: 100%; height: auto; image-rendering: pixelated; background: #000; }
  figcaption { margin-top: 8px; font-size: 0.9rem; }
  figcaption b { display: block; font-size: 1rem; }
  a { color: #9ec5ff; }
</style>
</head>
<body>
<h1>Cartes de Kanto à comparer</h1>
<div class="grille">
  <figure>
    <img src="/img/decors/carte-kanto.webp" alt="Carte actuelle du jeu (V1)" width="1920" height="1080">
    <figcaption><b>Actuelle : carte de ta V1</b>Town Map de FireRed/LeafGreen, recadrée sans cadre de console, agrandie.</figcaption>
  </figure>
  <figure>
    <img src="frlg-town-map.png" alt="Town Map FireRed et LeafGreen avec son cadre de console" width="240" height="160">
    <figcaption><b>1 · FireRed / LeafGreen (240 × 160)</b>La même carte que la tienne, avec le cadre de la console. Source : <a href="https://archives.bulbagarden.net/wiki/File:KantoTownMap.png">Bulbagarden Archives, KantoTownMap.png</a>.</figcaption>
  </figure>
  <figure>
    <img src="rby-town-map.png" alt="Town Map de Pokémon Rouge, Bleu et Jaune" width="160" height="136">
    <figcaption><b>2 · Rouge / Bleu / Jaune (160 × 136)</b>La Town Map de 1996, deux tons et traits nets. Source : <a href="https://archives.bulbagarden.net/wiki/File:Kanto_Town_Map_RBY.png">Bulbagarden Archives, Kanto_Town_Map_RBY.png</a>.</figcaption>
  </figure>
  <figure>
    <img src="hgss-pokegear.png" alt="Carte du Pokégear de HeartGold et SoulSilver, région de Kanto" width="254" height="190">
    <figcaption><b>3 · HeartGold / SoulSilver (254 × 190)</b>La carte du Pokégear, en couleur, avec l'interface de la DS autour. Source : <a href="https://archives.bulbagarden.net/wiki/File:Pok%C3%A9gear_Map_HGSS.png">Bulbagarden Archives, Pokégear_Map_HGSS.png</a>.</figcaption>
  </figure>
</div>
</body>
</html>
