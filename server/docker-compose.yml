services:
  postgres:
    image: postgres:18@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
    restart: unless-stopped
    environment:
      POSTGRES_DB: pokiclicker
      POSTGRES_USER: pokiclicker
      POSTGRES_PASSWORD: mot-de-passe-local-factice
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokiclicker -d pokiclicker"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    restart: unless-stopped
    # Durcissement : système de fichiers en lecture seule, aucune capacité Linux, pas d'élévation de droits, ressources bornées.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://pokiclicker:mot-de-passe-local-factice@postgres:5432/pokiclicker
      BETTER_AUTH_SECRET: secret-local-factice-a-ne-jamais-utiliser-en-production
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:5173
    # La migration est lancée par le CMD de l image.
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  postgres:
